# Planted-bad-input controls for spar's CI checks, run by `plant`
# (pulseengine/plant). Each control overlays its `plant` directory onto a
# scratch copy of HEAD, runs `run`, and must see it fail; plant also runs the
# same command on the unplanted copy first and requires that to pass.

[[control]]
id = "weekly-red-step"
check = "Verification (every stepped feature, weekly)"
# The baseline selects one real, cheap stepped feature so it is green without
# the plant; the plant adds a feature whose step exits 1.
run = """tools/run_verification.py --results-json /dev/null --filter '(or (= id "PLANT-WEEKLY-RED-STEP") (= id "TEST-GUARD-CHANGED-PATHS"))'"""
plant = "ci-controls/weekly-red-step"
expect = "fail"
stderr_or_stdout_matches = 'PLANT-WEEKLY-RED-STEP'

[[control]]
id = "claims-unledgered-overclaim"
check = "Format"
# plant only overlays files, so the planted line is appended by `run` when the
# plant put it there; on the baseline copy the file is absent and README.md is
# checked as committed.
run = """if [ -f ci-controls-planted-readme.md ]; then cat ci-controls-planted-readme.md >> README.md; fi; tools/check_claims.py"""
plant = "ci-controls/claims-unledgered-overclaim"
expect = "fail"
stderr_or_stdout_matches = 'UNLEDGERED README\.md:\d+: .spar is production-grade'

[[control]]
id = "claims-count-drift"
check = "Format"
# A 24th crate under crates/ makes README.md's "23 crates" claim unbacked.
run = "tools/check_claims.py"
plant = "ci-controls/claims-count-drift"
expect = "fail"
stderr_or_stdout_matches = 'UNBACKED   README-CRATES: 24 files'

[[control]]
id = "weekly-step-timeout"
check = "Verification (every stepped feature, weekly)"
# The plant adds a feature whose step sleeps past a 30-second --step-timeout;
# the runner must kill it and fail the artifact. Without the plant only the
# cheap real feature matches, which passes; it takes about 4 s under
# `taskpolicy -b`, so a tighter limit makes the baseline itself flaky.
run = """tools/run_verification.py --results-json /dev/null --step-timeout 30 --filter '(or (= id "PLANT-WEEKLY-STEP-TIMEOUT") (= id "TEST-GUARD-CHANGED-PATHS"))'"""
plant = "ci-controls/weekly-step-timeout"
expect = "fail"
stderr_or_stdout_matches = 'failed \(timed out after 30s\): sleep 300'

[[control]]
id = "verify-gate-release-scoped"
check = "Verification Gate (rivet-driven)"
# The release half of the per-PR default, computed by the gate's own script for
# a release nothing real carries (v9.9.9), plus one cheap real feature so the
# baseline passes. The plant adds a v9.9.9 feature whose step exits 1, which
# the release half must select and fail.
run = '''tools/run_verification.py --results-json /dev/null --filter "(or $(tools/verification_default_filter.py --release v9.9.9 | sed -n 's/^release_filter=//p') (= id \"TEST-GUARD-CHANGED-PATHS\"))"'''
plant = "ci-controls/verify-gate-release-scoped"
expect = "fail"
stderr_or_stdout_matches = '\[FAIL\] PLANT-GATE-RELEASE-RED'

[[control]]
id = "runner-guard-unguarded"
check = "Format"
# The plant adds a pull_request workflow whose self-hosted job carries no fork
# guard; the checker must name it.
run = "cargo run -q --locked -p spar-check-runner-guard"
plant = "ci-controls/runner-guard-unguarded"
expect = "fail"
stderr_or_stdout_matches = 'UNGUARDED zz-plant-unguarded\.yml:8 runs-on: \[self-hosted, linux, x64, light\]'

[[control]]
id = "kani-ledger-unlisted"
check = "Format"
# The plant adds a Kani harness with one kani::assume the ledger does not list;
# the checker must name it.
run = "cargo run -q --locked -p spar-check-kani-ledger"
plant = "ci-controls/kani-ledger-unlisted"
expect = "fail"
stderr_or_stdout_matches = 'UNLISTED source crates/spar-solver/tests/zz_plant_kani\.rs kani-assume zz_plant_harness'
