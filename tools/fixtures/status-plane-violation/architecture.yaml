# Fixture for tools/check_release_plane.py — NOT part of the real trace.
#
# The falsification edge for the SECOND core field, `status:` (#375).
# TEST-GUARD-STATUS-PLANE runs the checker against this directory and requires
# exit 1, so a regression that drops `status` from the field list — or that
# stops discriminating on plane — turns the gate red instead of green.
#
# Two artifacts, deliberately differing ONLY in where `status:` sits. This is
# the ARCH-026-class defect from safety/stpa/architecture.yaml: a `status:`
# written into the `fields:` bag is valid YAML, tolerated by the schema, and
# completely invisible to rivet's `status-allowed-values` check and to every
# lifecycle query — the #370 `release:` failure one field over. Requiring
# exactly one finding (nested=1) with the sibling top-level `status:` NOT
# reported (visible=1) pins both edges at once: a checker that greps for
# `status:` would report both, and one that reported neither would also "pass"
# a one-sided fixture.
artifacts:
  - id: FIXTURE-STATUS-PLANE-NESTED
    type: design-decision
    title: status recorded inside the fields bag (must be reported)
    description: >
      Represents the #375 failure: six design-decision statuses in
      safety/stpa/architecture.yaml were written into the `fields:` extension
      bag as `status: planned`, where rivet's query surface cannot read them.
      They validated as nothing and answered no lifecycle query.
    fields:
      rationale: fixture
      status: planned

  - id: FIXTURE-STATUS-PLANE-VISIBLE
    type: design-decision
    status: proposed
    title: status on the artifact's own key plane (must NOT be reported)
    description: >
      Identical to the artifact above except for the indentation of the
      `status:` line. This is the correct placement — a sibling of `id:` and
      `type:`, which is where rivet's query surface reads it. Its presence here
      is what forces the check to discriminate on plane rather than on the key.
    fields:
      rationale: fixture
