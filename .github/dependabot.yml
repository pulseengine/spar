version: 2
# Groups live inside each updates entry: Dependabot rejects a top-level
# `groups:` key and YAML aliases (&ref_0 / *ref_0), and with either one it
# ignores the whole file. One cargo entry lists every directory, so a grouped
# release opens one PR and not one per directory.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
      - /crates/spar-analysis
      - /crates/spar-annex
      - /crates/spar-base-db
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
          - "walrus"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
  - package-ecosystem: npm
    directory: /vscode-spar
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /tests/playwright
    schedule:
      interval: weekly
    labels:
      - dependencies
