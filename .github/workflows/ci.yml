name: CI

# Cancel superseded PR runs; never cancel runs on main / tags / scheduled
# events. See docs/ci-concurrency.md (or the org-wide CI concurrency brief)
# for rationale.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Change detection ──────────────────────────────────────────────────
  # A diff that only touches rivet artifacts, STPA files, or documentation
  # cannot affect a proof, a mutant, a fuzz target, or a Miri run — but the
  # heavy jobs still cost hours of self-hosted runner time on every such PR.
  # This job classifies the diff once; the expensive jobs below consume it.
  #
  # The heavy jobs are SKIPPED, never removed: a job-level `if:` reports a
  # `skipped` conclusion, which satisfies a required status check, so the
  # branch-protection gate stays non-empty and intact. Filtering at the
  # workflow level (`on: paths:`) would instead leave required checks
  # permanently *pending* and block every merge — do not do that here.
  #
  # Fail-safe direction: anything unrecognised counts as code, so a new
  # top-level path runs the full suite until it is deliberately allow-listed.
  changes:
    name: Detect changed paths
    runs-on: [self-hosted, linux, x64, light]
    # Trivial classifier (observed <=15s), but it gates 10 of the other jobs, so
    # a wedge here stalls the whole suite. 5m is a generous ceiling vs the 360m
    # default. Enforced by tools/check_job_timeouts.py (#398).
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs FIRST, for the same reason as the other guardrail self-tests: a
      # classifier whose own tests fail must not be trusted to decide which
      # required checks run.
      - name: Changed-path classifier self-test
        run: tools/classify_changed_paths.py --self-test

      # The allow-list, the fail-closed behaviour and the rationale all live in
      # tools/classify_changed_paths.py, which proofs.yml calls too — the two
      # copies of this logic had already drifted (#379's `rivet.yaml` entry
      # existed here and not there), which is why it is single-sourced now.
      #
      # This step is ONE command on purpose. The old body computed a count in a
      # subshell and let `[ "$n_code" -gt 0 ]` decide; when grep failed for any
      # reason the count was empty, the test exited 2, bash read that as false
      # inside `if`, and the step emitted `code=false` and exited 0 — skipping
      # 10 required checks (#384). The script therefore appends to
      # $GITHUB_OUTPUT itself rather than returning a value for the shell to
      # interpolate. Any `$(...)`, `||` or `-gt` reappearing in this step is
      # that bug coming back.
      #
      # The two event values go through `env:` rather than being interpolated
      # into the command text. Neither is attacker-controlled (`event_name` is a
      # GitHub enum, `base.sha` a computed 40-hex sha), but `${{ }}` substitutes
      # into the script *before* bash parses it, while an env var is only ever a
      # value. Same reason the rest of this repo's workflows do it.
      - id: filter
        name: Classify diff as code vs artifacts/docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          tools/classify_changed_paths.py
          --event-name "$EVENT_NAME"
          --base-sha "$BASE_SHA"
          --github-output "$GITHUB_OUTPUT"

  # ── Fast checks ───────────────────────────────────────────────────────
  # fmt / audit / deny / rivet-validate deliberately have NO `changes` gate:
  # they are cheap, and rivet-validate is precisely the check an
  # artifacts-only PR needs to pass.
  fmt:
    name: Format
    runs-on: [self-hosted, linux, x64, light]
    # fmt across every workspace (observed <=40s). Cap far under the 360m default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # `cargo fmt --all` means "all members of THIS workspace", not "all
      # crates in the repo". fuzz/, codegen-exec-oracle/ and
      # codegen-kiln-oracle/ each carry their own `[workspace]` table, so the
      # root's --all never opened them — and this required check reported green
      # on main over an unformatted fuzz_codegen_roundtrip.rs (#383). A gate
      # that prints nothing on success cannot distinguish "checked everything"
      # from "checked a subset"; the replacement always prints the count.
      #
      # Self-test first, as with the other guardrails: the decision table
      # carries the #383 regression itself (root clean + fuzz/ dirty must exit
      # 1), so the gate proves it can still fail before it may pass.
      - name: Format guardrail self-test
        run: tools/check_fmt_workspaces.py --self-test
      - name: Format (every workspace in the repo)
        # Discovers the workspace set rather than listing it, and floors the
        # count at 4. A hard-coded list would fix today's bug and re-open it
        # the day someone adds a fifth workspace.
        run: tools/check_fmt_workspaces.py

  clippy:
    name: Clippy
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # Workspace clippy (observed ~21m on a cold cache). 45m is ~2x that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # REQ-GUARD-GATE-EVIDENCE-002 (g), the clippy half of #383.
      # `cargo clippy --workspace` means "all members of THIS workspace" — the
      # same scope `cargo fmt --all` had — so this linted 1 of the repo's 4
      # workspaces and reported green for all of them. The checker reuses
      # check_fmt_workspaces' discovery rather than copying it: one definition,
      # two callers, because a fact duplicated in two files is what made #381
      # possible. Self-test first, same as every guardrail here.
      - name: Clippy-scope guardrail self-test
        run: tools/check_clippy_workspaces.py --self-test
      - run: tools/check_clippy_workspaces.py

  # ── Tests ─────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # nextest across the workspace (observed ~7.5m). 30m absorbs a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests (JUnit XML output)
        run: cargo nextest run --workspace --profile ci
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # ── Codegen compile oracle (the #[ignore] gates) ────────────────────
  # `cargo nextest`/`cargo test` above do NOT run #[ignore] tests, so the
  # compiler-enforced codegen oracles (emitted_crate_cargo_checks,
  # emitted_dataplane_crate_cargo_checks, emitted_crate_builds_to_wasm32_wasip2)
  # would otherwise never gate in CI. They shell out to cargo to build a generated
  # crate — including to wasm32-wasip2 — so this job installs that target and runs
  # the ignored set. Then the out-of-workspace `codegen-exec-oracle` RUNS the
  # generated component under wasmtime and asserts a value flows In->Out across the
  # WIT ABI (the runtime data-flow gate; wasmtime is kept out of the main workspace
  # build). REQ-CODEGEN-WIT-RECORDS-001/002 (#319), REQ-CODEGEN-WIT-DATAPLANE-001.
  codegen-oracle:
    name: Codegen compile oracle
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # Generated-crate + wasmtime/kiln runtime oracles (observed ~27m cold). 60m ~2x.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Run generated-crate compile oracles (ignored tests)
        run: cargo test -p spar-codegen --test lifecycle_bindings -- --ignored
      - name: Run wasmtime runtime data-flow oracle (REQ-CODEGEN-WIT-DATAPLANE-001)
        run: cargo run --release --manifest-path codegen-exec-oracle/Cargo.toml --bin exec-oracle
      - name: Run wasmtime state + inter-thread oracle (REQ-CODEGEN-WIT-STATE-001)
        run: cargo run --release --manifest-path codegen-exec-oracle/Cargo.toml --bin state-oracle
      # kiln runs CORE modules, not Component Model components (kiln#269 — direct
      # component instantiation is a won't-fix path that still panics, kiln#427).
      # This oracle dogfoods the full PulseEngine chain: spar codegen → wasip2
      # component → `meld fuse` (in-process meld-core) → CORE module → executed on
      # the kiln interpreter, driving the AADL-port host imports and asserting the
      # same persistence acc(5,7)->12 + inter-thread 42 proofs on a SECOND runtime.
      - name: Run kiln runtime oracle — spar→meld→kiln (REQ-CODEGEN-WIT-DATAPLANE-KILN-001)
        run: cargo run --release --manifest-path codegen-kiln-oracle/Cargo.toml --bin kiln-oracle

  # ── Bench compile smoke (fast regression gate) ──────────────────────
  bench-smoke:
    name: Bench compile smoke
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # Compile-only bench check (observed ~9m). 30m absorbs a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Verify benches compile
        # --no-run builds the bench binaries without executing them. This
        # catches API drift in criterion harnesses on every PR with only
        # the cost of a `cargo check`-like compile.
        run: cargo bench --workspace --no-run

  # ── Security audits ──────────────────────────────────────────────────
  audit:
    name: Security Audit (RustSec)
    # Stays on ubuntu-latest temporarily: smithy ships cargo-audit
    # v0.21.2 whose bundled rustsec parser still rejects RUSTSEC-2026-0037
    # ("unsupported CVSS version: 4.0"). v0.22.1 fixes it but the
    # `cargo install --locked cargo-audit` build trips over our
    # sccache-on-cc setup (aws-lc-sys C compile fails through sccache).
    # Follow-up: drop sccache from ralf's profile before bumping the
    # toolchains-role version, then move this back to [self-hosted, light].
    runs-on: ubuntu-latest
    # rustsec/audit-check hits the network advisory DB (observed ~3m). 15m for
    # network variance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny
    # Smithy has cargo-deny installed (toolchains role, v0.16.4).
    # We avoid EmbarkStudios/cargo-deny-action@v2 because it launches
    # a rootless container, which fails on our hardened systemd unit:
    # newuidmap is setuid but NoNewPrivileges=true blocks the escalation
    # (newuidmap: write to uid_map failed: Operation not permitted).
    runs-on: [self-hosted, linux, x64, light]
    # cargo-deny bans/licenses/sources (observed <=20s).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo deny --version
      # Skip the `advisories` check because both cargo-deny and
      # cargo-audit share the same rustsec parser, which currently
      # rejects RUSTSEC-2026-0037 ("unsupported CVSS version: 4.0").
      # bans / licenses / sources still gate. Re-add `advisories`
      # once smithy ships an upgraded rustsec; the audit job (still
      # on ubuntu-latest) covers vulnerability matching meanwhile.
      - run: cargo deny check bans licenses sources

  # ── Code coverage ────────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # llvm-cov across the workspace (observed ~8.5m). 30m absorbs a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (LCOV + HTML)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --html --output-dir coverage-html
      - name: Upload LCOV to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/

  # ── Miri (undefined behavior, pointer provenance) ───────────────────
  miri:
    name: Miri
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # lean-mem class — Miri allocates aggressively and benefits from the 24G
    # MemoryHigh ceiling on smithy lean-mem runners over the 12G rust-cpu cap.
    runs-on: [self-hosted, linux, x64, lean-mem]
    # Miri instance-model tests (observed ~2m; lean-mem contention can stretch it).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Run Miri (instance model tests)
        # Filter to instance:: tests to avoid known rowan UB (rust-analyzer/rowan issue 192).
        # rowan's custom Arc implementation has a retag issue in HeaderSlice that
        # triggers Miri's borrow stack check. This is upstream, not our code.
        # Once rowan ships a fix, expand to full --lib.
        run: "cargo miri test -p spar-hir-def --lib -- instance::"
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"

  # ── Property-based testing (extended) ───────────────────────────────
  # Runs on every PR + main push (the workflow's top-level on:) — per
  # issue #135 acceptance: proptest gating must be PR-blocking, not just
  # a nightly. PROPTEST_CASES=1000 is 10× the default (100) so subtle
  # parser/scheduler invariants get exercised on every change.
  proptest:
    name: Proptest (extended)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # proptest at 10x cases (observed ~8m). 30m absorbs a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run proptest with 10x cases
        run: cargo test --workspace
        env:
          PROPTEST_CASES: "1000"

  # ── Mutation testing ────────────────────────────────────────────────
  mutants:
    name: Mutation Testing
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    # lean-mem — many parallel cargo invocations, RAM pressure under -j 4.
    # The full-workspace exhaustive run lives in mutants-weekly.yml; this
    # gating job stays narrow (spar-analysis) with a survivor ratchet.
    runs-on: [self-hosted, linux, x64, lean-mem]
    # The only run of this job to reach `success` in the last 25 CI runs took
    # 182.3 minutes; the other 16 were cancelled by a later push. With no
    # timeout it inherits GitHub's 6-hour default, so a wedged run holds a
    # lean-mem runner for a shift. 240 gives the measured duration ~30% headroom.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants on spar-analysis
        # `|| true` because cargo-mutants exits non-zero whenever ANY mutant
        # survives and the ratchet below tolerates a bounded number. That makes
        # this step incapable of reporting failure — so the next step has to
        # prove the run happened rather than infer it from a missing file.
        run: cargo mutants -p spar-analysis --timeout 120 --jobs 4 --output mutants-out -- --lib || true
      # Runs FIRST, for the same reason as the other guardrail self-tests: the
      # decision table includes the #381 regression itself (outcome files at the
      # shallow path must FAIL, not read as zero survivors), so a refactor that
      # reintroduced the misread would fail here rather than pass vacuously
      # below. This gate spent four months unable to fail; it now has to prove
      # it still can before it is allowed to judge anything.
      - name: Mutants-report guardrail self-test
        run: tools/check_mutants_report.py --self-test
      - name: Check surviving mutants
        # The logic lives in tools/check_mutants_report.py rather than inline
        # here because inline shell in a workflow is only testable by pushing —
        # which is precisely how the original misread survived from 563eb8c
        # (2026-03-22) to #381 without anyone able to run it against a report.
        # The script's docstring carries the mechanism and the evidence.
        #
        # 292 is the survivor count from the only run of this gate that has
        # ever FINISHED: run 30586785648, "1737 mutants tested in 87m: 292
        # missed, 708 caught, 735 unviable, 2 timeouts", outcomes.json carrying
        # a populated end_time.
        #
        # It is not a relaxation of 210, because 210 was never a measurement of
        # this codebase. Run 30563879100 died 3h02m in — cargo-mutants' worker
        # temp trees were deleted underneath it ("does not exist, refusing to
        # create it") — after testing 1608 of the 1737 mutants it had found.
        # `|| true` swallowed the crash. Its artifact therefore records
        # total_mutants 1608 and end_time null: a partial run, whose 210 is the
        # survivor count of the 92% that ran. Both runs used cargo-mutants
        # 27.1.0 against byte-identical spar-analysis/src, so 210 → 292 is
        # entirely the 129 mutants the crashed run never reached.
        #
        # The earlier 142 (5d6d98a, "down from 220") was a real hand
        # measurement, but the gate was misreading its report for the whole
        # four months it stood, so no number here has yet been enforced
        # against a complete run. 292 is the first.
        #
        # Lower this number as tests improve; target 0. Raise it only against a
        # run whose outcomes.json has an end_time — a partial run reports FEWER
        # survivors than the truth, so a threshold taken from one is a ceiling
        # set below the floor.
        #
        # That is now ENFORCED rather than advice: check_mutants_report.py
        # rejects a report whose `end_time` is null, so a truncated run cannot
        # be scored at all (#389, closed by #401). The runner-side cause was
        # fixed the same day — and note it was NOT the disk-pressure hook this
        # comment used to blame, which only runs BETWEEN jobs. It was a tmpfiles
        # sweep reaping cargo-mutants' worker trees after 2h, resting on the
        # false assumption that a live job keeps their mtime fresh; it does not,
        # because cargo-mutants copies each tree once at start and never touches
        # it again. The age is now 8h, above GitHub's 6h job ceiling — which
        # holds only while this job's timeout-minutes stays under ~7h.
        # Walking the number back down is #382.
        run: tools/check_mutants_report.py --output-dir mutants-out --max-missed 292
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants-out/

  # ── Fuzz smoke (60s per target on PRs) ──────────────────────────────
  fuzz-smoke:
    name: Fuzz smoke (60s/target)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # 3 targets x 60s + cold ASan builds (observed ~5m on PRs; this job is
    # PR-only). 30m ceiling.
    timeout-minutes: 30
    # Only run on PRs — pushes to main hit the nightly workflow instead.
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # cargo-fuzz defaults to x86_64-unknown-linux-musl, whose statically-
      # linked libc is incompatible with ASan ("sanitizer is incompatible
      # with statically linked libc"). Pin to the GNU triple explicitly.
      - name: fuzz_aadl_parse (60s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_aadl_parse -- -max_total_time=60 -timeout=10
      - name: fuzz_scheduler_solver (60s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_scheduler_solver -- -max_total_time=60 -timeout=5
      - name: fuzz_codegen_roundtrip (60s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_codegen_roundtrip -- -max_total_time=60 -timeout=10

  # ── Supply chain verification ───────────────────────────────────────
  supply-chain:
    name: Supply Chain (cargo-vet)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64, light]
    # cargo-vet supply-chain check (observed <=20s).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet
      - name: Verify supply chain
        run: cargo vet --locked

  # ── Rivet artifact validation ───────────────────────────────────────
  # Per AGENTS.md: every artifact change must pass `rivet validate`.
  # Mirrors the local pre-commit check so CI catches schema regressions
  # in artifacts/, safety/stpa/, and rivet.yaml.
  rivet-validate:
    name: Rivet validate (artifacts)
    runs-on: [self-hosted, linux, x64, rust-cpu]
    # rivet validate + all artifact guardrail self-tests (observed ~21m cold,
    # dominated by the verification-filter guardrail). 45m is ~2x.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Do NOT restore/save ~/.cargo/bin here. rust-cache caches installed
        # binaries by default (cache-bin: true), which lets a `rivet` built
        # elsewhere be restored under this job's key. `cargo install` then sees
        # `rivet` already present and skips the pinned reinstall, so validation
        # silently runs the wrong rivet — the source of the v0.33.0 bump's
        # false-red (464 phantom errors vs the pinned v0.4.3's genuine PASS).
        with:
          cache-bin: false
      - name: Install rivet CLI
        # The binary `rivet` ships in the `rivet-cli` package (renamed
        # in the 0.4.x rework). v0.1.0 used a single `rivet` package
        # and treated unknown fields as errors, which fails on legitimate
        # schema-extension fields used by Track A/B/D/E artifacts.
        # `--force` guarantees this exact pinned tag is the binary that runs,
        # even if a stale `rivet` is present, so the gate is deterministic.
        run: cargo install --force --locked --git https://github.com/pulseengine/rivet --tag v0.4.3 rivet-cli
      - name: rivet validate
        run: rivet validate --format text

      # ── human-scoped guardrail ────────────────────────────────────────
      # An artifact tagged `human-scoped` needs a human to scope it, so it must
      # not be recorded as implemented/verified/released/accepted/passing.
      # v0.35.0's REQ-CODEGEN-LAYOUT-CERT-001 was designated human-scoped in a
      # planning note only; the autonomous cron implemented it, self-recorded
      # `verified`, and merged in ~1h asserting a proof that did not exist. A
      # guardrail that lives only in prose is not a guardrail.
      #
      # It belongs in *this* job because rivet-validate deliberately has NO
      # `changes` gate (see the note at the top of this file), so it runs on
      # every PR. Behind a path filter it would be skipped by exactly the
      # code-only PR that quietly flips a status.
      #
      # Stdlib-only python3 on purpose: no workflow here installs a Python
      # package, so importing PyYAML would make a *required* check depend on an
      # unverified runner package — and a guardrail that cannot run reads as
      # approval. The parser is fail-closed instead: syntax it does not fully
      # handle exits 2 (red) rather than scanning past it.
      - name: Human-scoped guardrail self-test
        # Runs FIRST, and asserts the checker still rejects both fixtures, so a
        # refactor that made it toothless fails here instead of letting the real
        # check below pass vacuously.
        run: tools/check_human_scoped.py --self-test
      - name: Human-scoped guardrail
        run: |
          tools/check_human_scoped.py \
            --artifacts-dir artifacts \
            --artifacts-dir safety/stpa

      # ── release-plane guardrail (#370) ────────────────────────────────
      # rivet has two field planes. `release` is a CORE field, read by the CLI
      # query surface (`rivet list --release vX.Y`); separately each artifact
      # may carry a `fields:` bag for schema-declared custom keys. Writing
      # `release:` into the bag is valid YAML, is tolerated by the schema, and
      # is completely invisible to the query.
      #
      # 59 of 85 assignments were on the wrong plane. Eleven shipped releases
      # returned ZERO artifacts from `rivet list --release` — which renders
      # identically to a genuinely empty release. Release readiness in this
      # project is a query ("what must we implement for vX.Y"), and for eleven
      # releases the query was answering "nothing to do".
      #
      # rivet DID diagnose it — `INFO: field 'release' is not defined in
      # schema`, once per offending artifact, all 59 correct and precise. They
      # sat under 276 unrelated `ERROR:` lines from #371. This is a gate rather
      # than a lint because the diagnostic already existed and was unreadable.
      #
      # Same stdlib-only, fail-closed rationale as the pair above.
      - name: Release-plane guardrail self-test
        # Runs FIRST, same reason. Asserts the finding COUNTS, not just the
        # exit code: `exit 1` on the violation fixture is equally consistent
        # with a checker that reports every `release:` it sees — one that does
        # not discriminate on plane at all. Mutation-tested: each of the four
        # fixtures kills exactly one guard, and deleting any guard reds this.
        run: tools/check_release_plane.py --self-test
      # REQ-GUARD-GATE-EVIDENCE-002 (c). Self-test first, same reason as
      # every guardrail above it: the decision table includes the #388
      # regression (a filter selecting nothing must FAIL) and the pair that
      # makes it a detector rather than an assertion — the SAME step passes as
      # `proposed` and fails as `implemented`. A checker that ignored status
      # would pass one and not the other, so the pair pins the semantics.
      - name: Verification-filter guardrail self-test
        run: tools/check_verification_filters.py --self-test
      # The gate needs a real test inventory, which needs a build. It reuses
      # the `test` job's cache rather than building its own; if the inventory
      # comes back empty it exits 2 (broken scan) instead of reporting that
      # every filter is vacuous.
      - name: Verification-filter guardrail
        run: tools/check_verification_filters.py
      # REQ-GUARD-GATE-EVIDENCE-002 (h) + REQ-GUARD-FUZZ-SMOKE-001 (#406). Two
      # workflows run the fuzz harnesses from lists maintained apart from
      # fuzz/Cargo.toml's `[[bin]]` declarations: fuzz-nightly's matrix `include`
      # (each target carries its own extra_args, #361) and — the one that
      # actually gates merges — THIS file's `fuzz-smoke` job, which hand-writes
      # one `cargo fuzz run <target>` step per harness. The original tool audited
      # only the ADVISORY nightly, so a target added to fuzz/Cargo.toml but not
      # to fuzz-smoke left the REQUIRED context green having fuzzed a strict
      # subset (#406). The tool now asserts the declaration against BOTH lists;
      # `--ci-workflow` defaults to this file. Cheap: three file reads, no build.
      - name: Fuzz-target guardrail self-test
        run: tools/check_fuzz_targets.py --self-test
      - name: Fuzz-target guardrail
        run: tools/check_fuzz_targets.py
      - name: Release-plane guardrail
        run: |
          tools/check_release_plane.py \
            --artifacts-dir artifacts \
            --artifacts-dir safety/stpa

      # REQ-GUARD-GATE-EVIDENCE-003 (#403). run_verification.py SKIPS an
      # artifact with no `fields.steps[].run` and counts the skip toward exit 0,
      # so `Verification Gate (rivet-driven)` — a REQUIRED context — goes green
      # having executed nothing. Measured: 64 artifacts matched, 0 commands ran,
      # exit 0. Its sibling `if not ids: return 1` already closed "the filter
      # matched nothing"; "matched, and nothing ran" was left open.
      #
      # A ratchet rather than a hard fail: 85 claiming artifacts had no runnable
      # step when this was written (60 of them STPA entries with `TBD`-class
      # test names), and a gate that must be disabled to merge is a gate that
      # gets disabled. The floor may not rise; lowering it is the ratchet
      # walking down. Self-test first, as with every guardrail here.
      # The tag-point gate (#366) lives in release.yml, which only fires on a
      # tag push — so it sat unexercised from the day it merged until v0.36.0,
      # and its FIRST run was a false accusation that blocked the release. Its
      # regression test runs HERE, on every PR, precisely because the gate
      # itself cannot be.
      - name: Tag-point gate regression test
        run: tools/ci/test-tag-point.sh

      - name: Evidence-step guardrail self-test
        run: tools/check_evidence_steps.py --self-test
      - name: Evidence-step guardrail
        run: tools/check_evidence_steps.py --max-stepless 78

      # Required-context drift (#372). Same stdlib-only, fail-closed rules as
      # above, and here for the same reason: it must run on the PR that edits a
      # workflow, and that PR need not touch anything a path filter selects.
      #
      # Deliberately steps of *this* job rather than a job of its own. A new job
      # would itself be gateable, so it would have to be added to
      # .github/required-contexts.txt — and syncing branch protection to match
      # needs an admin token CI does not have. It would ship permanently red.
      - name: Required-context guardrail self-test
        run: tools/check_required_contexts.py --self-test
      - name: Required-context guardrail
        run: tools/check_required_contexts.py
      # Required-context timeouts (#398). Sibling of the guardrail above, reusing
      # its restricted workflow reader: every job that backs a required context
      # must declare a static timeout-minutes in (0, 360), so a wedged merge gate
      # cancels instead of holding a runner (and, with strict=true, the queue) for
      # the 6-hour default. Same steps-of-this-job rationale as above.
      - name: Job-timeout guardrail self-test
        run: tools/check_job_timeouts.py --self-test
      - name: Job-timeout guardrail
        run: tools/check_job_timeouts.py
      # Closure MSRV drift (#369). Here rather than in a code-gated job for the
      # same reason as above, and it matters more here than anywhere: the PR
      # that raises the real floor is a `cargo update`, which touches only
      # Cargo.lock. Behind `needs.changes.outputs.code` that is exactly the PR
      # most likely to be filtered out.
      #
      # Cheap despite needing cargo: `cargo metadata` resolves, it does not
      # compile, and this job already installs a toolchain for the rivet CLI.
      - name: MSRV guardrail self-test
        run: tools/check_msrv.py --self-test
      - name: MSRV guardrail
        run: tools/check_msrv.py

  # ── Bazel test sweep ───────────────────────────────────────────────
  # Issue #135 acceptance: `bazel test //...` to pick up Rust + Lean
  # targets via tools/bazel/rules_lean and rules_wasm_component.
  #
  # NOTE: Currently informational (continue-on-error: true) until a
  # MODULE.bazel / BUILD.bazel surface lands at the workspace root.
  # The job is wired up now so the moment those files appear, CI gates
  # them automatically — no follow-up workflow edit needed.
  #
  # Time budget: cold cache ≤30 min, warm ≤5 min (per #135).
  bazel-test:
    # "(advisory)" is in the NAME, not just the comment above, because the name
    # is the only thing a PR reader sees. `continue-on-error` makes the tick
    # green whatever happened — without the marker the check-run renders a claim
    # the run does not support. Enforced by tools/check_required_contexts.py.
    name: Bazel test (//...) (advisory)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Stays on ubuntu-latest until Bazel is installed on the smithy host.
    # Tracked as a follow-up: smithy/group_vars/all.yml could add a
    # bazel apt-installable. Until then, hosted handles this.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          # Key on whichever workspace marker exists. Falls back to a
          # stable key when none are present so the cache still warms
          # across runs and lights up automatically once a workspace
          # marker lands.
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', 'WORKSPACE', 'WORKSPACE.bazel', 'tools/bazel/**/BUILD.bazel', 'tools/bazel/**/*.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-
      - name: bazel test //...
        run: |
          set -euo pipefail
          if [ ! -f MODULE.bazel ] && [ ! -f WORKSPACE ] && [ ! -f WORKSPACE.bazel ]; then
            echo "::warning title=Bazel sweep::No MODULE.bazel/WORKSPACE at repo root; skipping bazel test //... (informational)."
            echo "tools/bazel/rules_lean exists but is consumed by generated BUILD files."
            echo "Add a root MODULE.bazel to enable this gate."
            exit 0
          fi
          bazel test //... --test_output=errors

  # ── Bounded model checking (Kani) ───────────────────────────────────
  # First-pass Kani harnesses for spar-solver + spar-codegen invariants.
  # Each harness mirrors a theorem in proofs/Proofs/Scheduling/ (RMBound,
  # EDF, RTA) and verifies the same invariant over bounded integer
  # arithmetic that Kani's CBMC backend can enumerate exactly.
  #
  # continue-on-error: true — these harnesses are first-pass; unwind
  # bounds may need tuning as we evolve them. The eventual hard-gate plan
  # is:
  #   1. Land harnesses + observe stable runtime over 2-3 weeks of CI.
  #   2. Once all three solver harnesses + the codegen harness complete
  #      in <5 min wall time with no unwind-assertion failures, flip
  #      continue-on-error to false and add to the required-checks list.
  #   3. At that point, extend MAX_TASKS from 4 to 8 and re-tune unwinds.
  kani:
    # "(advisory)" belongs in the name for as long as step 2 above is pending:
    # `continue-on-error` greens the tick regardless, and "Kani Bounded Model
    # Checking ✓" is exactly the claim a reader should not draw from that.
    # Drop the marker in the same commit that flips continue-on-error to false
    # and adds this to .github/required-contexts.txt — the gate will insist.
    name: Kani Bounded Model Checking (advisory)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Stays on ubuntu-latest because kani-verifier bundles CBMC (~100 MB)
    # which we don't pre-install on smithy. Once smithy ships Kani as a
    # toolchain, switch to rust-cpu (the verification is RAM-modest but
    # CPU-bound; CBMC is single-threaded per harness).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Kani
        # Pinned: 0.63.0's bundled nightly-2025-06-03 cannot compile
        # smol_str 0.3.6 ([0; _] / generic_arg_infer); 0.67.0 ships
        # nightly-2025-11-21 which can. Validated locally (#252).
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Run Kani on spar-solver
        run: cargo kani --tests -p spar-solver
      - name: Run Kani on spar-codegen (schedule harness)
        run: cargo kani --tests -p spar-codegen --harness kani_emit_preserves_schedule
      - name: Run Kani on spar-codegen (AADL contract harnesses)
        # prove_thread_period_preserved_d1..d10 — period round-trip, stratified
        #   by decimal digit count; union of bands = (0, 10^9] ns exactly (the
        #   single full-domain harness OOM'd CBMC / 6h-timed-out CI, #252)
        # prove_port_direction_preserved — WIT direction token mapping
        # prove_access_right_preserved   — Read_Only never widens to &mut
        # kissat: ~2x faster than the default SAT backend on these
        # bitvector-heavy instances (measured: d9 378s kissat / never
        # finished with cadical+u64, #252). `_d` prefix-matches all ten
        # period bands.
        run: >-
          cargo kani --tests -p spar-codegen --solver kissat
          --harness prove_thread_period_preserved_d
          --harness prove_port_direction_preserved
          --harness prove_access_right_preserved
