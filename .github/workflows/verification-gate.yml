name: Verification Gate

on:
  pull_request:
    branches: [main]
  # GitHub merge queue: every workflow that emits a REQUIRED context must also
  # run on the queue's `merge_group` event, or a queued PR waits on a context
  # nothing reports until the queue's check-response timeout evicts it. A
  # job-level `if:` that is false here still reports `skipped`, which satisfies
  # the context; only a workflow that does not trigger reports nothing.
  merge_group:
  # In a merge_group run there is no PR body, so a `Verify-Filter:` override
  # does not apply: the queue runs the DEFAULT filter below. The sticky PR
  # comment step is skipped there (it is guarded on pull_request).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  rivet-verification:
    name: Verification Gate (rivet-driven)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    # 60m budget: TEST-PROOF-* steps run `cd proofs && lake build`, which
    # against Mathlib on a cold elan cache takes 25–35 min. Once the runner image
    # adds Lake build-artifact caching across runs, this can drop back
    # toward 20m. The dedicated "Lean proof typecheck" workflow has its
    # own budget for the same step.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-20
        with:
          toolchain: 1.100.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install rivet
        run: |
          # Pin to rivet v0.7.0 (commit b7a17be) — the release that first ships
          # `rivet list --filter <sexp>`, which this gate depends on. (The
          # 4c06709 SHA I tried first is *etch*'s rev — etch is a sibling crate
          # in the rivet workspace but unrelated to the CLI.)
          # The rivet repo is a multi-package workspace; the trailing positional
          # `rivet-cli` selects which crate owns the `rivet` binary, otherwise
          # cargo errors with "multiple packages with binaries found:
          # rivet-cli, rivet-fuzz".
          cargo install --locked --git https://github.com/pulseengine/rivet \
            --rev b7a17bef \
            --bin rivet \
            rivet-cli

      - name: Pick verification filter (per-PR override via body)
        id: pick
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Default (REQ-VERIFY-GATE-SCOPE-001, owner decision
          # 20261117T184412-effaa3, option `union`): the frozen v093/v0100 slice
          # (20 features) plus every feature whose `release:` is Cargo.toml's
          # version, named by id (rivet v0.7.0 cannot filter on `release`).
          # The weekly workflow runs every feature. A PR may widen the
          # default with one body line:
          #     Verify-Filter: (and (= type "feature") (has-tag "v093"))
          # tools/verification_default_filter.py prints the filter and an
          # independent count of what it must match, taken from the YAML with
          # PyYAML, which becomes --min-matched below.
          tools/verification_default_filter.py >defaults.txt
          cat defaults.txt
          DEFAULT=$(sed -n 's/^filter=//p' defaults.txt)
          EXPECTED=$(sed -n 's/^expected=//p' defaults.txt)
          case "$EXPECTED" in
            ''|*[!0-9]*|0) echo "::error::no default count (got '$EXPECTED')"; exit 1 ;;
          esac
          printf 'expected=%s\n' "$EXPECTED" >>"$GITHUB_OUTPUT"
          OVERRIDE=$(printf '%s' "$PR_BODY" | grep -m1 -E '^Verify-Filter:' | sed 's/^Verify-Filter:[[:space:]]*//' || true)
          # The override may only WIDEN the default (REQ-VERIFY-GATE-SCOPE-001,
          # #513): run_verification.py --must-cover fails a filter that drops
          # any artifact the default checks, so a PR body cannot narrow the
          # required gate to an artifact of its author's choosing.
          printf 'default=%s\n' "$DEFAULT" >>"$GITHUB_OUTPUT"
          if [ -n "${OVERRIDE:-}" ]; then
            printf 'filter=%s\n' "$OVERRIDE" >>"$GITHUB_OUTPUT"
          else
            printf 'filter=%s\n' "$DEFAULT" >>"$GITHUB_OUTPUT"
          fi

      - name: Run rivet verification gate
        id: verify
        continue-on-error: true
        env:
          FILTER: ${{ steps.pick.outputs.filter }}
          DEFAULT_FILTER: ${{ steps.pick.outputs.default }}
          EXPECTED: ${{ steps.pick.outputs.expected }}
        run: |
          # --min-matched is the YAML's own count of the default (25 on
          # 0.49.0). Matching fewer means rivet dropped part of the filter or
          # failed to load an artifact (a tag renamed, an id rivet does not
          # see), so the gate fails rather than checking a smaller set.
          tools/run_verification.py \
            --filter "$FILTER" \
            --must-cover "$DEFAULT_FILTER" \
            --min-matched "$EXPECTED" \
            --results-json verification-results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results
          path: verification-results.json
          if-no-files-found: warn

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tools/post_verification_comment.py "$PR_NUMBER"

      - name: Fail job if any verification artifact failed
        if: steps.verify.outcome != 'success'
        run: |
          echo "::error::One or more verification artifacts failed; see PR comment for details"
          exit 1
