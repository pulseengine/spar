# .github/workflows/trace-fixtures.yml
#
# Nightly job that builds the NixOS KVM guest, runs gen-fixtures inside it,
# verifies the four fixture files, and uploads them as a CI artefact.
#
# Triggers: workflow_dispatch (manual) + schedule (nightly).
# NOT pull_request — this is a build-and-execute job, not a per-PR check.
#
# All 12 CI runners are KVM-capable (bare-metal, /dev/kvm present, runner
# user in the kvm group, qemu-system-x86_64 8.2.2 installed).  The NixOS
# guest is built inside a rootless podman container from a digest-pinned
# nixos/nix image; the container receives --device /dev/kvm because the
# NixOS qcow2 builder internally boots a transient builder VM.
#
# The Nix store is ephemeral (no persistent named volume) — it is rebuilt
# cold from cache.nixos.org on each run.  This keeps PR 2 simple; a
# persistent volume can be layered in once the workflow is proven.
#
# Determinism: this job builds ONLY against the committed
# tools/fixture-vm/flake.lock — it never runs `nix flake update`.  The lock
# IS the pin (the whole reason for the NixOS approach); re-resolving inputs
# per run would silently un-pin nixpkgs / the kernel.  Updating the lock is
# a deliberate, reviewed action — see the `fixture-vm flake.lock` workflow
# (.github/workflows/fixture-vm-flake-lock.yml).

name: Trace-Topology Fixture Generation

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC every day.
    - cron: "30 2 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FIXTURE_OUTPUT_DIR: fixture-output
  # sha256 digest of docker.io/nixos/nix:2.24.9 — see the "Build NixOS
  # fixture-vm qcow2" step for how to re-resolve it. Hoisted here so the
  # kvm precondition probe and the build it guards cannot drift onto
  # different images: a probe that greens a different image than the one
  # built proves nothing about the build.
  NIX_IMAGE_DIGEST: "sha256:fd7a5c67d396fe6bddeb9c10779d97541ab3a1b2a9d744df3754a99add4046f1"

jobs:
  generate-fixtures:
    name: Build guest + generate fixtures
    # `podman` constrains scheduling to a rootless-podman-capable runner
    # (runner9 at the moment).  KVM access is universal on the fleet, so
    # no `kvm` label is needed; without `podman` we land on runners whose
    # rootless userns setup is broken (newuidmap EPERM, runner8 on
    # 2026-05-23).
    runs-on: [self-hosted, linux, x64, podman]

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Require a committed flake.lock (the determinism pin) ──────────
      #
      # The nightly build never re-resolves flake inputs. If the lock is
      # absent the build must FAIL with a clear pointer rather than silently
      # run un-pinned.
      - name: Require committed flake.lock
        run: |
          if [ ! -f tools/fixture-vm/flake.lock ]; then
            echo "::error::tools/fixture-vm/flake.lock is missing."
            echo "::error::The nightly build runs only against a committed,"
            echo "::error::reviewed lock. Dispatch the 'fixture-vm flake.lock'"
            echo "::error::workflow, download its artifact, and commit the"
            echo "::error::resulting flake.lock in a PR."
            exit 1
          fi

      # ── 3. Build the NixOS guest qcow2 via rootless podman ───────────────
      #
      # The nixos/nix image is pinned by digest for determinism — the image
      # is part of the Nix closure, and :latest would silently pull a
      # different version.  Update the digest here when a newer Nix release
      # is needed.
      #
      # NIX_IMAGE_DIGEST (workflow `env:`) is the multi-arch INDEX manifest
      # (manifest.list.v2), not a per-arch leaf; podman resolves the right
      # arch from it. Verified: `podman run <image> nix --version` → 2.24.9.
      # Resolve with: podman manifest inspect docker.io/nixos/nix:2.24.9
      #
      # Note: "sandbox = false" in nix.conf drops Nix's in-container build
      # sandbox (not host root — the container is already rootless).
      # Without it, Nix's sandboxed builds fail inside the already-
      # containerised environment.  --device /dev/kvm is required because
      # the NixOS qcow2 builder boots a transient builder VM.
      #
      # --group-add keep-groups is required for the SAME reason and is not
      # implied by --device.  See the precondition step below for why.
      #
      # --no-update-lock-file makes `nix build` FAIL rather than re-resolve
      # if the committed lock is stale/incomplete — belt-and-suspenders with
      # the guard step above.

      # ── 3a. Precondition: Nix must actually advertise the `kvm` feature ──
      #
      # `--device /dev/kvm` puts the node in the container; it does NOT make
      # it usable.  /dev/kvm is `crw-rw---- root:kvm`, and **rootless podman
      # drops the caller's supplementary groups by default** — so the
      # in-container process is not in `kvm` and the node is present but
      # unopenable.  The host runner user being in the `kvm` group (true on
      # this fleet) does not carry into the user namespace without
      # `--group-add keep-groups`.
      #
      # Nix adds `kvm` to its system-features only when
      # access("/dev/kvm", R_OK|W_OK) succeeds (settings.cc,
      # getDefaultSystemFeatures).  make-disk-image.nix builds through
      # vmTools.runInLinuxVM, whose derivation carries
      # `requiredSystemFeatures = [ "kvm" ]`.  Miss the group and the build
      # dies with:
      #
      #   error: a 'x86_64-linux' with features {kvm} is required to build
      #   '…-nixos-disk-image.drv', but I am a 'x86_64-linux' with features
      #   {benchmark, big-parallel, nixos-test, uid-range}
      #
      # — a correct and precise diagnostic, emitted after ~5 minutes of
      # compiling and buried under ~700 `building '/nix/store/…drv'` lines
      # (run 30565973744).  This step asks Nix the same question in two
      # seconds, at the top of the log, before anything is built.
      #
      # It asserts on Nix's OWN computed feature set rather than on a shell
      # `[ -w /dev/kvm ]` test: the feature set is what the build is actually
      # matched against, so a probe of anything else could pass while the
      # build still fails.
      - name: Require /dev/kvm usable inside the container
        run: |
          podman run --rm \
            --device /dev/kvm \
            --group-add keep-groups \
            --security-opt label=disable \
            "docker.io/nixos/nix@${NIX_IMAGE_DIGEST}" \
            sh -c '
              set -eu
              echo "container process: $(id)"
              ls -l /dev/kvm || {
                echo "::error::/dev/kvm is not present in the container at all."
                exit 1
              }
              FEATURES="$(nix --extra-experimental-features nix-command \
                config show system-features 2>/dev/null || echo "<unavailable>")"
              echo "nix system-features = ${FEATURES}"
              case " ${FEATURES} " in
                *" kvm "*)
                  echo "ok: nix advertises kvm; nixos-disk-image.drv is buildable here"
                  ;;
                *)
                  echo "::error::Nix does not advertise the kvm system feature, so"
                  echo "::error::nixos-disk-image.drv cannot be built on this runner."
                  echo "::error::/dev/kvm is root:kvm 0660 and rootless podman drops"
                  echo "::error::supplementary groups; --group-add keep-groups needs a"
                  echo "::error::crun-based runtime. Check: podman info --format"
                  echo "::error::{{.Host.OCIRuntime.Name}} and that the runner user is"
                  echo "::error::in the kvm group on the host."
                  exit 1
                  ;;
              esac
            '

      - name: Build NixOS fixture-vm qcow2
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          podman run --rm \
            --device /dev/kvm \
            --group-add keep-groups \
            --security-opt label=disable \
            -v "${WORKSPACE}:/spar:Z" \
            "docker.io/nixos/nix@${NIX_IMAGE_DIGEST}" \
            sh -c '
              set -euo pipefail
              # Enable flakes + nix-command.
              mkdir -p /etc/nix
              echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
              echo "sandbox = false" >> /etc/nix/nix.conf
              cd /spar/tools/fixture-vm
              # Build the qcow2 image against the committed flake.lock.
              #
              # The out-link goes to /tmp, NOT into the bind mount. A `result`
              # symlink written to /spar would survive the container but point
              # at /nix/store/…, and this container is `--rm` with its own
              # store — nothing of that store exists on the host once the run
              # ends. That is not a naming mismatch that a better glob would
              # fix; the build product is unreachable from the host by
              # construction. So the image is copied ACROSS the mount here,
              # while the store it lives in still exists.
              nix build --no-update-lock-file \
                .#nixosConfigurations.fixture-vm.config.system.build.qcow2 \
                --out-link /tmp/result
              cp --no-preserve=mode,ownership \
                /tmp/result/nixos.qcow2 /spar/tools/fixture-vm/nixos.qcow2
            '

      - name: Locate qcow2
        id: qcow2
        run: |
          QCOW2="${GITHUB_WORKSPACE}/tools/fixture-vm/nixos.qcow2"
          # `cp` exiting 0 says a file arrived, not that a bootable image did.
          # A qcow2 of a full NixOS system is hundreds of MB; anything under
          # 64 MiB means the copy was truncated or the wrong path was built,
          # and the next four steps would fail further from the cause.
          if [ ! -f "${QCOW2}" ]; then
            echo "::error::${QCOW2} does not exist — the copy out of the"
            echo "::error::container store did not happen. Check the build step."
            exit 1
          fi
          BYTES="$(stat -c %s "${QCOW2}")"
          if [ "${BYTES}" -lt 67108864 ]; then
            echo "::error::${QCOW2} is only ${BYTES} bytes; expected >= 64 MiB."
            exit 1
          fi
          echo "path=${QCOW2}" >> "$GITHUB_OUTPUT"
          echo "fixture-vm: qcow2 = ${QCOW2} (${BYTES} bytes)"
          ls -lh "${QCOW2}"

      # ── 3. Build the fixture-vm Rust harness ─────────────────────────────
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: Build fixture-vm harness
        run: cargo build -p spar-trace-topology --bins --release

      # ── 4. Run the harness (boots VM, collects fixtures) ─────────────────
      - name: Create fixture output directory
        run: mkdir -p "$FIXTURE_OUTPUT_DIR"

      - name: Run fixture-vm (boot NixOS guest, generate fixtures)
        env:
          QCOW2_PATH: ${{ steps.qcow2.outputs.path }}
        run: |
          ./target/release/fixture-vm \
            --base-qcow2 "${QCOW2_PATH}" \
            --output-dir "${FIXTURE_OUTPUT_DIR}"

      # ── 5. Verify: tshark -r capture.pcapng ──────────────────────────────
      - name: Verify capture.pcapng with tshark
        run: |
          tshark -r "${FIXTURE_OUTPUT_DIR}/capture.pcapng" \
            -q -z io,stat,0 2>&1 | tee /tmp/tshark-out.txt
          # tshark exits non-zero if the file is corrupt or empty.

      # ── 6. Round-trip: parse all four fixtures through ingest parsers ─────
      - name: Verify all four fixtures parse cleanly (ingest round-trip)
        run: |
          ./target/release/fixture-vm --verify "${FIXTURE_OUTPUT_DIR}"

      # ── 7. Upload fixtures as a CI artefact ──────────────────────────────
      - name: Upload fixture artefacts
        uses: actions/upload-artifact@v4
        with:
          name: trace-topology-fixtures-${{ github.run_number }}
          path: |
            ${{ env.FIXTURE_OUTPUT_DIR }}/capture.pcapng
            ${{ env.FIXTURE_OUTPUT_DIR }}/lldp.json
            ${{ env.FIXTURE_OUTPUT_DIR }}/qcc-yang.json
            ${{ env.FIXTURE_OUTPUT_DIR }}/gptp.json
          retention-days: 30
          if-no-files-found: error
