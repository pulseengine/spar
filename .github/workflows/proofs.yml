name: Lean Proofs

# Type-check the spar scheduling-theory proofs (proofs/Proofs/Scheduling/*).
#
# These are the load-bearing mathematical theorems behind spar-analysis:
#   * Liu & Layland 1973 — RM utilization bound        (RMBound.lean)
#   * Joseph & Pandya 1986 — RTA fixed-point convergence (RTA.lean)
#   * Dertouzos 1974 — EDF optimality for implicit deadlines (EDF.lean)
#
# Lean toolchain is pinned by `proofs/lean-toolchain`
# (currently `leanprover/lean4:v4.29.0-rc6`). `leanprover/lean-action`
# reads that file and installs the matching elan/lake/lean toolchain;
# bumping the file is the one place you change the pinned version.
#
# Mathlib is the slow dependency. We cache the Lake build directory
# (`proofs/.lake`) keyed on `lake-manifest.json`, so warm runs only
# rebuild the in-tree proof modules.

# Lean proof runs are multi-hour on cold cache. Cancel superseded PR
# runs aggressively; never cancel main / scheduled / tag runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge queue: every workflow that emits a REQUIRED context must also
  # run on the queue's `merge_group` event, or a queued PR waits on a context
  # nothing reports until the queue's check-response timeout evicts it. A
  # job-level `if:` that is false here still reports `skipped`, which satisfies
  # the context; only a workflow that does not trigger reports nothing.
  merge_group:

jobs:
  # Same construct (and the same required-check caveat) as ci.yml's `changes`
  # job — see the comment there for why this is a job-level skip and not an
  # `on: paths:` filter. An artifacts/docs-only diff cannot alter a Lean proof
  # or the reflected codegen, so this job lets those PRs skip the lake build.
  changes:
    name: Detect changed paths (proofs)
    # Self-hosted `light` like ci.yml's classifier, which runs the same script:
    # hosted runners are the org's CI bottleneck (20 concurrent jobs on the
    # Free plan). A pull request from a fork falls back to the hosted image,
    # and an event that names no head repo (push, merge_group) takes `light`.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    # Trivial classifier (observed <10s); gates the required Lean typecheck.
    # Enforced by tools/check_job_timeouts.py (#398).
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # This job gates the required `Lean proof typecheck (lake build)` context,
      # so it is the 11th check the #384 fail-open could skip. It was a verbatim
      # clone of ci.yml's classifier and had already drifted from it — ci.yml
      # gained `rivet.yaml` in #379 and this copy never did. Both now call the
      # same script; see tools/classify_changed_paths.py for the allow-list and
      # the fail-closed rationale, including why picking up the `rivet.yaml`
      # entry here is a deliberate (and safe) loosening.
      - name: Changed-path classifier self-test
        run: tools/classify_changed_paths.py --self-test

      - id: filter
        name: Classify diff as code vs artifacts/docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          # pull_request: the PR's base. merge_group: the queue's base (main's
          # tip); the queue checkout is merge_group.head_sha, so `base...HEAD`
          # is what this queue commit adds. Any other event takes neither and
          # the classifier runs the full suite without reading this.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: >-
          tools/classify_changed_paths.py
          --event-name "$EVENT_NAME"
          --base-sha "$BASE_SHA"
          --github-output "$GITHUB_OUTPUT"

  lean:
    name: Lean proof typecheck (lake build)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # 90 min covers cold-cache Mathlib fetches via `lake exe cache get`
    # plus our in-tree proof compile. Warm runs land in well under 10 min.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache the Lake build outputs (Mathlib + transitive deps + our proofs).
      # Warm runs reuse this and only recompile changed in-tree modules.
      # Cold runs fall through to the Mathlib precompiled cache fetched by
      # lean-action's `use-mathlib-cache: true` below — that pulls
      # ~2 GB of `.olean` files from Mathlib's cloud cache instead of
      # rebuilding them from source (30+ min compile vs ~5 min download).
      - name: Cache Lake build (.lake)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            proofs/.lake
            ~/.elan
          key: lake-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-

      # leanprover/lean-action reads `proofs/lean-toolchain` and installs the
      # matching toolchain via elan, runs `lake exe cache get` to pull
      # precompiled Mathlib `.olean`s from the cloud cache, then runs
      # `lake build`. The action surfaces Lean errors and `sorry` warnings
      # in the log, but does NOT fail the job on `sorry` warnings without
      # explicit `warningAsError` configuration. The grep gate below is
      # the actual fail-on-sorry enforcement (see #wave3-tier-a-1 audit).
      - name: Build proofs (lake build)
        id: lake_build
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: proofs
          # Pull Mathlib's precompiled .olean files instead of rebuilding
          # from source. Without this, the cold-cache build hits the 1h
          # GH Actions timeout at ~98% Mathlib (saw this on the first run
          # of #151 — module 2796/2845 cancelled by timeout).
          use-mathlib-cache: true
          build-args: ""

      # Text "fail on sorry" ratchet.
      #
      # `lake build` does NOT fail the job on `sorry` warnings without
      # `warningAsError` in `lakefile.toml`, so tools/check_lean_sorries.py
      # reads the proofs tree post-build. It counts `sorry`, `sorryAx`, `admit`
      # and `axiom` ANYWHERE in comment-stripped text (inline `:= by sorry`
      # included, no `-- TODO` exemption) and holds the total to
      # --max-sorries. It is a count over text: a theorem that only uses a
      # sorried lemma, and `native_decide`, are invisible to it. The
      # trust-ledger step below checks those at the kernel level.
      #
      # (Earlier revisions of this comment described a bare-line grep and a
      # set of 5 MinPlus sorries; both are history, see below.)
      # REQ-GUARD-GATE-EVIDENCE-002 (f), closes #385.
      #
      # The previous body was a two-stage grep that excluded any sorry
      # carrying a same-line `-- TODO`. Its comment explained why that was
      # safe: "the five tracked sorrys do NOT carry a same-line comment".
      # That was true when written. The sorries then grew 5 -> 12 AND moved
      # their TODO onto the same line, so an exclusion designed to be a no-op
      # silently became universal — 12 in, 0 out, `if` never fires, and the
      # step printed "No sorrys in proofs/Proofs/ — gate green."
      #
      # The gate was satisfied by exactly the thing it exists to prevent, and
      # nobody edited it; the code drifted out from under its comment. The
      # generalisable part: a self-exemption keyed on a pattern the exempted
      # code itself controls cannot hold — the proof author writes both the
      # `sorry` and the `-- TODO` that excuses it.
      #
      # Replaced by a declared ratchet. --max-sorries is the floor, and it is
      # here (in the workflow) rather than in the proofs, so lowering it is a
      # deliberate edit by someone other than the proof being exempted.
      # 12 was the measured count on ae27ff1; 0 since every MinPlus and
      # MinPlusPwa theorem is proven. A new `sorry` now fails this step and
      # must also be listed in .github/trust-ledger.txt.
      # Discharging these is REQ-PROOF-NC-MINPLUS-001 (v0.38.0).
      - name: Lean-sorry guardrail self-test
        if: always()
        working-directory: ${{ github.workspace }}
        run: tools/check_lean_sorries.py --self-test
      - name: Fail on sorry (post-build gate)
        if: always()
        working-directory: ${{ github.workspace }}
        run: tools/check_lean_sorries.py --max-sorries 0

      # Reachability gate (REQ-PROOF-LAKE-REACHABLE-001, #397).
      #
      # `lake build` compiles a target and its import closure, nothing else.
      # Proofs/Network/MinPlusPwa.lean was imported by nothing, so this job
      # never typechecked it, and its statements had stopped elaborating
      # (List.minimum? is gone from the pinned Lean) while the job stayed green.
      # The sorry gate above could not see that: it reads text, so it counted
      # the file's sorries all along. This step fails when any first-party .lean
      # file is unreachable from defaultTargets or a `lake exe` CI runs. It takes
      # no root arguments, so this run and a bare local run measure the same set.
      - name: Lean reachability guardrail self-test
        if: always()
        working-directory: ${{ github.workspace }}
        run: tools/check_lean_reachable.py --self-test
      - name: Every first-party Lean file is compiled
        if: always()
        working-directory: ${{ github.workspace }}
        run: tools/check_lean_reachable.py

      # Kernel-level trust ledger (REQ-PROOF-AXIOM-LEDGER-001).
      #
      # The sorry ratchet above counts text. It cannot see a theorem that only
      # USES a sorried lemma, `native_decide` (an auxiliary axiom, not a word it
      # matches), or a sorry moved from one theorem to another at the same count.
      # This step asks the elaborated environment instead: `Lean.collectAxioms`
      # on every constant of every proofs/Proofs module, failing on any axiom
      # beyond propext, Quot.sound and Classical.choice that
      # .github/trust-ledger.txt does not list by name. Verus external_body /
      # assume_specification / assume / admit in tracked .rs files are held to
      # the same ledger. `--negative-control` adds four canaries (by sorry,
      # native_decide, an axiom, a theorem using it) to the same Lean run and
      # fails unless all four are reported.
      - name: Trust-ledger guardrail self-test
        working-directory: ${{ github.workspace }}
        run: tools/check_trust_ledger.py --self-test
      - name: Every trust escape is in the ledger (kernel axioms + Verus)
        working-directory: ${{ github.workspace }}
        run: tools/check_trust_ledger.py --negative-control

      # Independent re-check of the built .olean files (REQ-PROOF-OLEAN-RECHECK-001).
      #
      # Every gate above reads Lean's own verdict: the elaborator accepted the
      # files, and the trust ledger asks the environment the elaborator built.
      # Metaprogramming can add a declaration to that environment without the
      # kernel (`addDeclCore (doCheck := false)`), and nothing above re-runs the
      # kernel on what was written to disk. lean4checker loads each Proofs.*
      # .olean, rebuilds the environment from its imports and replays every
      # declaration through the kernel. It is the same kernel, not a second
      # implementation (nanoda or lean4lean would be), so it catches environment
      # hacking and corrupted build output, not a kernel bug.
      #
      # Pinned by tag AND commit; the tag must equal proofs/lean-toolchain
      # because an .olean is only readable by the Lean that wrote it.
      - name: Build lean4checker (v4.29.0-rc6, c789dcf4)
        working-directory: ${{ runner.temp }}
        env:
          L4C_SHA: c789dcf4d5b27bf2ca2840aa34609960b1337e60
        run: |
          set -euo pipefail
          rm -rf lean4checker
          git init -q lean4checker
          cd lean4checker
          git fetch -q --depth 1 https://github.com/leanprover/lean4checker "$L4C_SHA"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$L4C_SHA"
          # Contents, not bytes: proofs/lean-toolchain has no final newline and
          # lean4checker's does, so `diff` failed on two identical versions.
          want=$(cat "$GITHUB_WORKSPACE/proofs/lean-toolchain"); have=$(cat lean-toolchain)
          if [ "$have" != "$want" ]; then
            echo "::error::lean4checker is built for '$have', the proofs use '$want'"; exit 1
          fi
          lake build lean4checker
          test -x .lake/build/bin/lean4checker
      # Prints the declarations replayed per module, then requires: the module
      # count equals the first-party Proofs modules (Proofs.lean plus every
      # file under Proofs/), lean4checker found the same number, and the
      # declaration total is above zero.
      - name: Every Proofs declaration re-checked by lean4checker
        env:
          L4C: ${{ runner.temp }}/lean4checker/.lake/build/bin/lean4checker
        run: |
          set -euo pipefail
          expected=$(( $(find Proofs -name '*.lean' | wc -l) + 1 ))
          lake env lean --run ../tools/lean4checker/CountDecls.lean Proofs | tee "$RUNNER_TEMP/l4c-count.txt"
          lake env "$L4C" Proofs | tee "$RUNNER_TEMP/l4c.txt"
          mods=$(sed -n 's/^modules: \([0-9]*\) declarations: [0-9]*$/\1/p' "$RUNNER_TEMP/l4c-count.txt")
          decls=$(sed -n 's/^modules: [0-9]* declarations: \([0-9]*\)$/\1/p' "$RUNNER_TEMP/l4c-count.txt")
          found=$(sed -n 's/^Found \([0-9]*\) modules to check$/\1/p' "$RUNNER_TEMP/l4c.txt")
          echo "first-party modules: $expected, counted: $mods, lean4checker found: $found, declarations re-checked: $decls"
          test "$mods" = "$expected"
          test "$found" = "$expected"
          test "$decls" -gt 0
      # Two controls; the step fails unless lean4checker rejects both.
      #  1. A theorem `false : False` added with doCheck := false
      #     (tools/lean4checker/AddFalseCanary.lean), compiled to a scratch dir.
      #  2. A copy of one Proofs .olean with 64 bytes overwritten at a quarter,
      #     half and three quarters of its length, shadowing the real file on
      #     LEAN_PATH. An unmodified copy in the same position must pass first,
      #     so a red corrupt run is about the bytes, not the path setup.
      - name: lean4checker rejects an unchecked declaration and a corrupted .olean
        env:
          L4C: ${{ runner.temp }}/lean4checker/.lake/build/bin/lean4checker
        run: |
          set -uo pipefail
          C="$RUNNER_TEMP/l4c-controls"
          rm -rf "$C"; mkdir -p "$C/canary" "$C/clean" "$C/corrupt"
          LP=$(lake env printenv LEAN_PATH)
          fail=0

          cp ../tools/lean4checker/AddFalseCanary.lean "$C/canary/L4CCanary.lean"
          if ! lake env lean --root="$C/canary" -o "$C/canary/L4CCanary.olean" "$C/canary/L4CCanary.lean"; then
            echo "::error::the canary did not compile, so control 1 tested nothing"; exit 1
          fi
          out=$(lake env env LEAN_PATH="$C/canary:$LP" "$L4C" L4CCanary 2>&1); rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ] && printf '%s\n' "$out" | grep -q 'found a problem in L4CCanary'; then
            echo "control 1 ok: unchecked declaration rejected (rc=$rc)"
          else
            echo "::error::lean4checker accepted a theorem added without the kernel (rc=$rc)"; fail=1
          fi

          m=$(cd .lake/build/lib/lean && find Proofs -name '*.olean' ! -name '*.*.olean' | sort | tail -1)
          mod=$(printf '%s' "${m%.olean}" | tr / .)
          for d in clean corrupt; do
            mkdir -p "$C/$d/$(dirname "$m")"
            cp ".lake/build/lib/lean/$m" "$C/$d/$m"
          done
          size=$(wc -c < "$C/corrupt/$m")
          for off in $((size / 4)) $((size / 2)) $((size * 3 / 4)); do
            head -c 64 /dev/zero | tr '\0' '\377' | dd of="$C/corrupt/$m" bs=1 seek="$off" conv=notrunc 2>/dev/null
          done
          if cmp -s "$C/clean/$m" "$C/corrupt/$m"; then
            echo "::error::the corruption left $m unchanged"; fail=1
          fi
          if lake env env LEAN_PATH="$C/clean:$LP" "$L4C" "$mod" >/dev/null 2>&1; then
            echo "control 2 setup ok: unmodified copy of $m passes from the shadowing path"
          else
            echo "::error::the unmodified copy of $m failed, so control 2 would prove nothing"; fail=1
          fi
          lake env env LEAN_PATH="$C/corrupt:$LP" "$L4C" "$mod" > "$C/corrupt.out" 2>&1; rc=$?
          tail -3 "$C/corrupt.out"
          if [ "$rc" -ne 0 ]; then
            echo "control 2 ok: corrupted $m rejected (rc=$rc)"
          else
            echo "::error::lean4checker accepted a corrupted $m"; fail=1
          fi
          exit "$fail"

      # Codegen freshness gate (REQ-PROOF-SCHED-CODEGEN-001, #321).
      #
      # `crates/spar-analysis/src/scheduling_verified.rs` is GENERATED by
      # `lake exe codegen`, which reflects the elaborated Lean `Expr` of the
      # recurrence definitions (RTACore.lean, RTAJitteredCore.lean) into Rust.
      # This step re-runs the generator and fails if the committed file has
      # drifted from its output — i.e. if someone hand-edited the generated
      # Rust, or changed a reflected Lean definition without regenerating.
      # That is what makes the theory↔code link for the recurrence arithmetic
      # drift-proof rather than property-test-hopeful.
      #
      # `lake exe codegen` only needs the mathlib-free *Core modules, so it
      # builds in seconds regardless of the Mathlib cache state above.
      - name: Codegen freshness gate (scheduling_verified.rs)
        working-directory: proofs
        run: |
          set -euo pipefail
          lake exe codegen > /tmp/scheduling_verified.gen.rs
          if ! diff -u ../crates/spar-analysis/src/scheduling_verified.rs \
                       /tmp/scheduling_verified.gen.rs; then
            echo ""
            echo "::error::scheduling_verified.rs is out of sync with the Lean generator."
            echo "::error::Regenerate: cd proofs && lake exe codegen > ../crates/spar-analysis/src/scheduling_verified.rs"
            exit 1
          fi
          echo "scheduling_verified.rs matches the Lean generator — gate green."

      # Generated-proof build gate (REQ-PROOF-GEN-COMPILES-001, refs #542).
      #
      # `spar codegen --verify proof` writes Lean theorems that import
      # `Proofs.Scheduling.RTA`. They once called `compute_response_time`, which
      # no module here defines, and no step compiled a generated proof, so the
      # break shipped unseen. This step runs the generator on
      # the tool's built-in four-thread model (FIXTURE; three threads meet
      # their deadline, one misses) and `lake build`s its output against
      # the library built above (a wrapper project that requires `proofs/` by
      # path and reuses its `.lake/packages`, so Mathlib is not fetched again).
      # It fails on a build error, on `sorry`/`admit`/`native_decide` in the
      # output, on a theorem that depends on `sorryAx`, or on an output with no
      # theorem. `--negative-control` rebuilds three broken variants (deadline
      # below the response time; wrong fixed-point witness; a proof replaced by
      # `sorry`, which tests warningAsError) and fails unless all three builds
      # fail, so the step shows on every run that it can go red.
      #
      # Inside this job on purpose: it is already the required context and has
      # Mathlib restored. It triggers on any code path the `changes` classifier
      # admits, which covers both crates/spar-codegen/** and proofs/**.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-20
        with:
          toolchain: nightly-2026-08-26
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Generated proofs build against proofs/ (lake build)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cargo build -p spar --locked
          tools/check_generated_proofs.py --spar target/debug/spar \
            --workdir "$RUNNER_TEMP/generated-proofs" --negative-control

      # Capture the Lake log on failure for forensic review. The action
      # streams output to the GH log already; this preserves a downloadable
      # copy in the run artifacts so reviewers don't have to scrape logs.
      - name: Collect lake build log
        if: failure()
        run: |
          mkdir -p ../lake-artifacts
          # Lake stores per-target logs under .lake/build/.
          if [ -d .lake/build ]; then
            find .lake/build -name '*.log' -print0 | xargs -0 -I{} cp -v {} ../lake-artifacts/ || true
          fi
          # Also copy the manifest so reviewers see exactly which Mathlib
          # rev was in use when the build broke.
          cp -v lake-manifest.json ../lake-artifacts/ || true
          cp -v lean-toolchain ../lake-artifacts/ || true

      - name: Upload lake build artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lake-build-log
          path: lake-artifacts/
          if-no-files-found: ignore
