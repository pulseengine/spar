name: Lean Proofs

# Type-check the spar scheduling-theory proofs (proofs/Proofs/Scheduling/*).
#
# These are the load-bearing mathematical theorems behind spar-analysis:
#   * Liu & Layland 1973 — RM utilization bound        (RMBound.lean)
#   * Joseph & Pandya 1986 — RTA fixed-point convergence (RTA.lean)
#   * Dertouzos 1974 — EDF optimality for implicit deadlines (EDF.lean)
#
# Lean toolchain is pinned by `proofs/lean-toolchain`
# (currently `leanprover/lean4:v4.29.0-rc6`). `leanprover/lean-action`
# reads that file and installs the matching elan/lake/lean toolchain;
# bumping the file is the one place you change the pinned version.
#
# Mathlib is the slow dependency. We cache the Lake build directory
# (`proofs/.lake`) keyed on `lake-manifest.json`, so warm runs only
# rebuild the in-tree proof modules.

# Lean proof runs are multi-hour on cold cache. Cancel superseded PR
# runs aggressively; never cancel main / scheduled / tag runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Same construct (and the same required-check caveat) as ci.yml's `changes`
  # job — see the comment there for why this is a job-level skip and not an
  # `on: paths:` filter. An artifacts/docs-only diff cannot alter a Lean proof
  # or the reflected codegen, so this job lets those PRs skip the lake build.
  changes:
    name: Detect changed paths (proofs)
    runs-on: ubuntu-latest
    # Trivial classifier (observed <10s); gates the required Lean typecheck.
    # Enforced by tools/check_job_timeouts.py (#398).
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This job gates the required `Lean proof typecheck (lake build)` context,
      # so it is the 11th check the #384 fail-open could skip. It was a verbatim
      # clone of ci.yml's classifier and had already drifted from it — ci.yml
      # gained `rivet.yaml` in #379 and this copy never did. Both now call the
      # same script; see tools/classify_changed_paths.py for the allow-list and
      # the fail-closed rationale, including why picking up the `rivet.yaml`
      # entry here is a deliberate (and safe) loosening.
      - name: Changed-path classifier self-test
        run: tools/classify_changed_paths.py --self-test

      - id: filter
        name: Classify diff as code vs artifacts/docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          tools/classify_changed_paths.py
          --event-name "$EVENT_NAME"
          --base-sha "$BASE_SHA"
          --github-output "$GITHUB_OUTPUT"

  lean:
    name: Lean proof typecheck (lake build)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 90 min covers cold-cache Mathlib fetches via `lake exe cache get`
    # plus our in-tree proof compile. Warm runs land in well under 10 min.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@v4

      # Cache the Lake build outputs (Mathlib + transitive deps + our proofs).
      # Warm runs reuse this and only recompile changed in-tree modules.
      # Cold runs fall through to the Mathlib precompiled cache fetched by
      # lean-action's `use-mathlib-cache: true` below — that pulls
      # ~2 GB of `.olean` files from Mathlib's cloud cache instead of
      # rebuilding them from source (30+ min compile vs ~5 min download).
      - name: Cache Lake build (.lake)
        uses: actions/cache@v4
        with:
          path: |
            proofs/.lake
            ~/.elan
          key: lake-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-

      # leanprover/lean-action reads `proofs/lean-toolchain` and installs the
      # matching toolchain via elan, runs `lake exe cache get` to pull
      # precompiled Mathlib `.olean`s from the cloud cache, then runs
      # `lake build`. The action surfaces Lean errors and `sorry` warnings
      # in the log, but does NOT fail the job on `sorry` warnings without
      # explicit `warningAsError` configuration. The grep gate below is
      # the actual fail-on-sorry enforcement (see #wave3-tier-a-1 audit).
      - name: Build proofs (lake build)
        id: lake_build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          # Pull Mathlib's precompiled .olean files instead of rebuilding
          # from source. Without this, the cold-cache build hits the 1h
          # GH Actions timeout at ~98% Mathlib (saw this on the first run
          # of #151 — module 2796/2845 cancelled by timeout).
          use-mathlib-cache: true
          build-args: ""

      # Honest "fail on sorry" gate.
      #
      # The 12-persona Wave 3 audit (Lean reviewer + build engineer)
      # established that `lake build` does NOT fail the job on `sorry`
      # warnings without explicit `warningAsError` configuration in
      # `lakefile.toml`. Rather than thread Lean-version-specific flags
      # through Lake, we grep the proofs tree post-build: any line that
      # is bare `sorry` (with optional indent) is an unfinished proof
      # and turns CI red.
      #
      # Currently main carries 5 tracked sorrys in `Proofs/Network/MinPlus.lean`
      # (`backlog_bound_classical`, `delay_bound_classical`,
      #  `output_dominates_input`, `compose_delays_dominates`,
      #  `arrival_at_zero_is_burst`). Those are listed in
      # `proofs/README.md` under "Known sorrys" and tracked in
      # `COMPLIANCE.md` v0.9.1 as TODO(v1.0.0). Until they land, this
      # gate is expected to fail on `main` — that is the *point*: the
      # previous green CI was decorative, this one is honest.
      #
      # Discharging the sorrys is a separate v0.10 PR. Once a sorry is
      # discharged, this step turns green automatically; no allowlist
      # to maintain.
      # REQ-GUARD-GATE-EVIDENCE-002 (f), closes #385.
      #
      # The previous body was a two-stage grep that excluded any sorry
      # carrying a same-line `-- TODO`. Its comment explained why that was
      # safe: "the five tracked sorrys do NOT carry a same-line comment".
      # That was true when written. The sorries then grew 5 -> 12 AND moved
      # their TODO onto the same line, so an exclusion designed to be a no-op
      # silently became universal — 12 in, 0 out, `if` never fires, and the
      # step printed "No sorrys in proofs/Proofs/ — gate green."
      #
      # The gate was satisfied by exactly the thing it exists to prevent, and
      # nobody edited it; the code drifted out from under its comment. The
      # generalisable part: a self-exemption keyed on a pattern the exempted
      # code itself controls cannot hold — the proof author writes both the
      # `sorry` and the `-- TODO` that excuses it.
      #
      # Replaced by a declared ratchet. --max-sorries is the floor, and it is
      # here (in the workflow) rather than in the proofs, so lowering it is a
      # deliberate edit by someone other than the proof being exempted.
      # 12 is the measured count on ae27ff1. LOWER IT as proofs land; the gate
      # says so on every run where the real count is below the floor.
      # Discharging these is REQ-PROOF-NC-MINPLUS-001 (v0.38.0).
      - name: Lean-sorry guardrail self-test
        if: always()
        working-directory: ${{ github.workspace }}
        run: tools/check_lean_sorries.py --self-test
      - name: Fail on sorry (post-build gate)
        if: always()
        working-directory: ${{ github.workspace }}
        run: tools/check_lean_sorries.py --max-sorries 12

      # Codegen freshness gate (REQ-PROOF-SCHED-CODEGEN-001, #321).
      #
      # `crates/spar-analysis/src/scheduling_verified.rs` is GENERATED by
      # `lake exe codegen`, which reflects the elaborated Lean `Expr` of the
      # recurrence definitions (RTACore.lean, RTAJitteredCore.lean) into Rust.
      # This step re-runs the generator and fails if the committed file has
      # drifted from its output — i.e. if someone hand-edited the generated
      # Rust, or changed a reflected Lean definition without regenerating.
      # That is what makes the theory↔code link for the recurrence arithmetic
      # drift-proof rather than property-test-hopeful.
      #
      # `lake exe codegen` only needs the mathlib-free *Core modules, so it
      # builds in seconds regardless of the Mathlib cache state above.
      - name: Codegen freshness gate (scheduling_verified.rs)
        working-directory: proofs
        run: |
          set -euo pipefail
          lake exe codegen > /tmp/scheduling_verified.gen.rs
          if ! diff -u ../crates/spar-analysis/src/scheduling_verified.rs \
                       /tmp/scheduling_verified.gen.rs; then
            echo ""
            echo "::error::scheduling_verified.rs is out of sync with the Lean generator."
            echo "::error::Regenerate: cd proofs && lake exe codegen > ../crates/spar-analysis/src/scheduling_verified.rs"
            exit 1
          fi
          echo "scheduling_verified.rs matches the Lean generator — gate green."

      # Capture the Lake log on failure for forensic review. The action
      # streams output to the GH log already; this preserves a downloadable
      # copy in the run artifacts so reviewers don't have to scrape logs.
      - name: Collect lake build log
        if: failure()
        run: |
          mkdir -p ../lake-artifacts
          # Lake stores per-target logs under .lake/build/.
          if [ -d .lake/build ]; then
            find .lake/build -name '*.log' -print0 | xargs -0 -I{} cp -v {} ../lake-artifacts/ || true
          fi
          # Also copy the manifest so reviewers see exactly which Mathlib
          # rev was in use when the build broke.
          cp -v lake-manifest.json ../lake-artifacts/ || true
          cp -v lean-toolchain ../lake-artifacts/ || true

      - name: Upload lake build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lake-build-log
          path: lake-artifacts/
          if-no-files-found: ignore
