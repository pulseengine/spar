  - id: TEST-NC-VALIDATION
    type: feature
    title: NC-bound cross-validation against panco reference
    description: >
      Integration test crates/spar-network/tests/nc_validation.rs rebuilds
      three FIFO fixtures (tandem_cross, single_flow_tandem,
      three_server_line) in spar's TfaFlow/ServiceCurve types and checks
      tfa_bound against bounds computed offline by panco (Bouillard's
      reference LP-DNC implementation, github.com/Huawei-Paris-Research-
      Center/panco @ fc35089, lp_solve 5.5.2.14). Per flow it asserts
      SOUNDNESS (spar bound >= panco EXACT ELP bound — the true worst case)
      and AGREEMENT (spar TFA tracks panco TFA within 2% rounding). The
      exact-bound floor is the only check that can catch an unsound
      (optimistic) bound, which a self-consistent hand-golden cannot. panco
      is not vendored; the reference numbers are pinned in-test with
      provenance + regen recipe in tests/oracles/panco/README.md (Python is
      not in spar's CI path). Establishes the EXACT soundness floor that
      REQ-NC-PLP-001 is gated against (plp >= EXACT). PLP <= TFA holds on
      these fixtures but is NOT a universal law (PLP and TFA are
      incomparable — see TEST-NC-PLP's incomparability note).
    fields:
      method: automated-test
      steps:
        - run: cargo test -p spar-network --test nc_validation
    status: passing
    tags: [v0.18.0, network, network-calculus, validation, oracle]
    links:
      - type: satisfies
        target: REQ-NC-VALIDATION-001
      - type: satisfies
        target: REQ-NC-TFA-001

  - id: TEST-NC-PLP
    type: feature
    title: PLP feed-forward bound — port-fidelity against panco pure PLP
    description: >
      spar-network::plp unit tests plus the plp_xval module in
      crates/spar-network/tests/nc_validation.rs (feature milp-solver)
      exercise plp_bound on the three pinned FIFO fixtures. plp.rs is a
      faithful transcription of panco's PURE polynomial LP
      (FifoLP(polynomial=True, tfa=False)) restricted to feed-forward
      sink-trees via the sub_network projection. Per flow the tests assert
      the SOUNDNESS floor (plp >= panco EXACT ELP bound), PORT-FIDELITY
      (spar's HiGHS solve reproduces panco's lp_solve pure-PLP optimum to
      <= 0.05% — solver precision: 39.0/34.0, 27.0, and the discriminating
      72.22/61.11/57.98 µs), and a PER-FIXTURE pin plp <= spar's own TFA
      bound. That ≤ TFA pin is NOT a universal law: pure polynomial PLP and
      TFA are INCOMPARABLE over-approximations (both sound, neither
      dominates) — under extreme cross-burst PLP can exceed TFA (panco's own
      PLP 1148 > TFA 1048 ≥ EXACT 1035 µs on the converging-bridge net; see
      network_wide_tfa_index_aligns_on_converging_tree). The authoritative
      bound is min(PLP, TFA) (REQ-NC-PLP-MIN-001). On these benign fixtures
      pure PLP equals EXACT on the tandems and is strictly below TFA on the
      3-hop line (72.22 vs 68.4 µs EXACT, << 134.7 µs TFA) — the dominance
      LUDB/PMOO cannot show on a line.
      Because the LP is transcribed from panco and the floor is also
      panco's, this is port-fidelity (a regression pin), NOT independent
      method-soundness; the latter is the deferred simulation floor
      REQ-NC-SIM-FLOOR-001. Cyclic / branching topology is rejected
      (NotFeedForward, REQ-NC-PLP-002); the tfa=True tightening to EXACT is
      REQ-NC-PLP-003. As of REQ-NC-PLP-CONVERGE-001 a non-topological
      single-successor converging tree is no longer rejected but topologically
      RELABELLED and solved (see TEST-NC-PLP-CONVERGE); the former
      NonTopologicalSinkTree guard is retained as a post-relabel invariant
      that still prevents the .expect panic if the topo sort is buggy.
    fields:
      method: automated-test
      steps:
        - run: "cargo test -p spar-network --lib plp::"
        - run: "cargo test -p spar-network --test nc_validation plp_xval"
    status: passing
    tags: [v0.18.0, network, network-calculus, plp, validation, oracle]
    links:
      - type: satisfies
        target: REQ-NC-PLP-001
      - type: satisfies
        target: REQ-NC-VALIDATION-001

  - id: TEST-NC-PLP-CONVERGE
    type: feature
    title: PLP on converging sink-trees via topological relabel
    description: >
      Exercises the topological-relabel path added to plp_bound for
      single-successor CONVERGING sink-trees handed in non-topological order
      (many-talkers→one-listener). Two layers of oracle. (1) PERMUTATION
      INVARIANCE — the primary property, needing no external numbers: the
      plp.rs unit test non_topological_relabel_is_permutation_invariant builds
      a converging tree whose sink is NOT the highest-numbered server, asserts plp_bound
      now returns Ok (no PlpError::NonTopologicalSinkTree, no panic in solve),
      and asserts its per-flow bound equals — exactly — the bound of the SAME
      physical network presented already-topologically (sink last). This
      proves the relabel is a sound pure permutation. topological_sink_tree_
      accepted is retained unchanged as the already-ordered baseline. (2)
      SOUNDNESS FLOOR — the plp_converge_xval module in nc_validation.rs
      (feature milp-solver) runs the three pinned converging panco fixtures in
      non-topological first-appearance order and asserts per-flow PLP matches
      panco's pure-PLP reference to solver precision, sound (≥ EXACT) and —
      on these benign converging nets — below TFA (PLP ≤ TFA holds per-fixture
      here; it is NOT universal, see TEST-NC-PLP's incomparability note):
      converge_2to1 PLP 48.89 ≪ TFA 60.39, converge_2to1_
      tail2 60.0 ≪ 106.44 (the 1.77× wedge), converge_3to1 70.0 ≪ 74.59 µs.
      Values regenerated fresh from the pinned panco venv (lp_solve backend).
      The relabel closes the sink==num_servers-1 assumption the sub-network
      solve depends on (lines that .expect a successor for every non-sink
      server), so the converging shape — the dominant TSN topology — now
      yields the PLP≪TFA dominance LUDB/PMOO cannot show on a tree.
    fields:
      method: automated-test
      steps:
        - run: "cargo test -p spar-network --lib plp::"
        - run: "cargo test -p spar-network --test nc_validation plp_xval::panco_converge"
    status: passing
    tags: [v0.19.0, network, network-calculus, plp, converging, validation, oracle]
    links:
      - type: satisfies
        target: REQ-NC-PLP-CONVERGE-001

  - id: TEST-NC-PLP-MIN
    type: feature
    title: Authoritative network-wide NC bound is min(PLP, TFA)
    description: >
      Verifies REQ-NC-PLP-MIN-001: the bridge emits a per-stream
      WcttAuthoritativeBound equal to the pointwise minimum of the
      network-wide TFA and PLP end-to-end delays. The spar-analysis unit
      test network_wide_authoritative_bound_is_min_of_plp_and_tfa runs the
      converging-tree fixture (bridge_converge_aadl) — the documented
      incomparability counterexample where the fast stream's pure PLP
      (~1148µs) EXCEEDS its TFA (~1048µs) — and asserts: (1) one
      authoritative bound per stream is emitted regardless of the
      milp-solver feature; (2) with milp-solver, authoritative == min(PLP,
      TFA) for every stream; (3) on the PLP>TFA cross-burst stream the
      authoritative bound equals TFA and sits strictly below PLP, so a
      regression that blindly reported the looser PLP would fail; (4)
      without the milp-solver feature (PLP absent) the authoritative bound
      equals TFA. Pure selection over two already-computed sound bounds —
      min of two sound over-approximations is itself sound, adding no new
      soundness surface; the reported bound is therefore never worse than
      TFA while keeping the PLP win wherever PLP is tighter.
    fields:
      method: automated-test
      steps:
        - run: "cargo test -p spar-analysis --lib --features milp-solver network_wide_authoritative_bound"
        - run: "cargo test -p spar-analysis --lib --no-default-features network_wide_authoritative_bound"
    status: passing
    tags: [v0.22.0, network, network-calculus, plp, tfa, bridge, oracle]
    links:
      - type: satisfies
        target: REQ-NC-PLP-MIN-001

  - id: TEST-NC-PLP-STR
    type: feature
    title: TFA-strengthened PLP — tightening to EXACT (panco tfa=True oracle)
    description: >
      Exercises plp_bound_tfa_strengthened (REQ-NC-PLP-003): the polynomial LP
      with panco's per-server TFA-delay constraints added (Bouillard
      fifo/plpConstraints.py, the FifoLP tfa=True path). Unlike TEST-NC-PLP
      (a transcription of panco's PURE LP), this variant feeds the LP spar's
      OWN independent FP-TFA per-server delays (tfa_bound), so reproducing
      panco's tfa=True column is wiring-level agreement implied by
      (LP port-fidelity from TEST-NC-PLP) ∧ (spar TFA ≈ panco TFA from
      TEST-NC-VALIDATION), not a wholly independent recomputation. Two layers.
      (1) plp.rs unit tests three_server_line_tfa_strengthened and
      converge_bridge_tfa_strengthened pin [68.4,58.4,57.98] and
      [1035.2,10030.7]. (2) the plp_str_xval module in nc_validation.rs
      (feature milp-solver) pins the panco tfa=True column under three
      guarantees: SOUNDNESS (strengthened ≥ panco EXACT — the strengthening
      embeds sound per-server delays ≥ true, so the one-directional
      t[h]−t[j] ≤ d[j] constraints keep the bound ≥ EXACT), AGREEMENT
      (strengthened ≈ panco tfa=True within method tolerance), and MONOTONE
      (strengthened ≤ pure PLP — adding constraints to a maximization can only
      lower the optimum). converge_bridge additionally asserts the HEADLINE:
      on the very net where PURE PLP exceeds TFA (dataA pure 1148.33 > TFA
      1048.09 — TEST-NC-PLP's incomparability counterexample), strengthening
      drives dataA to EXACT 1035.2, BACK BELOW TFA — restoring plp ≤ TFA where
      pure PLP could not. Panco generator oracles/panco/panco_bench.py
      (FifoLP(polynomial=True, tfa=True)).
    fields:
      method: automated-test
