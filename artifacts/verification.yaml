      - type: satisfies
        target: REQ-NC-VALIDATION-001

  - id: TEST-NC-BRIDGE
    type: feature
    title: AADL instance → network-wide NC solver bridge
    description: >
      The network-wide TFA/PLP arm in crates/spar-analysis/src/wctt.rs
      (network_wide_nc_bounds, gated behind --pmoo) turns an instantiated
      AADL TSN model into solver input. wctt's collect_streams /
      service_for_bus already assemble per-stream ArrivalCurves (routed by
      Actual_Connection_Binding) and per-switch rate-latency ServiceCurves;
      the bridge supplies the missing step — a single global dense server
      index over every traversed switch, into which all streams' hops map,
      yielding one TfaFlow/PlpFlow per stream fed to one network-wide
      tfa_bound / plp_bound call. It surfaces WcttTfaBound and (under
      milp-solver) WcttPlpBound Info diagnostics. Distinct from the
      per-tandem pmoo_or_sfa bridge: here every stream is a flow in one
      global network. Tests network_wide_tfa_fires_only_under_pmoo and
      network_wide_plp_is_at_most_tfa_on_fifo_line assert the arm is off by
      default (byte-identical contract — golden fixtures untouched), fires
      one bound per stream over a shared 3-hop FIFO line, and that per-flow
      PLP <= TFA (39 us vs 105.5 us here — the line-topology dominance that
      LUDB/PMOO cannot show). A third test,
      network_wide_index_aligns_shared_switch, exercises DIVERGENT routing:
      two streams share switch f1 then split (one to a deliberately slow
      switch, one all-fast) via per-connection Actual_Connection_Binding
      (applies to <connection>) — proving collect_streams honors the
      connection-level binding over the system-level one, and that the
      global dense index reuses the shared switch's slot across streams
      (a misalignment would alias the second stream onto the slow curve;
      the test asserts a >10x delay gap that only holds when slots align).
      Non-FIFO hops, unstable servers, and PLP
      NotFeedForward skip the arm transparently, leaving the per-stream SFA
      bounds authoritative. The production caller is the CLI --pmoo path
      (run_all_analyses_with_pmoo, package spar). A fourth test,
      network_wide_tfa_index_aligns_on_converging_tree, guards the global
      index on a CONVERGING (many-talkers→one-sink) shape; as of
      REQ-NC-PLP-CONVERGE-001 the PLP arm fires there (topological relabel)
      rather than skipping. That fixture is a deliberately pathological
      10000-µs-slow-switch net and doubles as the live counterexample to a
      universal PLP ≤ TFA: pure PLP exceeds TFA there (panco PLP 1148 > TFA
      1048 ≥ EXACT 1035 µs, reproduced to the decimal), so the test asserts
      only index alignment (slow-stream PLP dominates fast), not a sandwich.
      The authoritative bound min(PLP, TFA) is REQ-NC-PLP-MIN-001.
    fields:
      method: automated-test
      steps:
        - run: "cargo test -p spar-analysis --lib wctt::tests::network_wide"
