    tags: [trace-topology, ingest, gptp, sync, v0100]

  - id: REQ-TRACE-TOPOLOGY-007
    type: requirement
    title: IPv4 + IPv6 address properties in Spar_Identity
    description: >
      System shall extend the Spar_Identity property set with
      IPv4_Address and IPv6_Address (aadlstring; applies to device,
      processor, system, bus, abstract). Typed accessors live in
      spar-trace-topology::identity following the same typed-first /
      string-fallback pattern as the existing six identity
      properties. Enables the v0.11.0 reconciler to check L3
      identity against runtime-observed ARP / NDP / DHCP state.
    status: implemented
    tags: [trace-topology, properties, identity, ip, v0100]

  - id: REQ-TRACE-TOPOLOGY-008
    type: requirement
    title: IdentityUnknown reconciliation check (component-borne identities)
    description: >
      System shall provide the IdentityUnknown reconciliation check in
      spar-trace-topology::engine — the first of the five v1
      deterministic checks. The check builds a DeclaredModel index by
      walking an instantiated AADL SystemInstance and reading the
      Spar_Identity::MAC_Address and Spar_Identity::LLDP_Chassis_Id
      properties of every component, then flags any unicast MAC observed
      in the PCAPNG capture, or any LLDP neighbor chassis-id observed in
      the topology snapshot, that no AADL component declares.
      Group-addressed (multicast / broadcast) MACs are exempt — they
      reconcile against Multicast_Group, a connection-borne surface.
      Findings are deterministic: PCAPNG findings first then LLDP
      findings, each ascending, each distinct identity reported once.
      Connection-borne identities (Stream_Handle, Multicast_Group,
      VLAN_ID) and the other four checks are deferred to sibling v0.11.0
      commits. Per docs/designs/v0.10.0-trace-topology.md §4.1.
    status: implemented
    tags: [trace-topology, reconcile, engine, v0110, track-g]

  - id: REQ-TRACE-TOPOLOGY-009
    type: requirement
    title: GptpOutOfBudget reconciliation check (single-budget case)
    description: >
      System shall provide the GptpOutOfBudget reconciliation check in
      spar-trace-topology::engine — the second of the five v1
      deterministic checks. The check reads the declared
      `Spar_TSN::Sync_Error` budget (in picoseconds, via the existing
      spar-network::tsn::get_sync_error_ps accessor's unit conversion)
      off every component (bus or processor) of an instantiated AADL
      SystemInstance, then — if exactly one such budget is declared —
      flags the owning component when any observed gPTP port's
      worst-case sync error exceeds it. The finding's `observed_ps`
      carries the worst-case across all over-budget ports per design
      §4.4's "worst-case observed error" wording. Multi-budget systems
      need port→bus ownership mapping (the feature-level
      `LLDP_Port_Id` surface, deferred with the connection-property
      surface elsewhere in this module); the check returns no findings
      in the multi-budget case rather than mis-attributing the owner.
      Boundary equality (observed == budget) is a pass per §4.4's "does
      not exceed" wording. Per
      docs/designs/v0.10.0-trace-topology.md §4.4.
    status: implemented
    tags: [trace-topology, reconcile, engine, gptp, v0110, track-g]

  - id: REQ-BINDING-002
    type: requirement
    title: Actual_Processor_Binding accepts nested dotted reference paths
    description: >
      System shall resolve `Actual_*_Binding => (reference (a.b.c))`
      property values whose target is a multi-level dotted instance
      path, not just a single-component leaf name. Resolution uses
      suffix-matching against full instance paths plus root-anchored
      walk, mirroring the existing dotted-path resolver in
      spar-cli::moves::resolve_component. Single-level references
      continue to resolve as before; unknown paths emit the existing
      "does not exist in instance model" diagnostic unchanged.
    status: implemented
    tags: [binding, hir-def, overlay, v093]

  - id: REQ-CLASSIFIER-MATCH-002
    type: requirement
    title: classifier_match distinguishes delegation from peer access connections
    description: >
      Per AADL v2.3 §9.4, access connections come in two kinds:
      peer (subcomponent-to-subcomponent) connections where the
      provides/requires directions must oppose, and delegation
      connections (enclosing-component feature to subcomponent
      feature) where the directions must match. spar shall apply
      the correct rule per connection kind based on whether either
      endpoint references the enclosing component's own feature.
      Resolves user-reported v0.9.3 false-positive on bus access
      delegation connections (32 occurrences in OEM SIP-internal
      wiring).
    status: implemented
    tags: [classifier-match, connections, v093]

  - id: REQ-ASSERTION-COMPARISON
    type: requirement
    title: Assertion DSL supports count() comparisons against integer literals
    description: >
      The assertion DSL shall evaluate pipeline expressions ending in
      `.count()` followed by a comparison operator and integer literal
      (`>=`, `>`, `<=`, `<`, `==`, `!=`) and return a Bool result. This
      applies uniformly to Count, Components, Features, and Diagnostics
      collection-valued pipelines. Resolves v0.9.x bug where
      `components.where(...).count() >= n` failed to parse, leaving users
      unable to express cardinality constraints in [[assertion]] blocks.
    status: implemented
    tags: [assertions, eval, v093]

  - id: REQ-HAS-FEATURES
    type: requirement
    title: has() predicate matches component features by name
    description: >
      The has() predicate in the assertion DSL must return true when
      the component under evaluation owns a feature (port, bus access,
      data access, parameter, feature group, etc.) whose name matches
      the argument string, in addition to the existing property-name
      match. Bare names (no '::' separator) are checked against both
      property names and feature names; qualified names (set::name)
      continue to resolve only against the property namespace.
    status: implemented
    tags: [assertions, v093]

  - id: REQ-APPLIES-TO-FEATURE-PATH
    type: requirement
    title: applies_to property association accepts feature paths
    description: >
      Per AADL v2.3 (SAE AS5506D §11.3), a property association's
      `applies to` clause may name a feature on a subcomponent
      (`Some_Property => value applies to fw.input_port;`), not just
      a subcomponent path. spar shall resolve such paths: when all
      segments name subcomponents the property attaches to the leaf
      component; when the final segment names a feature on the
      penultimate component, the property attaches to that component
      and the feature is the logical target. Resolves v0.9.x bug where
      feature-path applies_to clauses emitted spurious "could not be
      resolved" diagnostics and dropped the property.
    status: implemented
    tags: [hir-def, properties, v093]

  # ── Mermaid emission ────────────────────────────────────────────────────

  - id: REQ-MERMAID-001
    type: requirement
    title: Flowchart emission from AADL instance models
    description: >
      spar shall provide a library crate (spar-mermaid) that accepts a
      SystemInstance and emits a Mermaid flowchart TD diagram.  Each
      component instance becomes one labelled node (label format:
      "category: name").  Each ConnectionInstance whose source and
      destination both resolve to emitted nodes becomes one directed edge.
      Callers may filter by ComponentCategory set, by max parent-hop depth
      from the root, and by whether connection edges are included.  The
      empty-category filter means "emit all categories".  This crate is
      emit-only; no CLI subcommand, no round-trip parser, no classDiagram
      or block-beta — those are follow-on work.
    status: implemented
    tags: [mermaid, emission, v0100]

  - id: REQ-MERMAID-CLI-001
    type: requirement
    title: spar emit --format mermaid CLI subcommand
    description: >
      The spar CLI shall expose a top-level `emit` subcommand that accepts
      --root (required), --format mermaid (default, only valid value), one or
      more AADL source files, and optional filters --category (comma-separated
      ComponentCategory names, case-insensitive), --max-depth N, and
      --no-connections.  Output is written to stdout or to -o/--output path.
      The subcommand must reuse the existing parse/lower/instantiate pipeline
      (HirDefDatabase + GlobalScope + SystemInstance::instantiate) and call
      spar_mermaid::emit_flowchart to produce the diagram text.
    status: implemented
    tags: [mermaid, cli, v0100]

  # ── Lean formal proofs — v0.10.0 ────────────────────────────────────────

  - id: REQ-PROOF-LATENCY-001
    type: requirement
    title: Lean 4 proof of end-to-end flow latency monotonicity
    description: >
      System shall include a sorry-free Lean 4 proof that end-to-end flow
      latency is monotone in per-component worst-case execution times: if
      every component WCET in path c1 is pointwise ≤ the corresponding WCET
      in path c2, then Latency s c1 ≤ Latency s c2 for any sampling delay s.
      Proof lives in proofs/Proofs/Scheduling/Latency.lean and is exercised
      by the `lake build` CI gate.
    status: implemented
    tags: [proof, latency, lean, v0100]

  - id: REQ-PROOF-ARINC653-001
    type: requirement
    title: Lean 4 proof of ARINC 653 partition isolation
    description: >
      System shall include a sorry-free Lean 4 proof that, in a conformant
      ARINC 653 Major Frame schedule, a thread whose static binding differs
      from a window's owning partition cannot execute within that window.
      Proof lives in proofs/Proofs/Scheduling/Arinc653Isolation.lean and is
      exercised by the `lake build` CI gate.
    status: implemented
    tags: [proof, arinc653, lean, v0100]

  - id: REQ-EMV2-PROPAGATION-001
    type: requirement
    title: EMV2 error-propagation traversal across AADL connection graph
    description: >
      spar shall provide an analysis pass that, for each component declaring
      an `out propagation` for an error type T, walks the AADL connection
      graph (via semantic connections) to identify all downstream components
      that declare a matching `in propagation` for T (case-insensitive match
      per AADL EMV2 v2 §4.3).  The traversal shall recurse transitively
      through relay components that declare both in and out propagations for
      the same type.  Cycle detection (tracking component+error_type pairs)
      shall prevent infinite loops in cyclic topologies.  Error flows
      (path/sink/source) shall be captured per component in the report but
      shall not by themselves trigger cross-component propagation.
    status: implemented
    tags: [emv2, analysis, v0100, safety]

  # ── Issue-mapped backlog (GitHub triage → rivet, 2026-06-23) ─────────────

  - id: REQ-EMV2-PROPAGATION-002
    type: requirement
    title: Integrate parsed EMV2 annex into SystemInstance for error-propagation
    description: >
      The error-propagation pass (REQ-EMV2-PROPAGATION-001) consumes an
      `Emv2Overlay` that, on the `spar analyze` path, is always EMPTY
      (emv2_propagation.rs:383 `Emv2Overlay::new()`), so it reports
      "0 chain(s), 0 local flow(s)" for EVERY real model. GitHub #294.
      SCOPE CORRECTION (investigated 2026-06-23): #294's premise that the
      fault tree and EMV2→STPA bridge already read the annex is WRONG —
      those passes work off EMV2 *properties* and component structure, NOT
      the annex subclause. The EMV2 annex body IS fully parsed
      (`spar-annex/emv2` → `Emv2Parse`, bundled in `ParseResult.annexes`)
      but is PARSED-BUT-DISCARDED: HIR lowering drops it
      (item_tree/lower.rs:169 `ANNEX_SUBCLAUSE => {}`), `SystemInstance`
      has no EMV2 fields, and `Analysis::analyze(&self, &SystemInstance)`
      cannot see the parse result. So this is NOT a small overlay-wiring
      fix — it requires INTEGRATING the parsed annex into the instance
      model: (1) lower the EMV2 annex subclause during instance
      construction (hir-def, salsa), storing per-component error
      source/sink/path + in/out propagation declarations on
      `SystemInstance` with an accessor; (2) resolve annex component/port
      names to `ComponentInstanceIdx`/feature; (3) a bridge building the
      `Emv2Overlay` from that instance data; (4) wire it into the analyze
      path. A genuine cross-layer feature (the gap 3 files call "future
      work"), re-scoped from v0.21.0 → v0.22.0 and from `bug` to a feature.
      Oracle (as ACTUALLY verified — see SCOPE CORRECTION 2026-07-02 below):
      the annex is ingested end-to-end and per-component LOCAL FLOWS are
      analysed on the real repro model (bundled OSATE network_protocol_pkg:
      6 flows, was 0 pre-L4); a synthetic source→sink error path across a PORT
      connection yields ≥1 chain; empty-overlay/negated cases yield 0. NOTE:
      cross-component CHAINS on the real repro models remain 0 — carved to the
      successor REQ-EMV2-PROPAGATION-003 (binding-path traversal); see below.
      LAYER STATUS (4-PR foundation, user-directed v0.23.0 headline
      2026-07-01): L1 (semantic EMV2 model in spar-annex — Emv2Model lifting
      the CST into typed propagations/flows) LANDED, verified by
      TEST-EMV2-SEMANTIC-MODEL; L2 (item-tree attach — the component's EMV2
      subclause is retained in an emv2_subclauses arena, referenced from
      ComponentType/ImplItem.emv2) LANDED, verified by
      TEST-EMV2-ITEMTREE-ATTACH; L3 (instance projection — the classifier's
      EMV2 model is projected onto each ComponentInstance at instantiation,
      stored as a SystemInstance emv2_models side-table with an emv2_for
      accessor) LANDED, verified by TEST-EMV2-INSTANCE-PROJECT; L4 (overlay
      populate + analyze-path wiring + end-to-end > 0-chains oracle) LANDED,
      verified by TEST-EMV2-OVERLAY-WIRING — Emv2Overlay::from_instance builds
      the overlay from the projected instance EMV2 (replacing the empty
      Emv2Overlay::new() at emv2_propagation.rs analyze). (cmd_analyze needed no
      change: it already instantiates via SystemInstance::instantiate, which
      runs the L3 projection.)
      SCOPE CORRECTION (2026-07-02, empirically verified): the closing claim
      that `spar analyze` "reports real propagation chains" and that #294 is
      CLOSED was an OVER-CLAIM. Running `spar analyze --root
      network_protocol_pkg::MySystem.basic` on the bundled OSATE repro model
      reports `EMV2 propagation: 0 chain(s), 6 local flow(s)` — the FLOWS are
      now analysed (real progress: was 0 pre-L4) but CHAINS are still 0. The
      L4 end-to-end oracle (emv2_chain.rs) that yields ≥1 chain uses a SYNTHETIC
      Sender→Receiver PORT-connection fixture; the real repro models instead
      propagate along the `Actual_Connection_Binding` stack (dataxfer→CRC→DP→
      Network) via `bindings`/`connection` pseudo-features, and
      `compute_error_propagation` builds its traversal graph ONLY from port
      `semantic_connections` (+ its docstring: does not follow `path` flows or
      type transformation). So L1-L4 deliver the annex-ingestion foundation +
      local-flow analysis + the port-connected traversal mechanism — a real,
      shippable win — but real-model cross-component chains are the UNFINISHED
      half, carved to successor REQ-EMV2-PROPAGATION-003 (binding-path traversal
      + path-flow type transformation). #294 REOPENED (its headline symptom
      "0 chains for all real models" still reproduces). Separate follow-up (out
      of scope): the fault tree + EMV2→STPA bridge still hardcode error_type
      "ServiceFailure" and would carry real error types once wired to this same
      foundation.
    status: verified
    release: v0.23.0
    tags: [emv2, analysis, safety, hir-def, capability]

  - id: REQ-EMV2-PROPAGATION-003
    type: requirement
    title: EMV2 error propagation along the Actual_Connection_Binding stack
    description: >
      Successor to REQ-EMV2-PROPAGATION-002 (GitHub #294 reopened). The L1-L4
      foundation ingests the EMV2 annex and analyses per-component local flows,
      but `spar analyze` still reports 0 cross-component CHAINS on the real
      repro models, because `compute_error_propagation` builds its traversal
      graph ONLY from port `semantic_connections`. Real AADL error models
      propagate along the `Actual_Connection_Binding` resource stack, not (only)
      data-port connections. Empirical ground truth (2026-07-02): the bundled
      OSATE `network_protocol_pkg::MySystem.basic` is a layered protocol stack
      `dataxfer` → CRC → DP → Network (each bound to the next via
      Actual_Connection_Binding). Its EMV2 propagations live on the
      `bindings`/`connection` pseudo-features of the virtual buses; the only
      port connection (Sender.output → Receiver.input) carries NO EMV2. So the
      port-only traversal finds zero edges among the propagation-bearing
      components and reports `0 chain(s), 6 local flow(s)`.
      TWO mechanism gaps must both be closed (verify each against the code
      before implementing — do not assume binding edges alone suffice):
      (1) BINDING-EDGE TRAVERSAL — extend the `outgoing` graph so a component's
      `bindings` out-propagation reaches the component(s) bound to it (resolve
      Actual_Connection_Binding references to ComponentInstanceIdx), in addition
      to port semantic_connections;
      (2) PATH-FLOW TYPE TRANSFORMATION — `traverse` currently matches on
      type-equality and (per its docstring) does not follow `path` flows. The
      real model REQUIRES this: CRC's `DetectCorruption` is
      `error path connection{ValueCorruption} -> bindings {LostMessage}` — it
      transforms ValueCorruption→LostMessage (a CRC check turning corruption
      into a dropped frame). A chain from Network's HWFault{ValueCorruption}
      through CRC must switch error type mid-path, which type-equality matching
      cannot express.
      ORACLE (RED-BEFORE-GREEN, the missing test that let 002 over-claim): a
      test that runs the propagation pass on the ACTUAL bundled
      `network_protocol_pkg.aadl` (not a synthetic fixture) and asserts a
      SPECIFIC, hand-traced chain count > 0 (currently 0 — that IS the red).
      Derive the exact expected chains + their error types by manual trace of
      the binding stack at implementation time so the oracle is non-vacuous
      (the discipline REQ-002's synthetic fixture had but its real-model oracle
      lacked). A no-EMV2 / port-only model must still yield 0.
    status: proposed
    tags: [emv2, analysis, safety, binding, capability]
    fields:
      release: v0.24.0

  - id: REQ-WRPC-BINDING-002
    type: requirement
    title: Honor per-connection Actual_Connection_Binding (applies to <conn>) in wrpc-binding
    description: >
      The `wrpc-binding` check (crates/spar-analysis/src/wrpc_binding.rs)
      reads the OWNING component's flat property map for
      `Actual_Connection_Binding`, so it misses the standard per-connection
      `Actual_Connection_Binding => (reference (bus)) applies to <conn>`
      idiom and emits a false-positive on EVERY correctly bus-bound
      cross-processor connection — the analysis cannot be satisfied by a
      correct deployment, so it cannot gate. spar shall resolve the binding
      on the CONNECTION instance (honor the `applies to <conn>`
      association, which lowers to the per-connection property map) in
      addition to the owner's flat map, so a correctly bus-bound
      cross-processor connection no longer warns. Oracle: a cross-processor
      connection bound via `applies to <conn>` no longer warns; a genuinely
      unbound one still warns; the legacy owner-map form still works. Repro:
      jess hardware/pixhawk6x-rt.aadl. Verifying the binding's reference
      RESOLVES to an actual `bus` component (vs. mere presence) is carved
      out to REQ-WRPC-BINDING-003 to avoid reintroducing false-positives on
      reference forms the resolver can't yet follow. Tracks GitHub #281.
    status: implemented
    tags: [wrpc, binding, analysis, bug]
    fields:
      release: v0.21.0

  - id: REQ-WRPC-BINDING-003
    type: requirement
    title: Verify wrpc-binding Actual_Connection_Binding resolves to an actual bus
    description: >
      Follow-up to REQ-WRPC-BINDING-002 (which honors a per-connection
      `Actual_Connection_Binding` by PRESENCE). spar should additionally
      resolve the binding's `reference (...)` value to a component instance
      and warn when it does NOT resolve to a `bus` / `virtual bus` (the
      documented intent) — catching a connection bound to the wrong target.
      Deferred from -002 because naive reference resolution risks new
      false-positives on dotted/multi-level reference paths the resolver
      cannot yet follow; the sound rule is "warn only when the reference
      resolves UNAMBIGUOUSLY to a non-bus component, accept otherwise".
      Oracle: a connection bound to a non-bus component warns; one bound to
      a bus, or whose reference cannot be resolved, does not.
    status: verified
    release: v0.22.0
    tags: [wrpc, binding, analysis]

  - id: REQ-CODEGEN-WIT-CONN-001
    type: requirement
    title: Connection-aware WIT codegen — shared cross-component contracts
    description: >
      `generate_wit` (crates/spar-codegen/src/wit_gen.rs) emits a
      per-process ports interface from each process's OWN features and
      never walks `ConnectionInstance`s, so a cross-component connection
      produces no shared interface, no package cross-reference, and no
      guarantee that the producer's exported type equals the consumer's
      imported type. spar shall walk cross-component connections and emit a
      SHARED interface in a common WIT package that the producer process
      `export`s and the consumer `import`s, with matching types; group
      connected request/response port-tuples into a single `func(req) ->
      resp` (the rpc.aadl idiom); and when the connection is bound
      (`Actual_Connection_Binding`) to a wRPC/transport bus, emit the
      transport wiring/metadata alongside the WIT so same-core-fuse vs
      cross-core-RPC is a deployment choice over one contract. The
      type-level machinery in transform/wit.rs + wac.rs exists but is not
      wired to the instance connection graph. Highest-value change for
      using spar as the wRPC architecture source. Depends on
      REQ-WRPC-BINDING-002 (binding resolution). Oracle: for
      estimator.state_out -> falcon.state_in both processes reference one
      shared interface with aligned types; a type mismatch fails codegen.
      Tracks GitHub #282 (jess DD-009).
    status: proposed
    tags: [codegen, wit, wrpc, capability]
    fields:
      release: v0.23.0

  - id: REQ-RELEASE-WASM-GATES-001
    type: requirement
    title: wasm verification gates + crates.io/npm distribution in the release standard
    description: >
      spar ships a jco-transpiled wasm component with NO wasm verification
      (not even a wasmtime load-check) while the native binary gets the
      full cosign + SLSA + SBOM treatment. Per the org-wide
      release-artifact-pipeline five-track standard, spar shall add —
      Track C (wasm gates): a witness MC/DC gate and a scry
      abstract-interpretation gate on the wasm component (sigil-signing is
      blocked on pulseengine/sigil#164, use cosign in the interim); and
      Track B (distribution): publish to crates.io from signed OIDC CI and
      add an npm CLI wrapper (spar is user-facing). Coordination hub
      pulseengine/pulseengine.eu#98 — any deviation/sequencing is decided
      there in the open, not diverged silently. Oracle: the release
      workflow runs the witness + scry gates on the wasm artifact and
      publishes to crates.io + npm. Tracks GitHub #297.
    status: proposed
    tags: [release, wasm, witness, scry, supply-chain, npm]
    fields:
      release: v0.23.0

