  # "what must we implement for vX.Y" is a rivet query, not a document.

  - id: REQ-CODEGEN-WIT-TYPES
    type: requirement
    title: "WIT scalar type fidelity from Data_Size"
    description: >
      Codegen WIT emission shall map AADL data types with scalar
      Data_Size to precise WIT types (8 bytes -> u64, 4 bytes -> u32,
      etc.) instead of the blanket `type x = list<u8>` alias introduced
      by the #254 validity fix. Requires threading scope/property access
      into generate_wit. Follow-up recorded in #254/#255.
    status: implemented
    tags: [codegen, wit, interop]
    fields:
      release: v0.14.0
    links:
      - type: traces-to
        target: REQ-CODEGEN-WIT

  - id: REQ-CODEGEN-WIT-RECORDS-001
    type: requirement
    title: "Structured WIT records + wit-bindgen-wired Rust from AADL"
    description: >
      Codegen shall emit no_alloc-representable structured interfaces from real
      AADL components, closing the #319 gaps where a `data implementation` with
      subcomponents degraded to an opaque `type x = list<u8>` (forcing
      cabi_realloc) and the Rust skeleton had no wit-bindgen wiring. Delivered
      and oracle-verified in this requirement:
      (1) a `data implementation` with scalar subcomponents becomes a WIT
      `record { field: type }`, recursively for nested data implementations,
      emitted dependency-first (#319 items 1);
      (2) scalar fields map to precise WIT scalars honoring signedness/float
      (Data_Representation => Float -> f32/f64; Number_Representation => Signed
      -> s8..s64; else u8..u64), and a field that cannot be a no_alloc scalar
      (non-power-of-two size, sub-32-bit float, opaque type) is a HARD ERROR
      naming the field — codegen refuses rather than emit an allocating fallback
      (user-chosen policy);
      (3) `wit_ident` breaks PascalCase word boundaries (EepromSnapshot ->
      eeprom-snapshot, #319 item 6);
      (4) each thread's WIT world exports the lifecycle its `Dispatch_Protocol`
      implies — Periodic -> a single `{instance}-compute`; other protocols ->
      `{instance}-initialize/compute/finalize` — replacing the old opaque single
      `{thread}: func()` (#319 item 7); and
      (5) a per-process binding crate root (`crates/{proc}/src/lib.rs`) wires the
      world to Rust: `wit_bindgen::generate!` + `impl Guest` (methods matching the
      world exports) + `export!`, and the per-thread `{Struct}Component` trait is
      lifecycle-derived from the same single source (#319 item 4). All five share
      `crate::Lifecycle`/`lifecycle_for`/`dispatch_protocol` so the WIT world and
      the Rust Guest cannot drift — and because wit-bindgen derives the `Guest`
      trait from the world, a `cargo check` of the emitted crate is a
      compiler-enforced alignment oracle, not a string match.
      OUT OF SCOPE (successor REQ-CODEGEN-WIT-RECORDS-002): defining the Rust
      `*Impl` record structs + typed ports and module-wiring the per-thread files
      so the WHOLE crate (not just the binding lib.rs) compiles, and the
      wasm-component zero-`cabi_realloc` symbol check. Reported as GitHub #319.
    status: verified
    tags: [codegen, wit, rust, wit-bindgen, interop]
    release: v0.24.0
    links:
      - type: traces-to
        target: REQ-CODEGEN-WIT-TYPES

  - id: REQ-CODEGEN-WIT-RECORDS-002
    type: requirement
    title: "Whole generated component crate compiles + no unbounded ABI types"
    description: >
      Successor to REQ-CODEGEN-WIT-RECORDS-001: make the ENTIRE generated
      component crate compile, not just the WIT binding lib.rs, and give the
      no_alloc guarantee a sound oracle. Three parts:
      (a) resolve each classifier-typed port to a real Rust type via the SAME
      `DataShape` `wit_gen` uses (scalar -> u8..u64/i8..i64/f32/f64; record ->
      a generated `#[derive(Default)]` struct in a shared per-crate `types`
      module, nested-first and de-duplicated; opaque -> `Vec<u8>`), so the Rust
      struct and the WIT record cannot drift — today `feature_to_rust_type` names
      PascalCase structs that are never defined (#319 item 3);
      (b) relocate the per-thread files UNDER the crate (`crates/{proc}/src/`) and
      module-wire them from the binding lib.rs, with the process `Guest` impl
      delegating each export to the per-thread `{Struct}Component` (construct-on-
      call) instead of `todo!()`;
      (c) NO-ALLOC ORACLE at the WIT level, not the wasm symbol level. A probe
      (2026-07-08) showed `cabi_realloc` is UNCONDITIONAL wit-bindgen-rt glue —
      present and called in both a scalar-record component and a `list<u8>` one —
      so an `nm`/symbol "zero cabi_realloc" check cannot discriminate and is
      unsound. The sound, by-construction signal is that `list`/`string` are the
      only unbounded canonical-ABI types (the ones forcing dynamic `cabi_realloc`);
      everything bounded uses a static return area. So the oracle asserts the
      generated WIT for an all-scalar/record model contains no `list<`/`string`,
      with an opaque-port model as the negative control (it deliberately keeps the
      P2a `list<u8>` fallback and MUST contain it — proving the check can fire).
      SCOPE: the no-alloc guarantee holds only for models whose ports are all
      scalar/record; an opaque top-level port is out of the guarantee by design.
      Deferred to a further requirement (data plane): populating ports from the
      imported WIT functions and persistent component state (Guest methods are
      free fns). Optional stronger evidence, not a completion gate: the crate also
      builds to `wasm32-wasip2` (toolchain present locally).
    status: verified
    tags: [codegen, wit, rust, wit-bindgen, no-alloc]
    release: v0.24.0
    links:
      - type: traces-to
        target: REQ-CODEGEN-WIT-RECORDS-001

  - id: REQ-CODEGEN-WIT-DATAPLANE-001
    type: requirement
    title: "Generated Guest marshals typed data process<->thread across the WIT ABI"
    description: >
      Successor to REQ-CODEGEN-WIT-RECORDS-002 (the deferred "data plane"): make
      the generated `Guest` actually MOVE typed data across the component ABI
      instead of running each thread on a fresh, empty `{Struct}Ports::default()`.
      Today `{thread}_{method}()` constructs the component, hands it an all-Default
      ports struct, calls the lifecycle method, and drops the result — the imported
      `{proc}-ports` functions are never called, so no input reaches the component
      and no output leaves it. This requirement wires that path.

      ROUTING (the topology fact, empirically confirmed 2026-07-10). The
      process<->thread hop is encoded in the per-component `connections`
      (`Vec<ConnectionInstanceIdx>`) of the PROCESS instance, NOT in
      `semantic_connections` (which traces leaf-to-leaf and is empty here — a
      process boundary port is a waypoint, not a leaf). In a `ConnectionInstance`,
      `ConnectionEnd { subcomponent: None, feature }` denotes the process's OWN
      boundary port (the imported WIT func); `subcomponent: Some(thread)` denotes a
      thread subcomponent port (a `{Struct}Ports` field). So for a thread `t`:
      an In field `t.f` is fed by the process connection whose `dst == {Some(t),f}`,
      reading imported `{src.feature}()` (src.subcomponent == None); an Out field
      `t.g` drives the process connection whose `src == {Some(t),g}`, calling
      imported `set-{dst.feature}(ports.g)` (dst.subcomponent == None). A connection
      with BOTH ends `Some(...)` is an inter-thread hop — OUT OF SCOPE here (needs a
      value that survives between two dispatches, i.e. shared state) — and MUST be
      skipped, not misrouted as a boundary port. A thread port with no matching
      process connection emits NO marshalling line (the field stays Default) and
      must still compile.

      MARSHALLING. Scalar ports need no conversion (WIT `u32` == Rust `u32`).
      Record ports do: the imported func returns wit-bindgen's generated struct but
      the port field is `crate::types::{Record}`, so codegen emits `From`/`Into`
      bridges at the Guest boundary (field-by-field, nested-first) and keeps
      `crate::types` as the user-facing type. Both scalar and record ports are in
      scope for this requirement.

      OUT OF SCOPE (tracked successors): (i) inter-thread connections and any
      persistent component state — the generated Guest still constructs the
      component fresh per dispatch, so a STATEFUL user component is broken by
      construction; this is a STATED limitation, documented in the generated code,
      not silent (successor REQ-CODEGEN-WIT-STATE-001, v0.26). (ii) running the
      generated component on the kiln runtime as a dogfood integration oracle
      (successor REQ-CODEGEN-WIT-DATAPLANE-KILN-001) — see the oracle rationale
      below for why kiln follows rather than gates.

      ORACLE (executed, gate for this requirement — NOT a prose/compile-only claim,
      per the #294 lesson that a gate proving compilation must not back a
      requirement claiming data flow):
      (1) ROUTING RESOLVER unit test — the pure `SystemInstance -> per-thread
      [(thread_feature, direction, boundary_feature)]` resolver is asserted EXACT
      against a full-path fixture (process in -> thread in, thread out -> process
      out), plus the two blind-spot asserts: an inter-thread connection is SKIPPED,
      an unconnected thread port yields NO route.
      (2) COMPILE to `wasm32-wasip2` — the emitted marshalling code (including the
      record `From`/`Into` bridges) type-checks against the REAL wit-bindgen
      lowering; a wrong port name or type is a compile error.
      (3) WASMTIME COMPONENT EXECUTION — the load-bearing runtime proof. A host
      implements the imported `{proc}-ports` interface via wasmtime's typed
      `component::bindgen!` (an INDEPENDENT canonical-ABI impl — `fn pin() -> u32`),
      instantiates the built component, calls the exported `compute`, and asserts
      the value supplied to an In port is exactly what the component wrote to the
      wired Out port (identity/echo component), for a scalar port AND a record port
      (the record case is where a wrong-but-compiling `From` bridge — e.g. swapped
      same-typed fields — is caught; a wiring-only test cannot). Because
      `component::bindgen!` is compile-time but the `.wit` is generated at test
      runtime, the expected `.wit` is committed as a fixture, the host is bound
      against that fixture, and a golden assertion proves `generate()` reproduces it
      byte-for-byte (the `golden_test.rs` pattern).

      ORACLE RATIONALE — why wasmtime gates and kiln follows. wasmtime's
      `component::bindgen!` gives a typed, independent host ABI impl: a genuine
      cross-check of spar's lowering. kiln's host path is raw-ABI
      (`call_import(module, function, args, memory)`), so a kiln harness would
      hand-decode linear memory — re-implementing the very marshalling it verifies,
      letting a shared wrong assumption pass. So wasmtime proves CORRECTNESS
      (independent ABI) and gates v0.25.0; kiln proves INTEGRATION (the component
      runs on the target safety-critical substrate) and is a tracked follow-on so a
      cross-repo dependency on kiln's host-import maturity cannot stall the release.
    status: verified
    tags: [codegen, wit, rust, wit-bindgen, data-plane]
    release: v0.25.0
    links:
      - type: traces-to
        target: REQ-CODEGEN-WIT-RECORDS-002

  - id: REQ-CODEGEN-WIT-STATE-001
    type: requirement
    title: "Persistent component state + inter-thread connections in generated Guest"
    description: >
      Successor to REQ-CODEGEN-WIT-DATAPLANE-001 (its stated scope boundary). The
      data plane constructs each thread's component FRESH per dispatch
      (`{Struct}Default` in every `{thread}_compute`), so (a) a stateful user
      component does NOT retain state across dispatches, and (b) inter-thread
      connections (a `ConnectionInstance` with BOTH ends `Some(...)`, e.g. thread A
      out -> thread B in within one process) are skipped by `resolve_port_routes`
      because routing them requires a value that survives between two dispatches.
      Both need the same mechanism: per-component persistent state in the
      single-threaded wasm component (a `thread_local!`/`static` holding the
      component instance and inter-thread buffers), initialized once and reused.
      This requirement adds that:
      (1) PERSISTENT STATE — the generated binding REUSES the component instance
      across dispatches (a `thread_local! { RefCell<{Struct}Default> }`, borrowed per
      `compute` instead of `{Struct}Default` constructed fresh) so any state the
      component holds survives between dispatches; the skeleton struct gains
      `#[derive(Default)]` for the one-time init. `borrow_mut` assumes single-
      threaded, non-reentrant dispatch (a wasip2 component), stated in the binding.
      (2) INTER-THREAD — a `ConnectionInstance` with BOTH ends `Some(...)` routes
      through a `thread_local!` buffer with LATEST-VALUE / SAMPLING semantics: the
      source thread's Out field writes the buffer after its `compute`, the
      destination thread's In field reads the latest buffered value before its
      `compute`. This is sampling (last-writer-wins), NOT AADL immediate (same-frame,
      src-before-dst ordered) nor delayed (previous-frame latch) connection timing —
      immediate-vs-delayed timing is explicitly OUT OF SCOPE.
      Oracle extends the wasmtime exec harness on ONE live instance: (a) a stateful
      accumulator called twice (feed 5 then 7, assert out == 12 — fresh-construct or
      a call-local buffer yields 7, so the number discriminates persistence); (b) a
      producer->consumer inter-thread value delivered across two SEPARATE dispatches
      and observed at the consumer's boundary out port. Both sabotaged (revert the
      thread_local to per-call Default / drop the buffer write) to prove non-vacuity.
      STATED LIMITATION (skeleton authoring): user state lives in the generated
      `{thread}.rs` skeleton, which carries `DO NOT EDIT — regenerate`; adding real
      state means editing a file regen overwrites. The mechanism (instance reuse) is
      delivered here; a regen-safe user-authoring split is a separate successor.
    status: verified
    tags: [codegen, wit, rust, wit-bindgen, data-plane, state]
    release: v0.26.0
    links:
      - type: traces-to
        target: REQ-CODEGEN-WIT-DATAPLANE-001

  - id: REQ-CODEGEN-WIT-DATAPLANE-KILN-001
    type: requirement
    title: "kiln integration oracle: generated component runs on kiln via meld"
    description: >
      Integration (dogfood) successor to REQ-CODEGEN-WIT-DATAPLANE-001 /
      REQ-CODEGEN-WIT-STATE-001. wasmtime proves CORRECTNESS (an INDEPENDENT typed
      canonical-ABI impl via `component::bindgen!`); this proves INTEGRATION on a
      SECOND runtime — the same generated component executes on kiln, the
      PulseEngine safety-critical wasm interpreter — closing the "spar generates ->
      kiln fires" loop on the target substrate.

      ARCHITECTURE FINDING (spike, 2026-07-11): kiln runs CORE wasm modules, NOT
      Component Model components. Direct component instantiation via
      `from_parsed_*` is a won't-fix path (kiln#269) that still panics on HEAD
      (`.expect()` in resolve_exports; filed kiln#427). The blessed path (RFC #46)
      is `component -> meld fuse -> core module -> kiln`. meld flattens the
      `state-pkg:p/p-ports` interface into flat core (module, field) imports, which
      kiln drives via a host import handler with TYPED `Value` args (no manual
      linear-memory decoding needed for scalars — better than the raw-ABI decode the
      original scope assumed).

      ORACLE (executed, gate — `codegen-kiln-oracle/`, out-of-workspace so the kiln
      + meld dependency trees never poison the main build; git-pinned kiln + meld):
      the full chain runs mechanically every CI build —
      (1) spar codegen of state.aadl -> multi-crate wasip2 workspace;
      (2) `cargo build --target wasm32-wasip2` -> component;
      (3) `meld fuse` IN-PROCESS (meld-core `Fuser`) -> CORE module;
      (4) kiln `CapabilityAwareEngine` (QM) loads + instantiates the core module,
      `enable_wasi` + a chained `HostImportHandler` routing `wasi:*` -> WasiDispatcher
      and the custom AADL ports -> host state;
      (5) TWO proofs on ONE live kiln instance (same discriminators as the wasmtime
      state-oracle): PERSISTENCE — feed acc-in 5 then 7 across two `a-compute`
      dispatches, assert set-acc-out == 12 (a fresh instance / call-local yields 7);
      INTER-THREAD — feed src-in=42, dispatch `pr-compute` then `cn-compute`
      separately, assert set-sink-out == 42 (the thread_local buffer surviving
      between dispatches inside the one kiln instance is under test).
      SABOTAGE (non-vacuity): reverting the accumulator to overwrite drops
      persistence to 7; the spike sweep (acc-in {5,9,123456} -> same) proves the
      guest computes the value, not the harness.

      Deliberately NOT a v0.25/v0.26 gate: a cross-repo dependency on kiln + meld
      must not stall the spar release cadence; it follows once the substrate is
      proven, which it now is.
    status: verified
    tags: [codegen, wit, wit-bindgen, data-plane, kiln, meld, integration, dogfood]
    release: v0.27.0
    links:
      - type: traces-to
        target: REQ-CODEGEN-WIT-DATAPLANE-001
      - type: traces-to
        target: REQ-CODEGEN-WIT-STATE-001

  - id: REQ-CODEGEN-VERIFY-WORKSPACE-001
    type: requirement
    title: "spar codegen --verify test/build emits inert artifacts"
    description: >
      Bug / honesty gap surfaced during REQ-CODEGEN-WIT-RECORDS-002: the
      `--verify test` and `--verify build` (hence `--verify all`) outputs are
      structurally inert in the generated multi-crate workspace and therefore
      self-certify nothing. (1) test_gen emits `tests/<proc>/<thread>_test.rs`
      with `use super::<thread>::*;` at the WORKSPACE ROOT — outside every crate
      member, and `super::` is meaningless for a top-level file — so the harnesses
      are never compiled or run. (2) build_gen emits `build.rs` + `aadl-contract.toml`
      at the workspace ROOT, but workspace_gen makes a VIRTUAL workspace (a
      `[workspace]`-only root with no `[package]`), and cargo never runs a build
      script for a virtual manifest — so the timing-contract verifier never fires.
      Both predate REQ-002 (they assume a flat single-crate layout that
      workspace_gen does not produce). Fix: relocate the test harnesses under each
      process crate (`crates/<proc>/tests/` or inline `#[cfg(test)]` modules using
      the real crate paths, not `super::`), and move the contract build.rs +
      manifest into each process crate so the build script actually runs. Until
      then, `spar codegen --verify test/build/all` must not be read as producing a
      runnable test/verification harness. Related to #319.
    status: proposed
    tags: [codegen, verify, workspace, bug]
    fields:
      release: v0.24.0
    links:
      - type: traces-to
        target: REQ-CODEGEN-WIT-RECORDS-002

