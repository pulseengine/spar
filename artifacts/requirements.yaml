  # ── TSN-competitor roadmap (DEC-TSN-OSS-001) ──────────────────────────
  # Three tiers, captured 2026-06-13 after maintainer sign-off. Tier 1 +
  # Tier 3 are the already-demanded OSS substrate (WCET, kiln async
  # scheduler, drone multi-fabric in relay/jess); Tier 2 is the
  # TSN-config product bet, kill-gated per release. All status: proposed
  # (unstarted). See docs/strategy/tsn-competitor-roadmap.md.

  # --- Tier 1: committed spine (ingest + network-calculus upgrade) ---

  - id: REQ-INGEST-DBC-001
    type: requirement
    title: "DBC (CAN) model ingest"
    description: >
      spar shall ingest CAN bus descriptions from DBC files via the
      can-dbc crate (MIT/Apache), mapping nodes/messages onto the spar
      instance model so existing analysis passes run on real CAN models
      rather than hand-written .aadl. Implemented in the spar-dbc crate
      by emitting AADL v2.3 source text (CAN bus -> `bus`, each node ->
      `device` with `requires bus access`, each message -> `data` with
      `Data_Size`) and round-tripping it through spar's own parser +
      instantiation pipeline (the parser is the test oracle). Exposed as
      `spar dbc <file.dbc>`. The cheap CAN-only wedge, secondary to
      ARXML ingest; license-clean, no XSD to bundle.
    status: implemented
    tags: [ingest, dbc, can, tier1]
    fields:
      release: v0.17.0

  - id: REQ-INGEST-DBC-FLOWS-001
    type: requirement
    title: "DBC message flows as AADL ports + bus connections"
    description: >
      Extend DBC ingest (REQ-INGEST-DBC-001) to model message
      transmit/receive as AADL features and connections: each frame
      becomes a data port on its transmitting device (out) and on each
      receiver (in), connected across the CAN bus. This is the
      broadcast-bus analogue of the port-connection modelling the
      network-calculus track consumes, and is deliberately deferred from
      the v0.17.0 first cut (which ships bus + devices + frame data
      types only). KILL-GATE: drop if the flat instance model already
      carries enough for the target CAN analysis without per-flow ports.
    status: proposed
    tags: [ingest, dbc, can, flows, tier1]
    fields:
      release: v0.18.0

  - id: REQ-INGEST-ARXML-001
    type: requirement
    title: "ARXML (AUTOSAR) model ingest"
    description: >
      spar shall ingest AUTOSAR ARXML via autosar-data +
      autosar-data-specification (dual MIT/Apache, schema derived from
      official XSDs — no AUTOSAR XSD bundled). ARXML uniquely carries
      multi-bus topology AND TIMEX timing constraints, carrying spar's
      analysis engine to where TSN-config demand actually lives. Role:
      load-bearing enabler, not a standalone wedge (RTaW already does
      ARXML→TSN). KILL-GATE: kill ARXML-beyond-DBC if the AADL↔ARXML
      mapping needs full SWC/TIMEX fidelity we can't justify and DBC
      carries enough for the target analysis.
    status: proposed
    tags: [ingest, arxml, autosar, tier1]
    fields:
      release: v0.18.0

  - id: REQ-NC-TFA-001
    type: requirement
    title: "FP-TFA / TFA++ network-calculus bounds"
    description: >
      spar-network shall provide Total Flow Analysis (FP-TFA/TFA++) NC
      bounds: cheap, valid bounds under cyclic dependencies, and the
      initialization phase for PLP (REQ-NC-PLP-001). Part of the
      fabric-agnostic timing substrate also consumed by WCET analysis
      and the kiln async-scheduler math. [SOLID — Bouillard 2021]
    status: implemented
    tags: [network-calculus, tfa, substrate, tier1]
    fields:
      release: v0.17.0

  - id: REQ-NC-PLP-001
    type: requirement
    title: "PLP (polynomial-LP) network-calculus bounds — feed-forward"
    description: >
      spar-network shall provide Polynomial-LP (PLP) network-calculus
      bounds for FEED-FORWARD FIFO networks projected onto SINGLE-SUCCESSOR
      sink-trees (per-flow sub-networks) on the existing HiGHS/good_lp
      backend. Multi-successor forks — still feed-forward, but not
      single-successor — are rejected (PlpError::NotFeedForward) and
      deferred with the cyclic case to REQ-NC-PLP-002. A valid sink-tree
      whose server indices are NOT a topological order (some edge points to
      a lower-numbered server, so the sink is not the highest-numbered
      server — e.g. a converging tree handed in first-appearance order) is
      likewise rejected (PlpError::NonTopologicalSinkTree) rather than
      panicking inside the sink-tree projection; reordering such trees so
      PLP can fire is REQ-NC-PLP-002. This ports
      panco's PURE polynomial PLP LP (no TFA/SFA strengthening):
      bounds are always ≤ TFA and strictly inside the soundness sandwich
      EXACT ≤ plp ≤ TFA, matching panco's polynomial-PLP reference to
      solver precision — exact on 2 of 3 validation fixtures, within
      5.6% of EXACT on the 3-hop line (72.22 vs 68.4 µs, still ≪ the
      134.7 µs TFA). PLP works beyond the tandem-only LUDB/PMOO: 72.22
      ≪ 134.7 on a 3-server LINE is the dominance the existing tools
      cannot show. NOTE: this is PORT-FIDELITY against panco, not
      independent method-soundness (the LP is transcribed from panco and
      the floor is also panco's) — independent soundness is the deferred
      simulation floor (REQ-NC-SIM-FLOOR-001). Driving PLP all the way
      to the exact worst case via panco's TFA-strengthened LP (tfa=True)
      is the orthogonal tightening REQ-NC-PLP-003. The GENERIC/CYCLIC case
      and the "converges where TFA diverges at high utilization" claim
      (a cyclic-dependency phenomenon — TFA terminates on feed-forward)
      are split to REQ-NC-PLP-002. Highest value-to-risk analyzer item;
      pure analyzer win, zero dependency on synthesis.
      [SOLID — Bouillard arXiv:2010.09263]
    status: implemented
    tags: [network-calculus, plp, substrate, tier1]
    fields:
      release: v0.18.0

  - id: REQ-NC-PLP-002
    type: requirement
    title: "PLP network-calculus bounds — generic / cyclic topology"
    description: >
      spar-network shall extend PLP (REQ-NC-PLP-001) from feed-forward
      sink-trees to GENERIC topology — including CYCLIC service
      dependencies — via panco's forest decomposition (edges_forest) and
      the LP fixpoint over the decomposed trees. Includes the smaller
      precursor of topologically REORDERING a single-successor converging
      sink-tree whose indices arrive non-topological (today rejected by
      REQ-NC-PLP-001 as PlpError::NonTopologicalSinkTree) so PLP fires on
      the common many-talkers→one-listener TSN shape — a relabelling, sound
      because TFA/PLP are invariant under server renumbering, but gated on
      the same converging-tree panco fixtures below before emitting numbers.
      This carries the
      headline claim REQ-NC-PLP-001 cannot test: PLP CONVERGES where TFA
      diverges at high utilization. That divergence is a cyclic-
      dependency phenomenon (TFA's fixpoint terminates on any feed-
      forward net), so it lives entirely here and CANNOT be exercised by
      the current feed-forward-only oracle fixtures. GATE: this
      requirement is blocked on new cyclic / high-utilization reference
      fixtures from panco (extend REQ-NC-VALIDATION-001's pinned table)
      — building generic+cyclic PLP before those fixtures exist would be
      untested LP code with no soundness floor. [SOLID — Bouillard
      arXiv:2010.09263; Tabatabaee/Bouillard/Le Boudec arXiv:2208.11400]
    status: proposed
    tags: [network-calculus, plp, cyclic, substrate, tier1]
    fields:
      release: v0.19.0

  - id: REQ-NC-PLP-003
    type: requirement
    title: "PLP tightening to exact worst case (TFA-strengthened LP)"
    description: >
      spar-network shall tighten its PLP bound (REQ-NC-PLP-001) toward the
      exact worst-case FIFO delay by adding panco's TFA-strengthening
      constraints to the polynomial LP (panco's FifoLP tfa=True path). On
      the validation fixtures this drives PLP from pure-LP slack to EXACT:
      three_server_line tagged 72.22 → 68.4 µs (= the Bouillard-Stea exact
      ELP). This is ORTHOGONAL to the feed-forward → cyclic topology split
      (REQ-NC-PLP-002): it strengthens the per-tree LP, it does not change
      which topologies are handled. RISK: the strengthening embeds panco's
      OWN per-server TFA delays inside the LP, so a faithful port can no
      longer build a byte-identical LP from spar's INDEPENDENT TFA engine —
      the oracle for this item is the pinned panco tfa=True PLP column under
      the sandwich EXACT ≤ plp ≤ TFA, NOT solver-precision LP identity.
      [SOLID — Bouillard arXiv:2010.09263]
    status: proposed
    tags: [network-calculus, plp, substrate, tier1]
    fields:
      release: v0.19.0

  - id: REQ-NC-BRIDGE-001
    type: requirement
    title: "AADL instance -> network-wide NC solver inputs (TfaFlow/PlpFlow)"
    description: >
      spar shall feed an instantiated AADL TSN model to the NETWORK-WIDE
      network-calculus solvers (tfa_bound REQ-NC-TFA-001, plp_bound
      REQ-NC-PLP-001) so the stack runs end-to-end: model -> bound ->
      result. This closes the disconnected-pipeline gap: tfa_bound /
      plp_bound currently have ZERO production callers; nothing constructs
      TfaFlow / PlpFlow outside unit tests. The inputs they need ALREADY
      exist assembled inside the wctt analysis — the bridge reuses them
      rather than re-deriving: (a) collect_streams(instance, graph) yields
      Stream { alpha: ArrivalCurve, hops: Vec<ComponentInstanceIdx> } per
      stream, routed by Deployment_Properties::Actual_Connection_Binding =>
      reference(sw) (NOT end-to-end flows — the binding is the real routing
      mechanism), resolved PER CONNECTION: a connection-level binding
      (declared `applies to <connection>`, lowered onto the connection's
      property map) takes precedence over the system-level binding, with
      owner fallback, so different streams route over different switch
      subsets — the multi-route TSN topology that makes the GLOBAL dense
      switch index (not per-tandem positions) the bridge's job; (b)
      service_for_bus maps each switch to a rate-latency
      ServiceCurve from read_output_rate_bps + read_forwarding_latency_ps.
      The bridge step that does NOT yet exist: a GLOBAL dense index over all
      switches, every Stream's hops mapped into that global index to build
      one TfaFlow/PlpFlow per stream, fed in a SINGLE network-wide
      tfa_bound/plp_bound call -> per-flow + per-server delays. This is
      distinct from the EXISTING per-tandem bridge (wctt::pmoo_or_sfa, which
      builds PmooTaggedFlow + local positions and calls ludb_bound for ONE
      tagged tandem): TFA/PLP take ALL flows + ALL services at once. Use
      pmoo_or_sfa as the pattern for HOW to bridge (Stream -> solver input,
      fall back on failure), not WHAT to compute. Output: the network-wide
      TFA and PLP end-to-end delay bound, where PLP <= TFA is the
      demonstrable competitor wedge on a real model.

      FABRIC: TSN-first and TSN-only. NC (FIFO/CBS) is the CORRECT model
      for TSN/AVB and extract_network_graph already yields the NetworkGraph.
      CAN is explicitly OUT of scope here: a broadcast CAN bus is not a
      switch, DBC emits no rate/period, and CAN's correct analysis is
      Tindell WCRT, NOT NC-FIFO (an NC bound on CAN would be sound but
      misleadingly loose). CAN timing is a SEPARATE track (its own future
      REQ-CAN-WCRT requirement consuming REQ-INGEST-DBC-FLOWS-001); this
      bridge does NOT serve CAN and REQ-INGEST-DBC-FLOWS-001 is NOT a
      dependency of it.

      DONE-DEFINITION (a capability with no caller is worthless — the same
      orphan finding this requirement closes): not satisfied by unit tests
      alone. Must ship a PRODUCTION caller — a new wctt arm emitting a
      network-wide WcttTfaBound / WcttPlpBound diagnostic alongside the
      existing per-hop SFA / PMOO diagnostics — that runs on a real .aadl
      TSN model file. That caller is also the demonstrable artifact: AADL
      TSN config in -> PLP bound out, tighter than TFA. SCOPE: feed-forward
      TSN models (matches REQ-NC-PLP-001's feed-forward limit); a flow whose
      route does not map onto a switch path, or a non-FIFO (TAS/CBS) hop the
      network-wide FIFO solver cannot model, is diagnosed and the network-
      wide arm skipped — never silently dropped, and the per-hop SFA bound
      is preserved (the pmoo_or_sfa fallback contract). Gated on the
      milp-solver feature for the PLP half (the wasm build omits it).
      [SOLID — Bouillard arXiv:2010.09263; builds on REQ-NC-TFA-001,
      REQ-NC-PLP-001, extract_network_graph, wctt::collect_streams]
    status: implemented
    tags: [network-calculus, bridge, tsn, substrate, tier1]
    fields:
      release: v0.18.0

  - id: REQ-NC-VALIDATION-001
    type: requirement
    title: "NC-bound cross-validation against panco reference"
    description: >
      spar-network's NC bounds shall be cross-validated against an
      INDEPENDENT reference implementation (panco — Bouillard's own
      LP-based DNC tool) on a shared FIFO benchmark set. Two checks per
      fixture: (1) SOUNDNESS — spar's bound >= panco's EXACT ELP bound
      (Bouillard-Stea ValueTools 2012), the true worst-case no sound
      method may undercut; an unsound (optimistic) bound is also <= TFA,
      so this floor is the only check that catches it; (2) AGREEMENT —
      spar's TFA tracks panco's TFA within rounding, confirming the
      METHOD is implemented (not merely some sound bound). This is the
      oracle-kind-(b) NC-tool-agreement validator; the stronger
      OMNeT++/INET simulation floor is REQ-NC-SIM-FLOOR-001. SERVICE-
      MODEL-MATCH constraint: panco/xTFA/DNC validate FIFO/CBS/ATS
      bounds, NOT 802.1Qbv TAS gates — a TAS schedule must be validated
      against a TAS-matched simulator. Reference numbers are pinned
      offline (panco not vendored, Python not in CI); provenance and
      regen recipe in crates/spar-network/tests/oracles/panco/.
      [SOLID — Bouillard arXiv:2010.09263; Bouillard-Stea ValueTools 2012]
    status: implemented
    tags: [network-calculus, validation, oracle, substrate, tier1]
    fields:
      release: v0.18.0

  - id: REQ-NC-CBS-AUDIT-001
    type: requirement
    title: "CBS/SP service-curve packetization audit"
    description: >
      spar-network shall audit its CBS/SP (802.1Qav) service curves
      against Jiang (arXiv:2403.13656, 2024), which shows packetization
      was overlooked in standard CBS/SP service curves, INVALIDATING
      some bounds. Audit-before-trust gate before any synthesis or
      export leans on CBS curves (REQ-TSN-003). [SOLID]
    status: proposed
    tags: [network-calculus, cbs, qav, audit, tier1]
    fields:
      release: v0.19.0

  # --- Tier 2: the product bet (synthesis → export), kill-gated ---

  - id: REQ-TSN-SYNTH-QBV-001
    type: requirement
    title: "802.1Qbv GCL synthesis — dependency-aware, mixed-criticality"
    description: >
      spar shall synthesize 802.1Qbv gate-control lists directly
      (inverse of the existing TAS checking, REQ-TSN-002) via
      dependency-aware priority adjustment (arXiv:2407.00987, 2024):
      ~300 flows, mixed-criticality, +20.6% success over SOTA. The
      first, smaller-scale, directly-Qbv synthesis step. KILL-GATE: kill
      the AADL→TSN bridge if we cannot articulate why our integrated
      architecture-to-timing story beats RTaW's already-cert-accepted
      ARXML→TSN+NC. [SOLID]
    status: proposed
    tags: [tsn, synthesis, qbv, tier2]
    fields:
      release: v0.19.0

  - id: REQ-TSN-SYNTH-MILP-001
    type: requirement
    title: "TSN schedule synthesis — MIP→VNS-GA scale handoff"
    description: >
      spar shall synthesize TSN schedules on the existing HiGHS/good_lp
      MILP backend via the MIP→VNS-GA handoff (Wang et al., Sensors
      2025): exact MIP ≤ ~1,000 flows, then VNS-GA (genetic +
      2-opt/or-opt/exchange) up to ~3,000 flows. The cleanest concrete
