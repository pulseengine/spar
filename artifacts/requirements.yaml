  # ── Track E: hypothetical-rebinding oracle (v0.8.0) ────────────────

  - id: REQ-MIGRATION-001
    type: requirement
    title: Frozen-platform component annotation
    description: >
      System shall support marking components as frozen (platform) via
      Spar_Migration::Frozen (aadlboolean). Frozen items are platform —
      their binding/properties cannot be altered by hypothetical-rebinding
      queries. Default false (unannotated components are eligible for
      rebinding). Per Track E commit 1/8 of the v0.8.0 migration design
      research (docs/designs/track-e-migration-research.md §6.1).
    status: implemented
    tags: [migration, track-e, v080]

  - id: REQ-MIGRATION-002
    type: requirement
    title: Mobile-application component annotation with allowed targets
    description: >
      System shall support marking components as mobile (application) via
      Spar_Migration::Mobile (aadlboolean), with optional Allowed_Targets
      (list of reference) enumeration restricting valid hypothetical
      rebinding destinations. Empty Allowed_Targets means "no restriction
      beyond the platform's frozen set". When both Frozen=true and
      Mobile=true are declared on the same item, Frozen wins (defensive
      — refuse to rebind). Per §6.1 of the v0.8.0 migration design.
    status: implemented
    tags: [migration, track-e, v080]

  - id: REQ-MIGRATION-003
    type: requirement
    title: Pinned-reason audit metadata
    description: >
      System shall record human-readable Pinned_Reason for frozen items
      as audit metadata. Exposed via Spar_Migration::Pinned_Reason
      (aadlstring). Captures the rationale a reviewer would need to
      certify why an item is platform (e.g., "ASIL-D platform partition",
      "RTOS kernel image"). Per §6.1 of the v0.8.0 migration design.
    status: implemented
    tags: [migration, track-e, v080, audit]

  - id: REQ-MIGRATION-004
    type: requirement
    title: Hypothetical-binding overlay over a SystemInstance
    description: >
      System shall support hypothetical-binding overlays that allow any
      analysis to run on a tentative rebinding without mutating the
      SystemInstance. The overlay maps component instance indices to
      hypothetical target processor indices and is consulted in place
      of the declared Actual_Processor_Binding when present; absent
      entries fall through to the declared binding. The overlay
      validates against Spar_Migration::Frozen (refuses to move
      platform components) and Spar_Migration::Allowed_Targets
      (refuses targets outside the declared set when the list is
      non-empty), returning structured FrozenViolation /
      AllowedTargetsViolation diagnostics. An empty overlay is the
      identity (non-regression baseline). Load-bearing infrastructure
      for spar moves verify (Track E commit 3) and spar moves
      enumerate (Track E commits 4-5). Per Track E commit 2/8 of the
      v0.8.0 migration design research (§6.4).
    status: implemented
    tags: [migration, track-e, v080]

  - id: REQ-MIGRATION-005
    type: requirement
    title: spar moves verify CLI — hypothetical-rebinding oracle
    description: >
      System shall expose a `spar moves verify --component X --to Y`
      CLI subcommand that returns a structured pass/fail report with
      violations, using the BindingOverlay from REQ-MIGRATION-004.
      The pipeline parses the AADL model, instantiates the requested
      root, resolves --component and --to to ComponentInstanceIdx
      values via FQN matching against the instance hierarchy, builds a
      single-move overlay, runs overlay validation (frozen /
      allowed-targets), and runs the standard analysis-pass suite
      (RTA, latency, bandwidth, EMV2, ARINC653, …) against the
      un-overlayed instance for commit 3. The report carries `ok`,
      component / target FQNs, a Violation list (Frozen /
      AllowedTargets / AnalysisError variants), and a per-pass
      diagnostic stream keyed by analysis name. Output is rendered as
      either text (developer-friendly) or JSON (canonical
      machine-readable contract for the v0.9.0 MCP `spar.verify_move`
      tool surface). Exit codes: 0 = ok, 1 = analysis errors, 2 =
      overlay violations. For commit 3 only the HIR-level
      property-lookup helper (`actual_processor_binding_with_overlay`)
      is overlay-aware; widening the analysis suite itself to consume
      the overlay is commit 4. Per Track E commit 3/8 of the v0.8.0
      migration design research (§6.3).
    status: implemented
    tags: [migration, track-e, v080, cli]

  - id: REQ-MIGRATION-006
    type: requirement
    title: spar moves enumerate CLI — design-space exploration
    description: >
      System shall expose a `spar moves enumerate --component X
      [--target-filter <substring>] [--format text|json]` CLI
      subcommand that returns all valid hypothetical rebinding targets
      for a component. The candidate-target set is derived from
      `Spar_Migration::Allowed_Targets` (when set on the component) or
      from every Processor / VirtualProcessor in the instance
      otherwise. An optional `--target-filter` substring narrows the
      candidate set when Allowed_Targets is absent and the model has
      many processors. For each candidate the same overlay-validation
      and analysis-pass pipeline as `spar moves verify`
      (REQ-MIGRATION-005) is run, producing a per-candidate
      `MoveCandidate` record with `ok` / `violations` /
      `diagnostics_count` / `slack_ns`. The slack metric is the
      simplest defensible v0.8.0 ranking: minimum (deadline −
      response_time) across threads on the candidate target, parsed
      from RTA's info-level diagnostics; `None` when RTA produced no
      usable info diagnostics; negative-sentinel when RTA reports a
      deadline miss. The full multi-objective ranking (weight, power,
      EMV2 cost) lands in commits 5-6 with the solver-driven enumerator.
      JSON output is the canonical machine-readable shape consumed by
      the v0.9.0 MCP `spar.enumerate_moves` tool surface; text output
      is a sortable table with a `total=N valid=K` summary footer.
      Exit codes: 0 = at least one admissible candidate, 1 = no
      admissible candidate (or input-resolution error). Per Track E
      commit 4/8 of the v0.8.0 migration design research (§6.3).
    status: implemented
    tags: [migration, track-e, v080, cli]

  - id: REQ-MIGRATION-007
    type: requirement
    title: Multi-objective candidate ranking for `spar moves enumerate`
    description: >
      System shall rank hypothetical-binding candidates via a configurable
      multi-objective score (max-response | total-load | total-power |
      total-weight | balanced) using the same RTA / property-accessor
      machinery as direct verification. The score (lower = better)
      aggregates per-axis values: max response time across overlay-bound
      threads parsed from RTA Info-level diagnostics; total CPU load
      summed from `Compute_Execution_Time / Period` over overlay-bound
      threads; total power from `Spar_Power::Power_Budget` (with
      compatible upstream fallbacks via SEI / Physical_Properties); total
      weight from `Weight_Properties::Weight` (with upstream fallbacks).
      Each enabled axis contributes 1/k of the total score where k is
      the count of enabled axes; `balanced` enables all four equally.
      Exposed via the new `spar moves enumerate --objective <mode>` CLI
      option; default mode is `max-response` so commit-4 single-CPU
      slack semantics are preserved. The ranker lives in
      `spar-solver::enumerate` so verify/enumerate output stays in
      lock-step. Adds the `Spar_Power::Power_Budget` standard property
      (numeric milliwatts) so models without SEI in scope can still
      participate. Does NOT alter the validity (`ok`) judgement —
      objective changes only re-order the candidate list. Per Track E
      commit 5/8 of the v0.8.0 migration design research (§6.4).
    status: implemented
    tags: [migration, track-e, v080, cli, solver]

  - id: REQ-MIGRATION-008
    type: requirement
    title: spar moves verify/enumerate variant scoping (rivet v1 contract)
    description: >
      System shall accept `--variant NAME` (implicit form; spar shells
      out to `rivet resolve --variant <name> --format spar-context-json`
      per docs/contracts/rivet-spar-variant-v1.md) and
      `--variant-context PATH` (explicit form; PATH is `-` for stdin or
      a filesystem path) on both `spar moves verify` and
      `spar moves enumerate`. The two flags are mutually exclusive. When
      a variant is in play the move-oracle scopes its analysis to the
      resolved-variant subset of HIR: components dropped by
      keep_in_variant are unreachable as `--component` / `--to` targets
      and are excluded from the candidate-target set in enumerate.
      Resolution failures map to typed CLI errors — RivetNotFound
      points at the explicit form, ComponentNotInVariant /
      TargetNotInVariant identify dropped-by-variant inputs, and
      VariantContextSchema surfaces the v1 reader's strict-version
      refusal of v2+ blobs. The variant scope is non-mutating:
      [`crate::variants_bridge::VariantScope`] wraps the SystemInstance
      and exposes lookup-time accessors that hide dropped components
      without touching the parsed model. JSON output adds top-level
      `variant` and `feature_model_hash` fields; text output prefixes
      the summary line with `(variant=<name>)`. Track E commit 6/8 of
      the v0.8.0 migration design research, wiring the spar-variants
      consumer crate (REQ-VARIANT-001) into the verify/enumerate
      pipelines (REQ-MIGRATION-005, REQ-MIGRATION-006).
    status: implemented
    tags: [migration, variants, track-e, track-b, v080, cli]

  - id: REQ-NETWORK-004
    type: requirement
    title: Typed network graph extraction from a SystemInstance
    description: >
      System shall extract a typed network graph (nodes + links) from
      a SystemInstance for downstream WCTT analysis. Nodes classify as
      switches (bus components carrying Spar_Network::Switch_Type) or
      end stations (devices/processors connected to a switched bus);
      links carry the per-hop bandwidth, forwarding-latency range, and
      queue-depth annotations from Spar_Network::*. The graph is the
      bridge between the AADL ItemTree and the Network Calculus
      primitives that follow in subsequent Track D commits.
    status: implemented
    tags: [network, wctt, v080]

  - id: REQ-NETWORK-005
    type: requirement
    title: Network Calculus arrival/service curve primitives and operators
    description: >
      System shall provide Network Calculus arrival/service-curve
      primitives plus the closed-form min-plus operations (backlog
      bound, delay bound, residual service, output bound) needed by
      the WCTT analysis pass. Curves cover the affine "leaky bucket"
      arrival form (burst + sustained rate, optional peak) and the
      rate-latency service form, with all values represented as u64
      picoseconds / bytes / bits per second so the kernel is free of
      floating-point drift. The piecewise-affine extension and TSN-
      specific service curves are deferred to v0.8.x. Track D commit 3
      of the v0.8.0 design (docs/designs/track-d-tsn-wctt-research.md
      §4.3-4.4).
    status: implemented
    tags: [network, wctt, v080]

  - id: REQ-NETWORK-006
    type: requirement
    title: Per-stream end-to-end WCTT analysis pass
    description: >
      System shall compute per-stream end-to-end WCTT bounds across
      switched-bus topologies via the NC primitives. The wctt analysis
      pass extracts the network graph (REQ-NETWORK-004), discovers
      AADL data-port streams whose Actual_Connection_Binding traverses
      one or more switched buses, and composes per-hop residual
      service / delay / output bounds (REQ-NETWORK-005) into an
      end-to-end traversal-time bound for each stream. Phase 1 covers
      FIFO + Priority switches with classical residual-service splits;
      TSN-shaped service curves (TAS / CBS / preemption) are deferred
      to Phase 2. New diagnostic kinds: WcttBound (Info per stream),
      WcttExceedsBudget (Error when Spar_Network::WCTT_Budget is set
      and exceeded), WcttUnservable (Error when competing flows
      exhaust server rate), WcttSwitchOverloaded (Error when port
      utilisation > 100%), WcttDeferred (Info note for TSN switches).
      Track D commit 4 of the v0.8.0 design
      (docs/designs/track-d-tsn-wctt-research.md §5.4).
    status: implemented
    tags: [network, wctt, v080]

  - id: REQ-NETWORK-008
    type: requirement
    title: Unified WCET+WCTT end-to-end latency analysis
    description: >
      System orchestrates RTA-derived WCET on compute hops and
      WCTT-derived bounds on network hops in a unified end-to-end
      latency analysis, replacing the placeholder Bus_Properties::Latency
      scalar when Spar_Network::* annotations are present. The
      latency.rs analysis pass walks each end-to-end flow's segments
      and, for every connection segment, invokes the
      wctt::compute_network_hop_latency helper. When the connection
      binds to a bus carrying Spar_Network::Switch_Type, the per-hop
      contribution comes from the NC-derived bound (forwarding latency
      + queuing) rather than from the legacy sampling-delay /
      Inter_Processor_Overhead heuristic, and the chain emits the new
      LatencyHopMixed Info diagnostic to confirm WCET+WCTT alternation
      is live. Models without Spar_Network::* annotations fall back to
      the v0.7.0 scalar overhead path and produce byte-identical
      output, satisfying the non-regression contract that gates Phase
      1 close-out. WcttUnservable in any hop propagates to the chain
      as an Error and aborts aggregation. Track D commit 6 of the
      v0.8.0 design (docs/designs/track-d-tsn-wctt-research.md §6.1).
    status: implemented
    tags: [network, wctt, latency, v080]

  # ── Track B: rivet ↔ spar variant binding (v0.7.x) ─────────────────

  - id: REQ-VARIANT-001
    type: requirement
    title: Consume rivet's variant context blob (v1) and filter HIR
    description: >
      System shall consume rivet's variant context blob (v1 contract per
      docs/contracts/rivet-spar-variant-v1.md) and filter HIR items by
      intersection-semantics binding rules. The reader strictly accepts
      rivet_spar_context_version "1" only — v2+ blobs are refused per
      the contract's compatibility section. File-scoped (artifact) and
      symbol-scoped bindings are honoured; an item is kept iff every
      matching binding has its requires-set satisfied by the variant's
      active features. Items with no matching binding are kept
      unconditionally as variant-independent infrastructure.
    status: implemented
    tags: [variants, track-b, v07x]

  # ── PIP/PCP blocking term in hierarchical RTA (v0.7.1) ─────────────

  - id: REQ-TIMING-PIP-001
    type: requirement
    title: PCP/PIP blocking analysis in hierarchical RTA
    description: >
      System shall support PCP/PIP blocking analysis. Threads declaring
      Thread_Properties::Locking_Protocol => Priority_Inheritance_Protocol
      or Priority_Ceiling_Protocol contribute a blocking term B_i to the
      v0.7.0 hierarchical IRQ-aware RTA recurrence (Joseph & Pandya 1986;
      Buttazzo, *Hard Real-Time Computing Systems*). The blocking-term
      magnitude is read from the new Spar_Timing::Critical_Section_Blocking
      property (Time, picoseconds) and represents the user's bound on how
      long a higher-priority task can be blocked by lower-priority tasks
      holding shared resources. Stop_For_Lock and None values opt out of
      blocking analysis (B_i = 0). Scope is the simple-ceiling case;
      per-resource blocking analysis with shared-resource declarations is
      deferred to v0.8.0+. Discharges the v0.7.1 follow-up explicitly
      carved out of #147 / #149.
    status: implemented
    tags: [timing, rta, pip, pcp, blocking, v071]

  - id: REQ-NETWORK-007
    type: requirement
    title: Lean-formalized Network Calculus closed-form statements
    description: >
      System provides Lean-formalized statements of classical Network
      Calculus closed-forms anchoring the spar-network/curves.rs
      implementation. Statements cover monotonicity of the affine
      arrival curve α(t) and the rate-latency service curve β(t),
      the "β = 0 below latency" property, the closed-form backlog
      bound (σ + ρ·T) and delay bound (T + σ/R) for stable affine
      flow, the output-curve burst inflation theorem (rate preserved,
      burst grows by ρ·T), and the serial-chain naive composition
      sum. Discharges Le Boudec & Thiran "Network Calculus" (Springer
      2001) chapter 1 closed-forms 1.4.1–1.4.3 as machine-checked
      Lean specs, mirroring the Rust min-plus kernel in
      crates/spar-network/src/curves.rs. Some proofs use `sorry` with
      a TODO(v1.0.0) tag; statements are the load-bearing artifact.
      Track D commit 5 of the v0.8.0 design
      (docs/designs/track-d-tsn-wctt-research.md §4.3-4.4).
    status: implemented
    tags: [network, wctt, lean, proofs, v080]

  - id: REQ-TSN-001
    type: requirement
    title: Spar_TSN property surface for Time-Sensitive Networking
    description: >
      Spar_TSN property surface declares stream identification,
      class-of-service, gate-control-list (raw string in v0.8.1,
      structured in v0.9.x), max frame size, and frame preemption
      hooks. Properties are: Stream_ID (aadlinteger 0..2**32-1; port,
      connection), Class_of_Service (aadlinteger 0..7; port,
      connection), Gate_Control_List (aadlstring; bus —
      v0.8.1 raw blob, v0.9.x structured GateWindow record),
      Max_Frame_Size (aadlinteger units Size_Units; port, connection),
      and Frame_Preemption (aadlboolean; port, connection). Foundation
      for Track D Phase 2 TSN-shaped service curves: TAS gate-window
      (802.1Qbv), CBS credit-pool (802.1Qav), and frame preemption
      (802.1Qbu). v0.8.1 commit 1 ships the property surface and the
      spar-network::tsn module skeleton (GateWindow, ClassOfService,
      CreditPool types plus property accessors); subsequent commits
      add the analysis math. Per
      docs/designs/track-d-tsn-wctt-research.md §5.1.
    status: implemented
    tags: [network, tsn, wctt, v081]

  - id: REQ-TSN-002
    type: requirement
    title: TAS (802.1Qbv) gate-window service curve in WCTT analysis
    description: >
      System provides a Time-Aware Shaper (IEEE 802.1Qbv) gate-window
      service curve for TSN-typed switches and dispatches it from the
      WCTT analysis when both the bus carries a parsed
      Spar_TSN::Gate_Control_List and the stream carries a
      Spar_TSN::Class_of_Service. spar-network::tsn parses the
      gate-control list "offset_ns:duration_ns:cos_mask;..." blob into
      a GateSchedule, validates that windows tile the cycle period
      without gaps or overlaps, and exposes (a) the average open
      fraction ρ_K = open_time_K / cycle_period and (b) the
      worst-case gate latency T_K = longest contiguous closed run for
      class K (with wrap-around). tas_residual_service then derives
      β_K(t) = (R_link · ρ_K) · max(0, t − T_K) from those quantities.
      Hops dispatched through the TAS curve emit a new Info
      diagnostic, WcttTasGated, carrying stream id, class-of-service,
      open fraction (percent) and gate latency (ps); when either the
      Gate_Control_List or the Class_of_Service is missing the
      analysis falls back to the v0.8.0 WcttDeferred path. Discharges
      docs/designs/track-d-tsn-wctt-research.md §5.3 and the v0.8.1
      Track D Phase 2 commit 2 milestone.
    status: implemented
    tags: [network, tsn, wctt, v081]

  - id: REQ-TSN-SVC-MULTIWIN-001
    type: requirement
    title: "Sound TAS service-curve latency for multi-window gate schedules"
    description: >
      spar's TAS gate-window service curve (REQ-TSN-002) derives its
      latency T_K as the longest single contiguous closed run. That is
      OPTIMISTIC (unsound) for gate schedules where a class opens in
      MULTIPLE windows of unequal duration/spacing: past the single
      longest gap the rate-latency curve β_K(t)=R·ρ_K·(t−T_K)₊ assumes
      sustained service the gate does not deliver (a big-gap → sliver →
      big-gap timeline). spar shall instead compute the EXACT sound
      latency T_sound from the per-class minimum-service staircase
      S(t) = R · min over phases φ∈[0,cycle) of (open-time for K in
      [φ, φ+t]): T_sound = max over t of [t − S(t)/(R·ρ_K)], the maximum
      horizontal deviation of S below the long-term-rate line (the worst
      case lies within t∈[0,cycle] since S is periodic with per-cycle
      gain R·open). T_sound ≥ longest-gap always, with EQUALITY for a
      single window per class and for EVEN k-way splits ((cycle−open)/k)
      — so REQ-TSN-002's shipped single-window outputs are unchanged;
      only uneven multi-window schedules are corrected upward.
      tas_residual_service, tas_residual_service_with_sync_error, and the
      wctt.rs WcttTasGated diagnostic shall consume T_sound. REACHABILITY:
      the gap is reachable, not latent — wctt.rs runs the curve on the
      user's Spar_TSN::Gate_Control_List, which may be an arbitrary
      uneven multi-window GCL; no shipped synthesizer emits such schedules
      (synthesize_gcl is one window per class). Computed in EXACT
      picosecond integer arithmetic at window-boundary breakpoints (NOT a
      1ns-discretized scan). SELF-CERTIFYING ORACLE: an independent
      min-service staircase asserts β_sound(t) ≤ S(t) for all t across a
      battery of single/even/uneven/multi-class schedules, plus two
      pinned regression counterexamples where the OLD longest-gap β
      exceeded S: GCL `0:4000:0x00;4000:500:0x01;4500:4000:0x00;8500:1000:0x01`
      (cycle 9500ns, t=8500ns: old β=88B > S=62B) and
      `0:200:0x01;200:5000:0x00;5200:1800:0x01;7000:5000:0x00`
      (cycle 12000ns, t=10200ns: old β=108B > S=25B). SINGLE-GATE scope —
      distinct from the cross-hop TAS composition question (a separate
      panco-gated track); this is validated deterministically by the
      staircase, NOT panco (which models FIFO rate-latency, the wrong tool
      for TAS gate staircases). Prerequisite for window-splitting
      synthesis (REQ-TSN-SYNTH-QBV-001), which must self-certify against
      the sound (and correctly-RANKING) bound. [SOLID — Zhao/Network
      Calculus for TSN; verified 2026-06-16 by independent falsification.]
    status: implemented
    tags: [network, tsn, wctt, network-calculus, soundness, tier1]
    fields:
      release: v0.21.0

  - id: REQ-TSN-003
    type: requirement
    title: 802.1Qav CBS credit-pool service curve
    description: >
      Per-class CBS (Credit-Based Shaper, IEEE 802.1Qav) service curve
      for TSN-switched buses. Adds property
      Spar_TSN::Bandwidth_Reservation (aadlinteger units
      Data_Rate_Units; bus and port) declaring per-class idleSlope (the
      reserved bps for that class). The spar-network::tsn module exposes
      `CbsReservation` (idle_slope_bps, send_slope_bps, hi_credit_bytes,
      lo_credit_bytes) plus `cbs_residual_service`, the rate-latency
      closed-form β_class(t) = idleSlope · max(0, t − T) where the
      service latency T = max_competing_frame / link_rate
      + lo_credit / |sendSlope| (Le Boudec & Thiran §1.4.3 plus AVB/TSN
      AVB delay analysis literature, Lim et al. "Delay analysis in CBS
      for AVB"). The wctt analysis dispatches CBS service curves at
      hops where Switch_Type=>TSN and the stream's source declares
      Bandwidth_Reservation; on those hops the per-class service curve
      replaces the FIFO residual decomposition and emits a
      `WcttCbsShaped` Info diagnostic carrying the stream id, CoS,
      idle_slope, and service-latency. Per
      docs/designs/track-d-tsn-wctt-research.md §5.2-5.3 and Track D
      Phase 2 v0.8.1 commit 3.
    status: implemented
    tags: [network, tsn, cbs, qav, wctt, v081]

  - id: REQ-TSN-004
    type: requirement
    title: 802.1Qbu frame-preemption blocking term in WCTT analysis
    description: >
      System computes the IEEE 802.1Qbu frame-preemption blocking
      term `B_pmt = (MIN_FRAGMENT_BYTES + PREEMPTION_HEADER_BYTES) /
      link_rate` (with MIN_FRAGMENT_BYTES = 64 — IEEE 802.3 minimum
      Ethernet frame — and PREEMPTION_HEADER_BYTES = 4 — IEEE 802.3br
      §99.4.7 SMD-S/mCRC) and substitutes it for the legacy
      `B_no_pmt = max_preemptable_frame_bytes / link_rate` blocking
      term at TSN switches when both the bus and the source stream
      declare `Spar_TSN::Frame_Preemption => true`. Express-stream
      identification follows the explicit-then-default order:
      `Spar_TSN::Frame_Preemption` on the stream port wins; otherwise
      `Class_of_Service >= 6` defaults to express. The reduction in
      blocking is surfaced via the `WcttPreemptionApplied` Info
      diagnostic emitted per affected hop, carrying the legacy and
      preempted blocking figures (in nanoseconds) so users can audit
      the gain. Implemented as `preemption_blocking_term_ps` and
      `is_express_stream` in `spar-network::tsn`, hooked into
      `spar-analysis::wctt::WcttAnalysis` and
      `compute_network_hop_latency`. Track D Phase 2 v0.8.1 commit 4.
      Per docs/designs/track-d-tsn-wctt-research.md §5.2-5.3.
    status: implemented
    tags: [network, tsn, wctt, preemption, qbu, v081]

  # ── v0.9.1 NC soundness pass ──────────────────────────────────────

  - id: REQ-NETWORK-009
    type: requirement
    title: gPTP synchronization-error budget for TAS bounds
    description: >
      Spar_TSN::Sync_Error (Time, picoseconds; applies to bus,
      processor) carries the per-hop 802.1AS-2020 synchronization
      error ε. The TAS dispatch in wctt.rs subtracts ε from the
      effective open time and adds ε to the worst-case gate latency,
      restoring soundness — current TAS bounds are technically
      unsound without ε because a frame can miss its window by ε in
      silicon. ε = 0 (unset) reproduces v0.8.1 behaviour
      byte-identically. Per the post-v0.9.0 reviewer's Tier 2 #5.
    status: implemented
    tags: [network, tsn, wctt, soundness, gptp, v091]

  - id: REQ-NETWORK-010
    type: requirement
    title: Atomic-frame quantization in NC per-hop bound
    description: >
      Bytes-level NC undercounts each hop's bound by up to one MTU
      because frames are atomic but the kernel treats packets as
      continuous. wctt.rs adds `ceil(max_frame_bytes · 8e12 /
      link_rate_bps)` picoseconds per hop on the TAS and FIFO/Priority
      arms. The CBS arm's closed-form latency already absorbs the
      max-frame term; the preemption arm replaces it with the
      fragment-time. New `WcttFrameQuantization` Info diagnostic
      records the correction per hop. Per the post-v0.9.0 reviewer's
      Tier 2 #8.
    status: implemented
    tags: [network, wctt, soundness, v091]

  - id: REQ-RTA-008
    type: requirement
    title: Context_Switch_Time folded into RTA recurrence
    description: >
      v0.8.x emitted a STPA-REQ-022 advisory if `Context_Switch_Time`
      was unset, but never folded the value into the Tindell-Clark /
      Joseph-Pandya recurrence when it *was* set — silently optimistic.
      v0.9.2 inflates each thread's WCET by `2 × Context_Switch_Time`
      (one preemption-in + one preemption-out per Buttazzo §7). New
      `OverheadInflation` Info diagnostic per thread when CS > 0.
      Default unset = 0 (preserves v0.8.x byte-identical output).
      Per the post-v0.9.0 reviewer's Tier A #5 (partial —
      `Interrupt_Overhead` per ISR firing still deferred).
    status: implemented
    tags: [analysis, scheduling, rta, soundness, v092]

  - id: REQ-RTA-009
    type: requirement
    title: Stop_For_Lock without explicit blocking emits warning
    description: >
      v0.8.x silently used B=0 in the RTA recurrence when a thread
      declared `Locking_Protocol => Stop_For_Lock` but no
      `Spar_Timing::Critical_Section_Blocking`. Stop_For_Lock = priority
      inversion exposure, so silent B=0 is unsound under shared
      resources. v0.9.2 emits a Warning when the combination is
      detected: the user must either supply the bound or re-declare
      the protocol. Per the post-v0.9.0 reviewer's Tier A #6.
    status: implemented
    tags: [analysis, scheduling, rta, soundness, v092]

  - id: REQ-ARINC-005
    type: requirement
    title: ARINC-PARTITION-ISOLATION promoted to Error severity
    description: >
      ARINC 653 / DO-297 spatial isolation is a hard invariant — a
      cross-partition direct port connection breaks IMA. v0.8.x
      reported it as Warning, which an analysis-error gate would let
      pass. v0.9.2 promotes the severity to Error. A new
      `spar analyze --allow arinc-partition-isolation` flag demotes
      it back to Warning for legitimate IMA bypasses (rare). Per the
      post-v0.9.0 reviewer's Tier A #9.
    status: implemented
    tags: [analysis, arinc653, safety, v092]

  - id: REQ-TSN-005
    type: requirement
    title: Spar_TSN::Hi_Credit + Lo_Credit user-tunable CBS credits
    description: >
      Spar_TSN::Hi_Credit and Spar_TSN::Lo_Credit (both
      `aadlinteger units Size_Units`, applied to port and connection)
      let users override the v0.8.1-default CBS credit bounds (which
      were hardcoded to `max_competing_frame_bytes` for both, making
      the CBS recovery term `loCredit/|sendSlope|` constant and
      load-bearing on the bound for any tight AVB design). Real
      Qcc/YANG configs (`ieee802-dot1q-bridge`, `tsn-stream`) carry
      these per traffic class. v0.9.2 adds the property surface plus
      the `WcttCbsCredit` Info diagnostic that fires when at least
      one credit is explicit. Default unset → byte-identical to
      v0.8.1/v0.9.1. Per the post-v0.9.0 reviewer's Tier A #8.
    status: implemented
    tags: [network, tsn, cbs, wctt, v092]

  - id: REQ-NETWORK-012
    type: requirement
    title: WCTT sensitivity output (∂σ_self, ∂ρ_competing, ∂T_link)
    description: >
      For each `WcttBound` Info diagnostic the `WcttAnalysis` pass also
      emits a `WcttSensitivity` Info diagnostic carrying worst-hop
      partial derivatives at the operating point: ∂WCTT/∂σ_self
      (ps per byte of self-burst, dominated by the worst hop's
      residual service rate), ∂WCTT/∂ρ_competing (ps per bps of
      competing rate, σ/(R-ρ)² at the worst hop), and ∂WCTT/∂T_link
      (chain-rule passthrough = number of hops). Pure post-processing
      on the existing closed-form delay/output bounds — no new bounds
      math, no impact on `WcttBound` numeric output. Per the
      post-v0.9.0 reviewer's NC top-5 #13: cheapest workflow win,
      turns spar from judge into design partner.
    status: implemented
    tags: [network, wctt, sensitivity, v092]

  - id: REQ-NETWORK-013
    type: requirement
    title: Piecewise-affine arrival curves (T-SPEC multi-bucket)
    description: >
      v0.9.3 adds a `PiecewiseAffineArrivalCurve` Network Calculus
      primitive alongside the existing single-bucket `ArrivalCurve`.
      The piecewise form encodes T-SPEC-style multi-leaky-bucket
      constraints `α(t) = min_i (σ_i + ρ_i · t)` — capturing both
      short-horizon burst (small σ, high ρ) and long-horizon sustained
      behaviour (large σ, low ρ) in a single curve. The four operators
      (`backlog_bound`, `delay_bound`, `output_bound`,
      `residual_service`) extend per-bucket: backlog/delay take the
      min over per-bucket bounds (the binding bucket determines the
      bound at any operating point), output bound preserves the
      piecewise structure with each bucket inflated independently
      (Le Boudec & Thiran 1.4.3 applied per-bucket), and residual
      service lowers conservatively to a single rate-latency curve
      using `R - max ρ_i` and the worst per-bucket burst-drain time.
      `From<ArrivalCurve>` round-trips the single-bucket case; the
      peak-capped affine form lowers to a 2-bucket PWA. wctt.rs
      consumers continue to use `ArrivalCurve` for v0.9.3 (no test
      bound changes); switching the WCTT propagation to piecewise is
      a follow-up commit. Lean theorems on the piecewise form are
      skeletoned in `proofs/Proofs/Network/MinPlusPwa.lean` for a
      future v1.0.0 sweep — `MinPlus.lean` (the single-bucket spec)
      is unchanged. Per the post-v0.9.2 reviewer's NC top-5 #1: the
      highest-leverage tightness item; typically halves bounds on
      real ADAS traffic.
    status: implemented
    tags: [network, wctt, network-calculus, piecewise, v093]

  - id: REQ-NETWORK-011
    type: requirement
    title: RTA→WCTT release-jitter coupling
    description: >
      v0.9.2 closes the RTA↔WCTT loop the post-v0.9.0 reviewer flagged
      as the single biggest credibility lift (NC top-5 #4): when a
      WCTT stream's source end station declares
      `Timing_Properties::Dispatch_Jitter`, that value is treated as
      ingress release-jitter J and inflates the arrival burst by
      `ρ·J` bytes (ceiling-rounded so the bound is never under-
      estimated). New `WcttRtaCoupled` Info diagnostic per stream
      echoes the (jitter_ps, jitter_burst_bytes) pair. Default unset
      = 0 → byte-identical to v0.8.1 / v0.9.1. The full automatic
      coupling (consume RTA's *computed* response_time directly
      without requiring the user to propagate via Dispatch_Jitter)
      is a v0.9.x follow-up.
    status: implemented
    tags: [network, wctt, rta, coupling, v092]

  - id: REQ-NETWORK-014
    type: requirement
    title: PMOO/LUDB bound for tree-shaped multiplexing
    description: >
      v0.9.3 adds an opt-in Pay-Multiplexing-Only-Once / Bisti-LUDB
      ("Linear Upper Delay Bound") path in `spar-network::pmoo` that
      the `WcttAnalysis` pass invokes when (a) the stream's tandem is
      composed entirely of FIFO/Priority switches, (b) every other
      stream that crosses any hop on the tandem does so on a contiguous
      sub-path (PMOO precondition), and (c) ≥ 2 such competing flows
      exist (otherwise PMOO ≡ SFA). The LP is set up via `good_lp` with
      the HiGHS backend already vendored for the deployment solver;
      on infeasibility (`Σ ρ ≥ R_h` at any hop) we silently fall back
      to per-hop SFA. New `WcttPmooBound` Info diagnostic reports the
      method (=ludb), the PMOO delay, the SFA delay for comparison,
      the percentage tightening, and the LP solve time. Closes the
      external reviewer's NC top-5 #2 (credibility gap with RTaW-Pegase):
      typical 30-60% tightening on automotive zonal aggregations,
      observed 23-27% on the in-tree fixtures. CLI `--pmoo` flag opts
      in; default off → byte-identical to v0.9.2.
    status: implemented
    tags: [network, wctt, pmoo, ludb, lp, v093]

  # ── Track G: spar-insight discrepancy assistant (v0.9.0) ──────────

  - id: REQ-INSIGHT-001
    type: requirement
    title: Tier 1 CTF ingestion + per-probe timing distributions
    description: >
      spar-insight ingests Tier 1 CTF traces from Zephyr (`k_sem_give`,
      `k_sem_take`, `k_timer_expiry` plus `probe_point_enter` /
      `probe_point_exit` markers) and produces a per-probe-point timing
      distribution (min / max / mean over the observed
      enter→exit durations) comparable to the
      `Spar_Trace::Expected_BCET` / `Expected_WCET` / `Expected_Mean`
      predictions declared on AADL components. Tier 1 of the Gale
      tracing strategy in the project memory; full binary CTF +
      babeltrace2 ingestion is a v0.9.x follow-up.
    status: implemented
    tags: [insight, trace, ctf, tier1, v090]

  - id: REQ-INSIGHT-002
    type: requirement
    title: Rules-based discrepancy detection (5 kinds)
    description: >
      Rules-based discrepancy detection emits structured diagnostics
      keyed by probe id: `WcetViolated` (Error,
      observed.max > Expected_WCET), `BcetUnderestimated` (Warn,
      observed.min < Expected_BCET), `MeanDrift` (Info,
      |observed.mean − Expected_Mean| > 20% of Expected_Mean),
      `MissingProbe` (Info, trace samples for an undeclared probe),
      and `UnobservedProbe` (Warn, declared `Expected_*` with no trace
      samples). Wired into the CLI as
      `spar insight verify-trace --root Pkg::Sys.Impl --trace trace.ctf
      model.aadl`. The formal-statistics layer (Hoeffding bounds, etc.)
      is deferred per project memory's R3 proof-assistant deferral.
    status: implemented
    tags: [insight, trace, cli, v090]

  # ── Track E commit 8/8 — MCP oracle surface (v0.9.0) ──────────────────

  - id: REQ-MCP-002
    type: requirement
    title: spar-mcp read-only verification-oracle tool surface
    description: >
      System exposes read-only / idempotent MCP (Model Context Protocol)
      tools `spar.verify_move`, `spar.enumerate_moves`, and
      `spar.check_chain` for AI agent integration. The three tools wrap
      the existing `spar moves verify`, `spar moves enumerate`, and
      end-to-end latency-analysis pipelines without printing — each tool
      returns the same structured JSON shape the equivalent CLI
      subcommand emits with `--format json`. The deterministic apply
      path stays CLI-exclusive: there is no `spar.apply_move` tool over
      MCP, ever, by certification design (per Track E migration research
      §6.5). LLM agents propose moves; spar deterministically verifies;
      certification chain stays in spar. The transport is JSON-RPC 2.0
      over stdio per MCP 2025-11-25; the server is reachable as either a
      standalone `spar-mcp` binary or via the `spar mcp serve`
      subcommand. All three tools declare `readOnlyHint: true` and
      `idempotentHint: true` in their MCP annotations and refuse to
      mutate the model file on disk. Track E commit 8/8 of the v0.9.0
      design.
    status: implemented
    tags: [mcp, migration, track-e, v090, integration]

  # ── Track G — v0.10.0 trace-topology foundation ──────────────────────

  - id: REQ-TRACE-TOPOLOGY-001
    type: requirement
    title: Spar_Identity property surface
    description: >
      System shall expose a Spar_Identity property set that lets
      AADL declare runtime-observable identities for the v0.10.0+
      `spar trace topology` reconciler. The set carries six
      properties: MAC_Address (aadlstring; device, processor),
      VLAN_ID (aadlinteger 0 .. 4094; connection, bus),
      Stream_Handle (aadlinteger; connection), Multicast_Group
      (aadlstring; connection), LLDP_Chassis_Id (aadlstring;
      device, processor, bus), and LLDP_Port_Id (aadlstring; bus
      access feature). The set is registered as a predefined
      (non-AS5506) property set so AADL annotations resolve without
      explicit `with` imports, mirroring Spar_TSN, Spar_Network,
      Spar_Migration, and Spar_Power. Per the v0.10.0 trace-topology
      foundation design (docs/designs/v0.10.0-trace-topology.md §3).
    status: implemented
    tags: [trace-topology, track-g, v0100, properties]

  - id: REQ-TRACE-TOPOLOGY-002
    type: requirement
    title: spar-trace-topology crate skeleton
    description: >
      System shall expose a spar-trace-topology crate carrying the
      foundation surface for runtime/declared topology
      reconciliation. v0.10.0 ships four modules: `identity` (typed
      accessors for the six Spar_Identity properties, typed-first
      / string-fallback per the existing Spar_TSN pattern),
      `ingest` (placeholder traits FrameSource / TopologySource /
      SwitchConfigSource / PtpTimeSource for the v0.10.x parsers),
      `reconcile` (ReconcileFinding enum with the five
      deterministic check kinds — IdentityUnknown,
      TopologyMissingWiring, ConfigDrift, GptpOutOfBudget,
      BinaryMismatch), and `report` (TopologyReport struct
      aggregating findings). v0.10.0 ships no real parsing, no
      reconciliation logic, no SARIF emission, and no in-toto
      attestation; those land in v0.10.x sibling commits and
      v0.11.0 / v1.0 respectively per the design doc's
      §"Implementation phasing". The in-toto attestation predicate
      URL is `https://pulseengine.eu/spar-trace-topology/v1`. Per
      docs/designs/v0.10.0-trace-topology.md and the companion
      external-integrator contract docs/contracts/spar-trace-topology-v1.md.
    status: implemented
    tags: [trace-topology, track-g, v0100, crate]

  - id: REQ-RTA-010
    type: requirement
    title: Interrupt_Overhead folds into ISR WCET (Tier A #5 cont.)
    description: >
      System shall fold the `Spar_Timing::Interrupt_Overhead` property
      into each ISR's effective WCET as 1× per firing — vector dispatch,
      ISR-context save/restore, EOI ack — when computing RTA. Mirrors the
      `Context_Switch_Time` 2× inflation for tasks (REQ-RTA-009 / PR
      #198) but applied 1× because the ISR pays this cost once per
      firing, not twice. Closes the Tier A #5 reviewer follow-up after
      v0.9.2's task-side context-switch fix.
    status: implemented
    tags: [rta, timing, isr, v093, tier-a-5]

  - id: REQ-RTA-ARINC-SUPPLY-001
    type: requirement
    title: ARINC-653 partition-supply-derived inner response-time bound
    description: >
      System shall, for inner threads bound under an ARINC-653 virtual
      processor (periodic resource Γ = (Π, Θ), parsed today for
      ARINC-WINDOW-UTILIZATION), emit a per-thread worst-case
      response-time bound that accounts for the partition *supply*, not
      wall-clock, by extending the Lean-verified jittered+blocking RTA
      recurrence (scheduling_verified::compute_response_time_jittered_blocking,
      RTAJittered.lean, 0 sorry) with:

      (b) a supply-derived release jitter J_i = 2(Π−Θ) (the worst-case
      contiguous blackout of the periodic resource), computed from the
      enclosing VP's (Period, Execution_Time) and injected into the
      recurrence in place of the user Dispatch_Jitter path for
      partition-bound threads; the busy-window w-form is emitted as
      R_i = 2(Π−Θ) + w_i where w_i is the fixed point of
      w = C_i + B_i + Σ_{hp j}⌈(w+J_j)/T_j⌉·C_j (each hp J_j = 2(Π−Θ)),
      sound under the side condition w_i ≤ Θ.

      (c) a cooperative non-preemptive blocking term B_i = max_{lp} C_j^seg
      (longest lower-priority run-to-completion poll segment), carried in
      the existing blocking_ps slot.

      (d) a demand-vs-supply fallback when w_i > Θ: with linear supply
      lower bound lsbf_Γ(t) = ⌊(Θ/Π)·(t − 2(Π−Θ))⌋ (0 for t ≤ 2(Π−Θ)),
      the emitted bound is R_i = min{ t ∈ (0, D_i] : rbf_i(t) ≤ lsbf_Γ(t) }
      with rbf_i(t) = C_i + B_i + Σ_{hp j}⌈t/T_j⌉·C_j (no supply-derived
      jitter in rbf — the sbf already carries the blackout). Unschedulable
      or ill-formed sets (no admissible t, Θ > Π, or the existing
      overcommit gate) produce a hard Error of the same severity class as
      ARINC-WINDOW-UTILIZATION — never a silently-wrong number. The v1
      fallback is scoped to J^extra = 0; the extra-jitter + fallback
      combination is declined with the same hard Error, not analyzed with
      jitter dropped.

      PROVEN (Lean, 0 sorry): monotonicity and least-fixed-point
      convergence of the recurrence WITH the constant blocking term
      (rta_step_jittered_blocking C J B = rta_step_jittered C (J+B) — both
      own-jitter and blocking are pure additive constants, so the existing
      RTAJittered theorems transfer by instantiation; a thin corollary
      records it); that lsbf_Γ is monotone in t and zero below the
      blackout; and the CONDITIONAL fallback soundness — GIVEN the supply
      guarantee, passing rbf(t) ≤ lsbf_Γ(t) implies real demand ≤ real
      supply at t (fallback_sound_of_supply_guarantee, pure transitivity).

      ASSUMED (the OS's obligation, the theorem's hypothesis, NOT spar's
      proof): that the partition scheduler actually delivers supply ≥
      lsbf_Γ(t) in every interval of length t — i.e. that lsbf_Γ is a
      sound lower bound of the resource's real supply. spar does NOT
      formalize the periodic-resource supply-bound function or prove
      lsbf_Γ ≤ supply; it is the SupplyGuarantee hypothesis. gust owns
      this contract.

      Honesty caveats carried in spar's docs for this feature: (1) the
      emitted bound is only as sound as its inputs — C_i / C_j^seg / Θ
      must come from a sound static WCET bound, not measured
      high-water-marks; (2) an unqualified proof assistant carries no
      tool-qualification credit by itself — the machine-checked bound is a
      safety-case input, not a certification claim. Tracks issue #331;
      companion input-side issue synth#778.
    status: verified
    tags: [rta, arinc653, supply, timing, proofs, v0280]
    release: v0.28.0
    links:
      - type: traces-to
        target: REQ-RTA-001
      - type: traces-to
        target: REQ-PROOF-SCHED-001
      - type: traces-to
        target: REQ-PROOF-ARINC653-001

  - id: REQ-TRACE-TOPOLOGY-004
    type: requirement
    title: LLDP JSON TopologySource for runtime adjacency ingest
    description: >
      System shall provide an `lldpctl -f json`-backed
      TopologySource implementation in spar-trace-topology that,
      given a JSON dump produced by lldpd's `lldpctl -f json`, yields
      a list of LldpNeighbor records carrying local_port, typed
      remote_chassis_id (with id type), typed remote_port_id (with id
      type), and optional remote_system_name. Handles both the
      single-interface object form and the multi-interface array
      form lldpd emits. Per the v0.10.0 trace-topology design's
      §"Implementation phasing" LLDP entry.
    status: implemented
    tags: [trace-topology, ingest, lldp, v0100]

  - id: REQ-TRACE-TOPOLOGY-003
    type: requirement
    title: PCAPNG FrameSource for L2 frame ingest
    description: >
      System shall provide a PCAPNG-backed FrameSource implementation
      in spar-trace-topology that, given a `.pcapng` file recorded
      with tcpdump / tshark / Wireshark from a TAP/SPAN port, yields
      a stream of CapturedFrame records carrying mac_src, mac_dst,
      optional 802.1Q VLAN-ID and PCP, and a Unix-epoch ns timestamp
      derived from the per-IDB ts_resol option. Built atop the
      `pcap-parser` crate. Errors carry concrete kinds (Truncated,
      UnsupportedLinkType, MalformedPcapng, Io). Per the v0.10.0
      trace-topology design's §"Implementation phasing" PCAPNG entry.
    status: implemented
    tags: [trace-topology, ingest, pcapng, v0100]

  - id: REQ-TRACE-TOPOLOGY-005
    type: requirement
    title: Qcc YANG SwitchConfigSource for TSN switch-config ingest
    description: >
      System shall provide a JSON-backed SwitchConfigSource implementation
      in spar-trace-topology that, given a `ieee802-dot1q-tsn-types`-shaped
      JSON dump retrieved over NETCONF/RESTCONF (or extracted from a `tc
      qdisc` snapshot transformed to the canonical shape), yields a list
      of PortConfig records carrying port_name plus optional
      gate_control_list (802.1Qbv TAS gates), bandwidth_reservation_permille
