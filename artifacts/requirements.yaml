  - id: REQ-PROOF-NC-CERT-001
    type: requirement
    title: "Min-plus computation certificate checker"
    description: >
      A trusted checker shall re-validate the min-plus computation
      trace emitted by the (untrusted) NC engine (Minerve / Isabelle
      result-checker pattern; CertiCAN is the only template, for CAN
      not NC). HONEST CEILING (non-negotiable): the certificate
      certifies the min-plus COMPUTATION / TRACE, NOT a proven
      end-to-end delay bound — the operation→delay theorem link is
      unmechanized in any prover. MARKETING RULE: do not market
      "verified network calculus" until REQ-PROOF-NC-MINPLUS-001 closes
      and a concrete cert-driven buyer asks. [SOLID]
    status: proposed
    tags: [proof, certificate, network-calculus, soundness, tier3]
    fields:
      release: v0.21.0
