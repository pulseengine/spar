  # --- Tier 2: the product bet (synthesis → export), kill-gated ---

  - id: REQ-TSN-SYNTH-QBV-BASE-001
    type: requirement
    title: "802.1Qbv GCL synthesis baseline — per-class single-window, exact TAS round-trip"
    description: >
      spar shall synthesize a 802.1Qbv gate-control list for one
      TAS-gated egress port from a per-class demand set (aggregate
      arrival curve + per-hop deadline budget per class), a fixed cycle
      period, and the link rate. Each class receives one contiguous open
      window (mask = 1<<cos) sized by a monotone search so its
      tas_residual_service curve (REQ-TSN-002) meets the class deadline
      under the EXACT network-calculus delay bound; the leftover is a
      closed guard window (mask=0). Latency-pessimistic by construction:
      with one window per class the worst-case gate latency is
      cycle − duration and window ORDER is provably a no-op on every
      computed bound — closing the residual gap requires window SPLITTING
      (REQ-TSN-SYNTH-QBV-001). Self-certifying: the synthesized GCL
      round-trips through GateSchedule::parse and is re-checked per class
      via delay_bound before return — the existing checker is a free
      exact oracle for the synthesizer. NO new dependency (existing
      tsn.rs + curves.rs). Precursor to REQ-TSN-SYNTH-QBV-001, mirroring
      REQ-NC-PLP-CONVERGE-001 → REQ-NC-PLP-003. [SOLID]
    status: implemented
    tags: [tsn, synthesis, qbv, tier2]
    fields:
      release: v0.20.0

  - id: REQ-TSN-SYNTH-QBV-SPLIT-BASE-001
    type: requirement
    title: "802.1Qbv window-splitting synthesis baseline — even K-split, smallest feasible K"
    description: >
      spar shall synthesize a window-SPLITTING 802.1Qbv gate-control list
      that pulls the worst-case-latency lever the single-window baseline
      (REQ-TSN-SYNTH-QBV-BASE-001) cannot: splitting a class's allocation
      into K evenly-spaced windows cuts its worst-case gate latency to
      (cycle − open)/K at the SAME bandwidth, so a port that single
      windows leave Oversubscribed (each latency-bound class needing a
      wide window to reach a low latency) becomes feasible.
      `synthesize_gcl_split` uses the network-calculus identity that a
      K-way even split on cycle c is identical to a single window on cycle
      c/K (same rate, same latency = c/K − w): it synthesizes one round on
      c/K with the existing single-window search and replicates it K
      times, returning the SMALLEST feasible K (fewest windows). K=1
      reproduces synthesize_gcl exactly; the result SELF-CERTIFIES on the
      full multi-window schedule against the SOUND latency
      (REQ-TSN-SVC-MULTIWIN-001 / min_service_latency_ps) — the
      counterexample regime that makes this non-trivial. NC-level baseline:
      the model is guard-band-free, so `max_windows_per_class` caps the
      search off the rate-loss cliff a guard-band-aware model imposes
      (deployable claim = REQ-TSN-SYNTH-QBV-GUARDBAND-001). Precursor to
      the full dependency-aware REQ-TSN-SYNTH-QBV-001, mirroring
      REQ-TSN-SYNTH-QBV-BASE-001 → REQ-TSN-SYNTH-QBV-001. Incremental
      synthesis (table-stakes vs RTaW), NOT the PLP≪TFA wedge. [SOLID]
    status: implemented
    tags: [tsn, synthesis, qbv, tier2]
    fields:
      release: v0.21.0

  - id: REQ-TSN-SYNTH-QBV-GUARDBAND-001
    type: requirement
    title: "802.1Qbv guard-band-aware window-splitting (deployable GCL claim)"
    description: >
      Follow-up to REQ-TSN-SYNTH-QBV-SPLIT-BASE-001, which synthesizes
      split GCLs over a guard-band-FREE model (sound at the NC
      service-curve level, but NOT a deployable-hardware claim — real
      802.1Qbv loses ~K guard bands of transmit time to frame-straddle
      protection per IEEE 802.1Q §8.6.8.4 TransmissionOverrun, which the
      baseline model does not see, so it can over-state available rate by
      ~N·K·g/cycle). spar shall charge the per-window guard band
      g (≈ queueMaxSDU·8 / link_rate) so the synthesizer's
      "meets deadline" claim becomes deployment-sound.
      Implementation (synthesize_gcl_split_guarded): each class's USABLE
      open window is sized by the same validated single-window search the
      guard-free path uses (the guard does not change the service a class
      receives — open w, latency cycle/K − w — only the PACKING budget),
      then the emitter reserves an explicit trailing closed guard window
      of g after every class window so the budget becomes Σwᵢ + N·g ≤
      cycle/K and the DEPLOYED GCL physically contains the guards a switch
      enforces. The breakeven/self-starvation cliff (guards growing as
      N·K·g while latency benefit shrinks as 1/K) is enforced
      automatically: when no split fits, the oracle returns
      GuardOversubscribed rather than an unsound GCL. Model soundness is
      pinned non-circularly by TEST-TSN-GUARDBAND's K=1 anchor — "emit a
      (D−g)-open window" is proven algebraically identical to the shipped
      tas_residual_service_with_sync_error at ε = g (open D−g, latency
      C−D+g, rate R·(D−g)/C from two independent derivations). g rounds UP
      to a whole ns (sound direction); g = 0 reproduces
      REQ-TSN-SYNTH-QBV-SPLIT-BASE-001 byte-for-byte. NO new dependency
      (existing tsn.rs + curves.rs). Precursor to the full
      dependency-aware REQ-TSN-SYNTH-QBV-001. SCOPE: this is the
      deployment-sound GCL PRODUCER — the GateSchedule it returns
      physically carries the guard bands a switch enforces. Like the whole
      synthesize_gcl* family it is library API; no synthesizer is yet wired
      into a CLI / AADL→Qbv consumer, so this REQ makes no end-to-end
      pipeline claim — consumer wiring is separate future work. [SOLID]
    status: verified
    release: v0.22.0
    tags: [tsn, synthesis, qbv, guard-band, tier2]

  - id: REQ-TSN-SYNTH-QBV-001
    type: requirement
    title: "802.1Qbv GCL synthesis — dependency-aware, window-splitting, mixed-criticality"
    description: >
      spar shall synthesize 802.1Qbv gate-control lists directly
      (inverse of the existing TAS checking, REQ-TSN-002) via
      dependency-aware priority adjustment with WINDOW SPLITTING
      (arXiv:2407.00987, 2024): ~300 flows, mixed-criticality, +20.6%
      success over SOTA. The even-split LEVER shipped as the precursor
      REQ-TSN-SYNTH-QBV-SPLIT-BASE-001 (smallest feasible K, NC-level,
      self-certified against the sound bound); this requirement is the
      FULL contribution that remains — dependency-aware priority/placement
      (not just even splits) and mixed-criticality across ~300 flows.
      KILL-GATE: kill the AADL→TSN bridge if we cannot articulate why our
      integrated architecture-to-timing story beats RTaW's already-cert-
      accepted ARXML→TSN+NC. [SOLID]
    status: proposed
    tags: [tsn, synthesis, qbv, tier2]
    fields:
      release: v0.23.0

  - id: REQ-NC-TAS-COMPOSE-001
    type: requirement
    title: "Sound network-wide composition of per-port TAS residual service curves (the PLP≪TFA wedge loop)"
    description: >
      spar wants to compose synthesized per-egress-port 802.1Qbv TAS
      residual service curves (REQ-TSN-SVC-MULTIWIN-001) network-wide via
      the existing TFA/PLP engine (wctt.rs::network_wide_nc_bounds) to get
      sound end-to-end per-flow bounds and demonstrate PLP ≪ TFA tightness
      on gated tandems/lines — the strategic differentiator and the
      network-wide oracle REQ-TSN-SYNTH-MILP-001 needs.
      GO/NO-GO VERDICT = NO-GO (2026-06-24, fresh-context refute-framed
      experiment, panco oracle; code claims verified against current main):
      (1) UNSOUND AS NAIVELY SPECIFIED. The proposed "relabel a TSN hop as
      FIFO to bypass the network_wide_nc_bounds guard (wctt.rs:978-995)"
      does NOT change which curve the composition reads.
      network_wide_nc_bounds reads service_for_bus[hop] (wctt.rs:1007),
      which is populated UNCONDITIONALLY at wctt.rs:183 with the FULL
      LINE-RATE curve ServiceCurve::rate_latency(Output_Rate, wcet); the
      TAS residual is rebuilt separately in the per-hop SFA walk
      (wctt.rs:346-361) and never written back (confirmed by the
      wctt.rs:169-172 comment). Counterexample: one gated port, GCL
      `0:20000:0x04;20000:80000:0x00` (20µs open / 80µs closed), two
      same-class flows α=(1500B,50Mbps): the relabel feeds β=(1Gbps,0) →
      panco FIFO-exact = 24.0µs, but a frame arriving as the gate closes
      cannot be served for ≥80µs (physics floor) → 24 < 80 → UNSOUND. The
      correct residual β=(200Mbps,80µs) (tsn.rs:1042/1106) → panco = 200µs
      (sound). So the current guard is RIGHT to bail; bypassing it is the
      bug.
      (2) THE OPEN QUESTION (C) IS NOT ESTABLISHABLE WITH AVAILABLE
      ORACLES even if the plumbing is fixed. panco validates composition of
      given rate-latency curves (step B, REQ-NC-VALIDATION-001) but CANNOT
      inject a TAS gate (panco/README:29-31); whether composing
      phase-worst-case residuals across MULTIPLE gated hops under
      multi-flow shared-class FIFO with gate phase CORRELATED across hops
      stays a sound upper bound needs a TAS-matched simulator floor
      (REQ-NC-SIM-FLOOR-001). FALSE-GO TRAP: a shallow fix of (1) that
      plumbs the residual and re-runs the single-hop scenario yields
      200µs ≥ truth and could be mistaken for a GO — it is NOT, because it
      never exercises (C). [BLOCKED — research-grade]
    status: proposed
    tags: [network-calculus, tsn, tas, composition, wedge, research-grade, blocked]
    fields:
      release: v0.23.0

  - id: REQ-NC-SIM-FLOOR-001
    type: requirement
    title: "TAS-matched discrete-event simulation floor (oracle-kind-(a)) for gated-hop NC validation"
    description: >
      spar shall validate 802.1Qbv TAS / gated-hop network-calculus bounds
      against a TAS-matched discrete-event simulator (OMNeT++/INET or
      equivalent) — the stronger oracle-kind-(a) simulation floor noted as
      deferred in tests/oracles/panco/README.md (lines 28-31). This is the
      ONLY oracle that can settle the open soundness question (C) in
      REQ-NC-TAS-COMPOSE-001: NC-tool agreement (panco/xTFA/DNC) is
      structurally incapable of it because those tools validate
      FIFO/CBS/ATS rate-latency-server networks, not gate schedules. Until
      this exists, sound network-wide composition of TAS residuals across
      multiple gated hops cannot be certified, and any such bound must
      either keep the network_wide_nc_bounds TSN-hop guard (bail) or be
      labelled research-grade. Gates REQ-NC-TAS-COMPOSE-001 and, through
      it, the network-wide arm of REQ-TSN-SYNTH-MILP-001.
    status: proposed
    tags: [network-calculus, tsn, tas, simulation, oracle, substrate]
    fields:
      release: v0.23.0

  - id: REQ-TSN-SYNTH-MILP-001
    type: requirement
    title: "TSN schedule synthesis — MIP→VNS-GA scale handoff"
    description: >
      spar shall synthesize TSN schedules on the existing HiGHS/good_lp
      MILP backend via the MIP→VNS-GA handoff (Wang et al., Sensors
      2025): exact MIP ≤ ~1,000 flows, then VNS-GA (genetic +
      2-opt/or-opt/exchange) up to ~3,000 flows. The cleanest concrete
      scale recipe sitting directly on the current solver.
      GATING (updated 2026-06-24): the NETWORK-WIDE arm — where windows
      couple across hops and a sound end-to-end NC oracle is needed —
      depends on REQ-NC-TAS-COMPOSE-001, which is NO-GO/blocked pending the
      simulator floor REQ-NC-SIM-FLOOR-001. A single-port window-sizing
      MILP (the per-port problem already solved structurally by
      REQ-TSN-SYNTH-QBV-SPLIT-BASE-001) does not need that oracle, but it
      also does not earn MILP's keep over the existing greedy synthesizer.
      So MILP stays gated on the composition oracle, not buildable as a
      clean baseline yet. [gated]
    status: proposed
    tags: [tsn, synthesis, milp, tier2]
    fields:
      release: v0.23.0

  - id: REQ-TSN-SYNTH-CQF-BASE-001
    type: requirement
    title: "CQF synthesis baseline — single cycle-time, 2-buffer, literature-pinned delay bound"
    description: >
      spar shall synthesize a standard 802.1Qch CQF configuration (two
      cyclic buffers, one global cycle time T) for a set of reserved
      flows, each declaring a per-cycle reservation (csize contribution
      in bits), a hop count H, an end-to-end deadline, and the links it
      traverses. The synthesizer selects the largest whole-nanosecond
      cycle time T meeting every flow's structural deadline
      (D_max = (H+1)·T, per IETF draft-eckert-detnet-tcqf-05) and admits
      the flows iff every link's aggregate per-cycle reservation fits the
      cycle budget csize = T·link_rate. The two feasibility checks are
      LOCAL and fully decoupled — CQF's bounded delay depends only on
      (hops, T), not on per-link load — so NO network-calculus curve
      composition is required (this is why CQF routes around the
      NC-composition bridge that MILP needs). Self-certifying: the
      independent CQF checker re-derives D_max per flow and the per-link
      budget before return. The checker's delay formula is PINNED to the
      published worked example (h=24, T=10us => (24+1)*10 = 250us) so the
      duality oracle anchors to external ground truth, not to the
      synthesizer's own assumptions. NO new dependency (pure arithmetic).
      Precursor to REQ-TSN-SYNTH-CQF-001 (Multi-CQF/TCQF), mirroring
      REQ-TSN-SYNTH-QBV-BASE-001 → REQ-TSN-SYNTH-QBV-001. [SOLID]
    status: implemented
    tags: [tsn, synthesis, cqf, tier2]
    fields:
      release: v0.20.0

  - id: REQ-TSN-SYNTH-CQF-BRIDGE-001
    type: requirement
    title: "AADL→CQF synthesis bridge — extract CqfFlow inputs from a SystemInstance and synthesize end-to-end"
    description: >
      spar shall extract the CQF synthesis inputs
      (REQ-TSN-SYNTH-CQF-BASE-001) directly from an AADL SystemInstance and
      surface the synthesized schedule (or a synthesis error) as analysis
      diagnostics, so that a real AADL model — not a hand-built CqfFlow set —
      drives standard 802.1Qch CQF configuration. For each end-to-end stream
      (a non-bus-access connection whose endpoints are both end stations and
      which carries Actual_Connection_Binding to switched buses) the bridge
      derives: the per-cycle reservation in bits from Spar_TSN::Max_Frame_Size
      on the source (one frame buffered per cycle), the end-to-end deadline
      from Timing_Properties::Deadline, and the hop count H and link path from
      the bound switch sequence — reusing the SAME routing resolution as the
      WCTT walk (collect_streams), not a parallel reimplementation. The
      homogeneous link rate fed to synthesize_cqf is the MINIMUM
      Spar_Network::Output_Rate across the switches (conservative for the
      single-csize baseline). This is table-stakes AADL→TSN-config glue — the
      demonstrable end-to-end ship — and is explicitly NOT the PLP≪TFA wedge:
      it composes NO network calculus. SOUNDNESS GUARD: the one-frame-per-cycle
      reservation is sound only when the synthesized cycle time T does not
      exceed each flow's period; the bridge verifies T≤period post-synthesis
      and emits a diagnostic rather than silently under-reserve on the
      AADL-legal-but-rare deadline>period edge case. NO new dependency (reuses
      synthesize_cqf plus the existing spar-network property readers). [SOLID]
    status: implemented
    tags: [tsn, synthesis, cqf, bridge, aadl, tier2]
    fields:
      release: v0.20.0

  - id: REQ-TSN-SYNTH-CQF-001
    type: requirement
    title: "Multi-CQF / TCQF synthesis (heterogeneous cycles, injection planning, larger scale)"
    description: >
      spar shall synthesize Multi-CQF / TCQF configurations — three to
      seven tagged cyclic buffers and heterogeneous cycle times, the
      simpler-config, larger-scale direction with real 2026 momentum
      (TCQF adopted as IETF DetNet WG item draft-ietf-detnet-tcqf-00,
      14 Jan 2026; CENI 2,000 km / 100 Gbps). Extends the single-cycle
      baseline (REQ-TSN-SYNTH-CQF-BASE-001) with per-flow injection-time
      planning across a hyperperiod and multi-buffer ambiguity-window
      handling. Candidate methods: hyper-flow graph decomposition
      (arXiv:2309.06690 — 2,000 flows, <100 ms @1,000) or GASA injection
      planning (arXiv:2506.22671 — GA+SA, +15% flows).
      MODEL-PINNING VERDICT (2026-06-23, primary sources): the
      HETEROGENEOUS-cycle case has NO sound closed-form per-flow delay
      bound to self-certify against the way (h±1)·T_c works for
      CQF-BASE. draft-ietf-detnet-tcqf-00 App.B only ASSERTS strict-
      priority per-hop latency (C, 2C, 3C, 4C) with no end-to-end
      composition rule and only a 25%-avg-utilization admission heuristic
      (which is unsound as a per-cycle buffer-budget test). The two
      candidate papers are HEURISTIC-with-simulation: arXiv:2506.22671's
      WCD Eq.(3) is parameterized by a GA/SA-produced injection offset
      and validated by simulation, not a standalone checkable bound. By
      contrast, MULTI-BUFFER SINGLE-cycle (B∈[3,7]) keeps the existing
      (h±1)·T_c bound unchanged — B only absorbs dead time / accommodates
      long links (tcqf-00 §2.5.1/§2.6), so it is the honest, soundly
      self-certifiable extension (carved to REQ-TSN-SYNTH-CQF-LONGLINK-001).
      This requirement (heterogeneous synthesis) is therefore RESEARCH-
      GRADE until an original, separately-proven interference/feasibility
      bound exists; deferred to v0.22.0, not a clean self-certifying
      baseline. [RESEARCH-GRADE]
    status: proposed
    tags: [tsn, synthesis, cqf, tier2, research-grade]
    fields:
      release: v0.23.0

  - id: REQ-TSN-SYNTH-CQF-LONGLINK-001
    type: requirement
    title: "Multi-buffer single-cycle CQF for long links (B-buffer dead-time accommodation)"
    description: >
      spar shall bound and synthesize CQF configurations SOUNDLY when link
      one-way latency is significant relative to the cycle (long / WAN
      DetNet links), where the shipped hop-count bound (h±1)·T_c is
      optimistic. Model (draft-ietf-detnet-tcqf / draft-eckert-detnet-tcqf-05,
      fresh-context-pinned 2026-07-01, D_max soundness validated by an
      INDEPENDENT discrete-event cycle-timeline simulation oracle — not just
      algebraic self-consistency; SUPERSEDES the earlier unsound spec whose
      interval inverted on long links):
      per-hop CYCLE-QUANTIZATION with a network dead time DT (0 ≤ DT < T_c,
      at the cycle END, ≥ max link latency). The per-hop cycle advance is
      kᵢ = 2 + ⌊(dᵢ − DT)/T_c⌋ (Euclidean division; DT SUBTRACTS — dead time
      eases same-cycle delivery); dᵢ < DT ⇒ kᵢ = 1. Bounds:
      D_max = T_c + T_c·Σᵢ kᵢ(dᵢᵐᵃˣ); D_min = T_c·Σ_{i<H} kᵢ(dᵢᵐⁱⁿ) (H−1
      intermediate hops + last-hop floor 0) — the asymmetry makes (H±1)·T_c
      emerge AND guarantees D_min ≤ D_max always (no inversion). D_min is the
      draft's nominal (H−1)·T_c figure, NOT a universal lower bound — a frame
      released just before a cycle boundary can be delivered a fraction of T_c
      sooner (sim reaches 49µs where D_min=50µs) — and it is safe precisely
      because D_min has NO buffer-sizing or minimum-latency consumer (only the
      library re-export for jitter reporting); buffers key off per-hop k.
      The bound LIBRARY (cqf_buffer_count) is multi-buffer-capable: buffers key
      off jitter Bᵢ = (kᵢᵐᵃˣ − kᵢᵐⁱⁿ) + 2, B = max(3, maxᵢ Bᵢ), ERROR if
      B > cap (never a silent down-clamp). In the synthesizer's supported
      cycle-dominates regime jitter is ≤ 1 cycle, so it emits the 3-cycle
      floor; the >3 arms are exercised by the standalone bound oracles.
      Admission budget shrinks by the dead time: csize = (T_c − DT)·rate (only
      the transmittable window; collapses to the shipped T_c·rate at DT=0). Degeneracy: every dᵢᵐᵃˣ <
      DT (with DT > 0) ⇒ all kᵢ = 1 ⇒ D_max = (H+1)·T_c, D_min = (H−1)·T_c —
      reproduces the shipped 24-hop/10µs → 250µs pin. IMPLEMENTATION
      (crates/spar-network/src/cqf.rs): standalone bound functions
      (cqf_hop_advance_cycles, cqf_delay_{max,min}_longlink_ps,
      cqf_cycle_budget_bits_with_dead_time, cqf_buffer_count) + LinkDelay,
      and synthesize_cqf_longlink returning CqfLongLinkSchedule. CqfFlow
      gains per-hop link_delays (empty ⇒ all-short; delay+cycle degenerate to
      the shipped hop-count result, though at DT>0 the csize budget is the
      reduced (T_c−DT)·rate, so admission is not byte-identical to
      synthesize_cqf).
      SCOPE (sound baseline): synthesis serves the "cycle dominates links"
      regime (T_c > every link, kᵢ ∈ {1,2}, monotonic → closed-form cycle
      selection); a deadline that would need a cycle SHORTER than a link
      returns LongLinkDeadlineTooTight rather than an unsound config — the
      sub-link multi-cycle-per-hop regime is a documented follow-up. Wiring
      the AADL bridge (cqf_synth.rs) to read per-hop Spar_Network::Latency is
      a separate follow-up (the bound + synthesizer are library-complete).
      Non-goal: not the heterogeneous-cycle ambition (REQ-TSN-SYNTH-CQF-001)
      nor the PLP≪TFA NC-tightness wedge.
    status: verified
    release: v0.23.0
    tags: [tsn, synthesis, cqf, longlink, detnet]

  - id: REQ-TSN-EXPORT-YANG-001
    type: requirement
    title: "TSN config export (802.1Qcw YANG / NETCONF)"
    description: >
      spar shall export a synthesized 802.1Qbv gate schedule
      (GateSchedule, the output of REQ-TSN-SYNTH-QBV-BASE-001) as an
      ieee802-dot1q-sched (802.1Qcw) YANG instance document in NETCONF
      XML encoding — the deployable artifact a TSN switch consumes via
      edit-config, not a network-calculus bound. Each GateWindow maps to
      one gate-control-entry (operation-name=set-gate-states,
      time-interval-value = duration in ns, gate-states-value = the
      allowed-CoS bitmask); the cycle period maps to admin-cycle-time as
      the rational cycle_ps / 1e12 s. KILL-GATE (premature if no
      synthesis target consumes the export) is now CLEARED:
      REQ-TSN-SYNTH-QBV-BASE-001 shipped a GateSchedule producer in
      v0.20.0, so export is the genuine output stage of a working
      synthesizer. This completes the ingest→synthesize→EXPORT story a
      real TSN tool sells (tsnkit/Slate/RTaW/PEGASE emit deployable
      configs, not just bounds). Self-certifying oracle: structural
      invariants on the emitted document — exactly one gate-control-entry
      per window, Σ time-interval-value == cycle, gate-states-value ==
      window mask, plus a pinned golden snapshot. NO new dependency
      (hand-serialized XML String, the to_gcl_blob precedent). The
      document is deliberately SIMPLIFIED and not yet schema-valid: the
      gate-parameter-table sits directly under interfaces/interface
      rather than the 802.1Qcw bridge-port mount, and operation-name
      carries a bare `set-gate-states` identityref with no
      module-prefixed value. Concrete follow-ups: the bridge-port mount +
      prefixed identityref to pass pyang/yanglint, and a CQF/Qch export
      path — neither claimed here.
      [SOLID — IEEE 802.1Qcw-2023 ieee802-dot1q-sched YANG]
    status: implemented
    tags: [tsn, export, yang, netconf, tier2]
    fields:
      release: v0.20.0

