# Claims ledger: the load-bearing assertions in README.md and COMPLIANCE.md,
# each bound to evidence a machine re-derives. REQ-CLAIM-LEDGER-001.
# Checked by tools/check_claims.py in the Format job.
#
#   claims     an assertion, with `evidence` (predicates that must hold) or
#              `contested` (the repo's own measurements contradict it and the
#              rewording is the maintainer's call; the count is a two-sided
#              ratchet, CONTESTED in the checker)
#   narrative  a line a watch pattern matches that asserts nothing about spar
#   watch      patterns that mark a line as a claim; every matching line must
#              be covered by an entry above, or the check fails
#
# Mark the assertions, never the narrative. A predicate that holds proves the
# stated evidence is still there, not that it supports the wording.

docs: [README.md, COMPLIANCE.md]

watch:
  - pattern: '\bproduction[- ]grade\b'
    why: maturity word
  - pattern: '\bmature\b'
    why: maturity word
  - pattern: '\bbattle[- ]tested\b'
    why: maturity word
  - pattern: '(?i)\b(formally|fully) verified\b'
    why: verification claim
  - pattern: '(?i)\bindustry[- ]leading\b|\bcertified\b'
    why: competitive or certification claim
  - pattern: '\breplaces\b|\bpast what\b'
    why: competitive claim
  - pattern: '\b\d[\d,]*\+?\s+(\w+\s+)?(crates|subcommands|passes|tests)\b'
    why: stated count
  - pattern: 'img\.shields\.io/badge/'
    why: capability badge

claims:
  # ── README.md: stated counts ────────────────────────────────────────────
  - id: README-CRATES
    doc: README.md
    text: "23 crates, organized as compiler stages"
    evidence:
      - {kind: count, glob: "crates/*/Cargo.toml", eq: 23}

  - id: README-SUBCOMMANDS
    doc: README.md
    text: "19 subcommands incl. LSP + MCP"
    evidence:
      # The table dispatch and --help both read (REQ-CLI-SURFACE-001), so a
      # command that dispatches is counted here.
      - kind: count
        glob: "crates/spar-cli/src/main.rs"
        pattern: '^\s+"[a-z0-9-]+",$'
        region: {from: '^const COMMANDS: ', to: '^\];'}
        eq: 19
      - kind: count
        glob: "crates/spar-cli/src/main.rs"
        pattern: '^\s+"(lsp|mcp)",$'
        region: {from: '^const COMMANDS: ', to: '^\];'}
        eq: 2

  - id: README-PASSES
    doc: README.md
    text:
      - "30+ pluggable passes"
      - "30+ passes: scheduling"
      - "30+ pluggable analysis passes"
      - "30+ analysis passes"
    evidence:
      - kind: count
        glob: "crates/spar-analysis/src/lib.rs"
        pattern: 'self\.register\(Box::new\('
        region: {from: 'fn register_all\(&mut self\)', to: '^    }$'}
        min: 30

  # ── README.md: badges ───────────────────────────────────────────────────
  - id: README-BADGE-RUST
    doc: README.md
    text: "![Rust](https://img.shields.io/badge/Rust-"
    evidence:
      - {kind: file-exists, path: Cargo.toml}

  - id: README-BADGE-WASM
    doc: README.md
    text: "![WebAssembly](https://img.shields.io/badge/WebAssembly-"
    evidence:
      - {kind: file-exists, path: crates/spar-wasm/Cargo.toml}

  - id: README-BADGE-AADL
    doc: README.md
    text: "![AADL](https://img.shields.io/badge/AADL_v2.3-AS5506D-"
    evidence:
      - {kind: file-exists, path: crates/spar-parser/Cargo.toml}
      - {kind: file-exists, path: COMPLIANCE.md}

  - id: README-BADGE-SYSML
    doc: README.md
    text: "![SysML](https://img.shields.io/badge/SysML_v2-KerML-"
    contested: >-
      REQ-CLAIM-LEDGER-001 / REQ-SYSML2-CONFORMANCE-001: the parser rejects
      KerML constructs the specification's Annex A model uses, and the official
      corpus ratchet counts a minority of 310 files parsing.

  - id: README-BADGE-TSN
    doc: README.md
    text: "![TSN](https://img.shields.io/badge/TSN-Network_Calculus-"
    evidence:
      - {kind: file-exists, path: crates/spar-network/src/curves.rs}

  - id: README-BADGE-LICENSE
    doc: README.md
    text: "![License: MIT](https://img.shields.io/badge/License-MIT-"
    evidence:
      - {kind: file-exists, path: LICENSE}
      - {kind: count, glob: LICENSE, pattern: '^MIT License', eq: 1}

  # ── README.md: competitive claims ───────────────────────────────────────
  - id: README-REPLACES-OSATE
    doc: README.md
    text: "replaces the Eclipse/Java OSATE2 toolchain"
    contested: >-
      REQ-CLAIM-LEDGER-001 / REQ-RENDER-COMPOUND-001: refuted by one render
      while the renderer drops components of compound models.

  - id: README-PAST-OSATE
    doc: README.md
    text: "reaches well past what OSATE, or a single-formalism SysML v2 tool, covers"
    contested: >-
      REQ-CLAIM-LEDGER-001: not true of the SysML v2 half
      (REQ-SYSML2-CONFORMANCE-001).

  # ── COMPLIANCE.md ───────────────────────────────────────────────────────
  - id: COMPLIANCE-HEADER-COUNT
    doc: COMPLIANCE.md
    text: "2759+ tests passing across 18 crates"
    contested: >-
      A v0.9.1 snapshot (the document's own date) in the header, read as
      current: the workspace has 23 crates today.

  - id: COMPLIANCE-SYSML2-PRODUCTION
    doc: COMPLIANCE.md
    text: "production-grade with full requirements roundtrip"
    contested: >-
      REQ-CLAIM-LEDGER-001 / REQ-SYSML2-CONFORMANCE-001: contradicted by the
      conformance measurements.

  - id: COMPLIANCE-ANALYSIS-PASSES
    doc: COMPLIANCE.md
    text: "**10 analysis passes** cover connectivity"
    contested: >-
      A v0.9.1 snapshot: of the ten checks it names, category, naming and
      legality have no registered pass in AnalysisRunner::register_all today
      (legality is a separate engine), so the sentence cannot be re-derived.

narrative:
  - doc: COMPLIANCE.md
    text: "**Test count delta**: v0.8.0 closed at"
    why: a historical record dated by its own version numbers
  - doc: COMPLIANCE.md
    text: "pre-mature optimisation"
    why: describes a removed optimisation, not spar's maturity
  - doc: COMPLIANCE.md
    text: "replaces the simple slack metric"
    why: describes what one change replaced inside spar
