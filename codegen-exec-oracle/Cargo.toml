[package]
name = "codegen-exec-oracle"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

# Out-of-workspace (like `fuzz/`) so the heavy `wasmtime` dependency never
# poisons the main workspace build. This crate is the RUNTIME data-flow oracle
# for REQ-CODEGEN-WIT-DATAPLANE-001: it generates the data-plane crate, builds it
# to a wasm component, and RUNS it under wasmtime to prove a value the host
# supplied at an In port comes back at the wired Out port.
[workspace]

[dependencies]
anyhow = "1"
# default-features = false + wasmtime 36's full default set MINUS `cache`.
# `cache` (on-disk compiled-module cache) pulls wasmtime-internal-cache ->
# zstd 0.13 / zstd-safe 7 / zstd-sys 2.0, which carry RUSTSEC-2026-0391,
# -0398, -0403, -0410 (and a run of unsound advisories) with no fix
# reachable on the 0.13 line. This oracle never configures a module cache.
# Keep this list in sync with wasmtime's `default` on every wasmtime bump.
wasmtime = { version = "36", default-features = false, features = [
    "async",
    "gc",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "threads",
    "stack-switching",
    "std",
] }
wasmtime-wasi = "36"

spar-codegen = { path = "../crates/spar-codegen" }
spar-hir-def = { path = "../crates/spar-hir-def" }
spar-base-db = { path = "../crates/spar-base-db" }

[[bin]]
name = "exec-oracle"
path = "src/main.rs"

[[bin]]
name = "state-oracle"
path = "src/state_main.rs"
