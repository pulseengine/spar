[advisories]
# `unmaintained` was removed from this section in cargo-deny PR #611
# (the unmaintained-crate signal is now handled differently). The other
# advisory checks (yanked, vulnerability matching against rustsec/
# advisory-db) still gate normally.
yanked = "warn"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib"]

[[licenses.exceptions]]
allow = ["Unicode-DFS-2016"]
crate = "unicode-ident"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# pulseengine/rowan is rivet's Miri-soundness fork of rowan (branch
# fix/miri-soundness-v3). rivet-yaml, spar's YAML emitter for zwinger
# profiles (pulseengine/zwinger#17), depends on it through rivet's
# workspace. The fork beside registry rowan 0.16.1 is the duplication #446
# tracks.
allow-git = [
  "https://github.com/pulseengine/rivet",
  "https://github.com/pulseengine/rowan",
]
